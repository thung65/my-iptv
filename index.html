<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>VTV Prime OS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; }
        
        /* Trình phát Video */
        #video-container { position: relative; width: 100vw; height: 100vh; background: #000; }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* Logo góc màn hình */
        .prime-logo {
            position: absolute; top: 30px; right: 40px;
            font-weight: bold; font-size: 24px; color: rgba(255,255,255,0.6);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 2px; pointer-events: none;
        }

        /* Thanh thông tin kênh giống TV Box */
        #infobar {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.7) 70%, transparent 100%);
            padding: 50px 50px 30px 50px;
            transform: translateY(100%); transition: transform 0.5s ease;
            display: flex; align-items: center;
        }
        #infobar.show { transform: translateY(0); }

        .ch-number { font-size: 60px; font-weight: bold; color: #ffeb3b; margin-right: 25px; border-right: 2px solid #555; padding-right: 25px; }
        .ch-details { flex-grow: 1; }
        .ch-name { font-size: 32px; font-weight: bold; margin-bottom: 5px; }
        .ch-quality { font-size: 14px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }

        /* Màn hình chờ giải mã */
        #boot-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #333;
            border-top: 5px solid #ffeb3b; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="video-container">
    <div id="boot-screen">
        <div class="spinner"></div>
        <div style="letter-spacing: 3px; font-size: 14px; color: #aaa;">VTV PRIME • ĐANG GIẢI MÃ DRM</div>
    </div>

    <div class="prime-logo">VTV PRIME</div>

    <video id="video" autoplay playsinline></video>

    <div id="infobar">
        <div class="ch-number">01</div>
        <div class="ch-details">
            <div id="display-name" class="ch-name">ĐANG TẢI...</div>
            <div class="ch-quality">Chế độ: Ưu tiên chất lượng từ Box (2026 Ready)</div>
        </div>
        <div style="text-align: right">
            <div id="clock" style="font-size: 24px; font-weight: bold;">00:00</div>
            <div style="font-size: 12px; color: #888;">Live Stream</div>
        </div>
    </div>
</div>

<script>
    async function startPrimeBox() {
        const video = document.getElementById('video');
        const infobar = document.getElementById('infobar');
        const boot = document.getElementById('boot-screen');
        const player = new shaka.Player(video);

        // Lấy dữ liệu từ URL
        const params = new URLSearchParams(window.location.search);
        const url = params.get('videoUrl');
        const keys = params.get('keys');

        if (!url || !keys) {
            document.querySelector('#boot-screen div').innerText = "VUI LÒNG DÁN LINK HỢP LỆ";
            return;
        }

        // Tách KID và KEY
        const [kid, key] = keys.split(':');

        // Cấu hình giống Box thật
        player.configure({
            drm: { clearKeys: { [kid]: key } },
            abr: { enabled: true }
        });

        player.getNetworkingEngine().registerRequestFilter((type, request) => {
            request.headers['User-Agent'] = 'Mozilla/5.0 (VTV Prime Box; Linux) AppleWebKit/537.36';
        });

        try {
            await player.load(url);
            
            // Xử lý UI
            boot.style.display = 'none';
            infobar.classList.add('show');
            
            // Lấy tên kênh từ link (ví dụ: hbo, axn, ap)
            const chMatch = url.match(/live_dzones\/(.*?)\.smil/);
            const chName = chMatch ? chMatch[1].toUpperCase() : "KÊNH QUỐC TẾ";
            document.getElementById('display-name').innerText = chName;

            // Tự ẩn info sau 5 giây
            setTimeout(() => infobar.classList.remove('show'), 5000);
        } catch (e) {
            console.error(e);
        }
    }

    // Đồng hồ góc màn hình
    setInterval(() => {
        const now = new Date();
        document.getElementById('clock').innerText = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
    }, 1000);

    shaka.polyfill.installAll();
    startPrimeBox();
</script>
</body>
</html>
