<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV ULTIMATE - FULL VIP & GITHUB</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.debug.js"></script>
    <style>
        :root { --gold: #ffcc00; --bg: #050505; --card: #121212; --text: #ececec; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Player Area */
        #video-container { width: 100%; max-width: 1000px; margin: 0 auto; background: #000; aspect-ratio: 16/9; position: relative; border-bottom: 2px solid var(--gold); box-shadow: 0 5px 20px rgba(0,0,0,0.8); }
        video { width: 100%; height: 100%; display: block; }

        /* Navigation & Search */
        .nav-bar { padding: 12px; background: #111; display: flex; flex-direction: column; gap: 10px; }
        #search-box { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #fff; outline: none; }
        .tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
        .tab { padding: 8px 18px; background: #222; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; border: 1px solid #333; transition: 0.3s; }
        .tab.active { background: var(--gold); color: #000; border-color: var(--gold); }

        /* Channel Grid */
        #grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; padding: 15px; overflow-y: auto; }
        .card { background: var(--card); border: 1px solid #222; border-radius: 10px; padding: 12px 5px; text-align: center; cursor: pointer; position: relative; transition: 0.2s; }
        .card:hover { border-color: var(--gold); transform: translateY(-3px); background: #1a1a16; }
        .card.active { border-color: var(--gold); background: #221f00; box-shadow: inset 0 0 10px rgba(255,204,0,0.2); }
        .card img { width: 100%; height: 40px; object-fit: contain; margin-bottom: 8px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
        .card .name { font-size: 10px; font-weight: 600; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
        .badge { position: absolute; top: 5px; right: 5px; background: var(--gold); color: #000; font-size: 7px; font-weight: 900; padding: 1px 4px; border-radius: 3px; }
    </style>
</head>
<body>

<div id="video-container">
    <video id="video" autoplay controls playsinline></video>
</div>

<div class="nav-bar">
    <input type="text" id="search-box" placeholder="Tìm kênh (ví dụ: VTV, HBO, Discovery...)" onkeyup="render()">
    <div class="tabs">
        <div class="tab active" onclick="setFilter('VIP', this)">QUỐC TẾ VIP (20)</div>
        <div class="tab" onclick="setFilter('VN', this)">VIỆT NAM (GITHUB)</div>
        <div class="tab" onclick="setFilter('ALL', this)">TẤT CẢ</div>
    </div>
</div>

<div id="grid"></div>

        { n: "CARTOONITO", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/boomerang.smil/manifest.mpd", i: "b1f0d759e914369db3b8b30c81597156", k: "78d317e17037a8b89d539e452e5b1212", l: "https://vnepg.site/logos/138.png", g: "VIP" },

        { n: "FASHION TV", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/ftv.smil/manifest.mpd", i: "c1d9f25701023508bfa6737e3a8c7001", k: "3c3613e9b06e0f7cc201014f31bf5df8", l: "https://vnepg.site/logos/165.png", g: "VIP" },
        { n: "ABC AUSTRALIA", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/aplus.smil/manifest.mpd", i: "9a09a73ec1dc348584e2f130e27da667", k: "06f8d1a6feaffbdab92edf347e7b469c", l: "https://vnepg.site/logos/153.png", g: "VIP" }
    ];

    async function init() {
        shakaPlayer = new shaka.Player(document.getElementById('video'));
        allChannels = [...VIP_LIST];
        await fetchGithub();
        render();
        if(allChannels.length > 0) play(0);
    }

    async function fetchGithub() {
        try {
            const res = await fetch(GITHUB_URL);
            const text = await res.text();
            let cur = null;
            text.split('\n').forEach(line => {
                if (line.includes('#EXTINF')) {
                    cur = { n: line.split(',').pop().trim(), l: line.match(/tvg-logo="([^"]+)"/)?.[1] || "", u: "", g: "VN" };
                } else if (line.startsWith('http') && cur) {
                    cur.u = line.trim(); allChannels.push(cur); cur = null;
                }
            });
        } catch(e) {}
    }

    function render() {
        const grid = document.getElementById('grid');
        const search = document.getElementById('search-box').value.toLowerCase();
        grid.innerHTML = "";
        allChannels.forEach((ch, idx) => {
            if (currentGroup !== 'ALL' && ch.g !== currentGroup) return;
            if (!ch.n.toLowerCase().includes(search)) return;
            const div = document.createElement('div');
            div.className = `card ${activeIdx === idx ? 'active' : ''}`;
            div.innerHTML = `${ch.i ? '<div class="badge">VIP</div>' : ''}<img src="${ch.l}" onerror="this.src='https://via.placeholder.com/100x40/222/555?text=TV'"><div class="name">${ch.n}</div>`;
            div.onclick = () => play(idx);
            grid.appendChild(div);
        });
    }

    async function play(idx) {
        activeIdx = idx;
        const ch = allChannels[idx];
        render();
        try {
            if (ch.i && ch.k) {
                shakaPlayer.configure({ drm: { clearKeys: { [ch.i]: ch.k } } });
                await shakaPlayer.load(ch.u);
            } else {
                await shakaPlayer.unload();
                document.getElementById('video').src = ch.u;
            }
        } catch (e) { console.error("Không thể phát kênh này."); }
    }

    function setFilter(group, el) {
        currentGroup = group;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        render();
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
