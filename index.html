    <style>
        :root { --gold: #ffcc00; --bg: #0a0a0a; --panel: #161616; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #player-wrapper { width: 100%; max-width: 1000px; margin: 0 auto; background: #000; aspect-ratio: 16/9; border-bottom: 2px solid var(--gold); }
        video { width: 100%; height: 100%; }
        .controls { padding: 10px; background: #111; display: flex; flex-direction: column; gap: 8px; }
        .tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
        .tab { padding: 8px 16px; background: #222; border-radius: 20px; font-size: 12px; cursor: pointer; border: 1px solid #333; white-space: nowrap; }
        .tab.active { background: var(--gold); color: #000; font-weight: bold; border-color: var(--gold); }
        #grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding: 10px; overflow-y: auto; }
        .card { background: var(--panel); border: 1px solid #222; border-radius: 8px; padding: 10px 5px; text-align: center; cursor: pointer; position: relative; }
        .card.active { border-color: var(--gold); background: #221f00; }
        .card img { width: 100%; height: 38px; object-fit: contain; margin-bottom: 5px; }
        .card div { font-size: 10px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .vip-tag { position: absolute; top: 5px; right: 5px; background: var(--gold); color: #000; font-size: 7px; padding: 1px 3px; border-radius: 2px; font-weight: 900; }
    </style>
</head>

    ];

    async function init() {
        player = new shaka.Player(document.getElementById('video'));
        allChannels = [...VIP_DATA];
        await fetchVN();
        render();
        if(allChannels.length > 0) play(0);
    }

    async function fetchVN() {
        try {
            const r = await fetch(GITHUB_URL);
            const t = await r.text();
            let cur = null;
            t.split('\n').forEach(l => {
                if (l.includes('#EXTINF')) {
                    cur = { n: l.split(',').pop().trim(), l: l.match(/tvg-logo="([^"]+)"/)?.[1] || "", u: "", g: "VN" };
                } else if (l.startsWith('http') && cur) {
                    cur.u = l.trim(); allChannels.push(cur); cur = null;
                }
            });
        } catch(e) {}
    }

    function render() {
        const grid = document.getElementById('grid');
        grid.innerHTML = "";
        allChannels.forEach((ch, idx) => {
            if (ch.g !== currentFilter) return;
            const div = document.createElement('div');
            div.className = `card ${activeIdx === idx ? 'active' : ''}`;
            div.innerHTML = `${ch.i ? '<div class="vip-tag">VIP</div>' : ''}<img src="${ch.l}" onerror="this.src='https://via.placeholder.com/100x38?text=TV'"><div>${ch.n}</div>`;
            div.onclick = () => play(idx);
            grid.appendChild(div);
        });
    }

    async function play(idx) {
        activeIdx = idx;
        const ch = allChannels[idx];
        render();
        try {
            if (ch.i && ch.k) {
                player.configure({ drm: { clearKeys: { [ch.i]: ch.k } } });
                await player.load(ch.u);
            } else {
                await player.unload();
                document.getElementById('video').src = ch.u;
            }
        } catch (e) { console.error("Lỗi phát luồng."); }
    }

    function filter(g, el) {
        currentFilter = g;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        render();
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
