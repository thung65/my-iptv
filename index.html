<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV SAMSUNG FIX MPD</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        #video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-bottom: 2px solid #ffcc00; }
        video { width: 100%; height: 100%; outline: none; }
        .tabs { display: flex; overflow-x: auto; background: #111; padding: 10px; gap: 8px; border-bottom: 1px solid #333; }
        .tabs button { padding: 10px 18px; border: none; background: #222; color: #999; font-size: 13px; font-weight: bold; border-radius: 4px; white-space: nowrap; }
        .tabs button.active { background: #ffcc00; color: #000; }
        #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding: 12px; overflow-y: auto; flex: 1; }
        .item { background: #111; padding: 12px 5px; text-align: center; border: 1px solid #222; border-radius: 6px; }
        .item.active { border-color: #ffcc00; background: #1a1a00; }
        .item img { height: 35px; max-width: 90%; margin-bottom: 5px; background: #fff; border-radius: 2px; }
        .item span { font-size: 10px; display: block; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>

<div id="video-box"><video id="video" controls autoplay playsinline></video></div>

<div class="tabs">
    <button class="active" onclick="setTab('ALL', this)">TẤT CẢ</button>
    <button onclick="setTab('VTV', this)">VTV</button>
    <button onclick="setTab('SCTV', this)">SCTV</button>
    <button onclick="setTab('VTVCAB', this)">VTVCAB</button>
    <button onclick="setTab('HTV', this)">HTV</button>
    <button onclick="setTab('ĐỊA PHƯƠNG', this)">ĐỊA PHƯƠNG</button>
    <button onclick="setTab('QUỐC TẾ', this)">QUỐC TẾ</button>
</div>

<div id="list"></div>

<script>
    const GITHUB_URL = "https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/ducnt123";
    const PROXY = "https://api.allorigins.win/raw?url=";
    
    let video = document.getElementById('video'), player, allData = [], curTab = "ALL";

    // Hàm giải mã cực chuẩn cho Samsung TV - KHÔNG ĐƯỢC SAI KHÁC
    function fixKey(val) {
        if (!val) return "";
        try {
            // Chuyển đổi Base64 (dạng an toàn web) sang chuẩn Base64 gốc
            let base64 = val.replace(/-/g, '+').replace(/_/g, '/');
            // Chuyển Base64 sang chuỗi Hex
            let str = atob(base64);
            let hex = '';
            for (let i = 0; i < str.length; i++) {
                let h = str.charCodeAt(i).toString(16);
                hex += (h.length === 1 ? '0' : '') + h;
            }
            return hex;
        } catch (e) { return val; }
    }

    async function start() {
        shaka.polyfill.installAll();
        player = new shaka.Player(video);
        
        // Cấu hình bắt buộc cho MPD ClearKey trên Tizen
        player.configure({
            streaming: { bufferingGoal: 10, rebufferingGoal: 2, jumpLargeGaps: true },
            manifest: { retryParameters: { maxAttempts: 5 } }
        });

        loadM3U();
    }

    async function loadM3U() {
        try {
            const r = await fetch(PROXY + encodeURIComponent(GITHUB_URL));
            const t = await r.text();
            parse(t);
        } catch(e) { console.log("Lỗi tải danh sách"); }
    }

    function parse(data) {
        let lines = data.split('\n'), ext = [], cur = null;
        for (let l of lines) {
            l = l.trim();
            if (l.startsWith('#EXTINF')) {
                const name = l.split(',')[1] || "Kênh";
                let g = "ĐỊA PHƯƠNG";
                const n = name.toUpperCase();
                if (n.includes("VTVCAB")) g = "VTVCAB";
                else if (n.includes("SCTV")) g = "SCTV";
                else if (n.includes("VTV")) g = "VTV";
                else if (n.includes("HTV")) g = "HTV";
                else if (n.includes("HBO") || n.includes("AXN") || n.includes("DISCOVERY") || n.includes("CNN") || n.includes("BBC")) g = "QUỐC TẾ";

                cur = { n: name, u: "", l: l.match(/tvg-logo="([^"]+)"/i)?.[1] || "", g: g, i: "", k: "" };
            } else if (l.includes('license_key=')) {
                try {
                    const drm = JSON.parse(l.split('license_key=')[1]);
                    cur.i = drm.keys[0].kid; cur.k = drm.keys[0].k;
                } catch(e) {}
            } else if (l.startsWith('http')) {
                if (cur) { cur.u = l; ext.push(cur); cur = null; }
            }
        }
        allData = ext;
        render();
        if (allData.length > 0) play(allData[0]);
    }

    async function play(ch) {
        // QUAN TRỌNG: Reset hoàn toàn trình phát trước khi nạp kênh mới
        await player.unload();
        video.src = ""; 

        if (ch.i && ch.k) {
            // NẾU LÀ MPD (DASH)
            let drmConfig = {};
            drmConfig[fixKey(ch.i)] = fixKey(ch.k);
            
            // Ép Shaka sử dụng cấu hình ClearKey sạch
            player.configure({ drm: { clearKeys: drmConfig } });
            
            try {
                await player.load(ch.u);
            } catch(e) {
                // Nếu load MPD thất bại, thử qua Proxy (một số server chặn CORS cho manifest)
                try { await player.load(PROXY + encodeURIComponent(ch.u)); } catch(e2) {}
            }
        } else {
            // NẾU LÀ HLS/MP4 (TV360)
            player.configure({ drm: { clearKeys: {} } });
            video.src = ch.u;
            video.onerror = function() {
                if (video.src !== (PROXY + encodeURIComponent(ch.u))) {
                    video.src = PROXY + encodeURIComponent(ch.u);
                    video.play();
                }
            };
        }
        video.play().catch(() => {});
        render(ch.u);
    }

    function render(activeUrl = "") {
        const box = document.getElementById('list');
        box.innerHTML = "";
        allData.forEach(ch => {
            if (curTab !== 'ALL' && ch.g !== curTab) return;
            const div = document.createElement('div');
            div.className = `item ${ch.u === activeUrl ? 'active' : ''}`;
            div.innerHTML = `<img src="${ch.l}" onerror="this.src='https://via.placeholder.com/50?text=TV'"><span>${ch.n}</span>`;
            div.onclick = () => play(ch);
            box.appendChild(div);
        });
    }

    function setTab(t, btn) {
        curTab = t;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }
    start();
</script>
</body>
</html>
