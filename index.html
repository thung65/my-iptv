    <style>
        :root { --accent: #00ff42; --bg: #050505; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 350px; background: #0f0f0f; border-right: 1px solid #222; display: flex; flex-direction: column; }
        .header { padding: 20px; background: #151515; border-bottom: 2px solid var(--accent); }
        .header h2 { margin: 0; font-size: 18px; color: var(--accent); letter-spacing: 1px; }
        #list { flex: 1; overflow-y: auto; scrollbar-width: thin; }
        .g-title { background: #1a1a1a; padding: 12px 15px; font-size: 11px; color: #888; text-transform: uppercase; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #222; }
        .item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #111; font-size: 13px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .item:hover { background: #181818; }
        .item.active { background: #102a16; color: var(--accent); font-weight: bold; border-left: 4px solid var(--accent); }
        .tag-drm { font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: bold; background: var(--accent); color: #000; }
        #main { flex: 1; position: relative; background: #000; display: flex; align-items: center; }
        video { width: 100%; height: 100%; outline: none; }
        #loader { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
        .spin { width: 40px; height: 40px; border: 3px solid #222; border-top: 3px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

    </div>
    <div id="list"></div>

    <video id="video" autoplay playsinline controls></video>
</div>

    ];

    let shakaPlayer;

    async function init() {
        shaka.polyfill.installAll();
        shakaPlayer = new shaka.Player(document.getElementById('video'));
        render();
        play(0);
    }

    function render() {
        const list = document.getElementById('list');
        let lastG = "";
        FULL_DATA.forEach((ch, idx) => {
            if (ch.g !== lastG) {
                const g = document.createElement('div');
                g.className = 'g-title'; g.innerText = ch.g;
                list.appendChild(g); lastG = ch.g;
            }
            const d = document.createElement('div');
            d.className = 'item'; 
            d.innerHTML = `<span>${ch.n}</span><span class="tag-drm">DRM</span>`;
            d.onclick = () => play(idx);
            list.appendChild(d);
        });
    }

    async function play(idx) {
        const ch = FULL_DATA[idx];
        const loader = document.getElementById('loader');
        loader.style.display = 'flex';
        document.querySelectorAll('.item').forEach((el, i) => el.classList.toggle('active', idx === i));

        await shakaPlayer.unload();
        try {
            shakaPlayer.configure({ drm: { clearKeys: { [ch.i]: ch.k } } });
            shakaPlayer.getNetworkingEngine().registerRequestFilter((type, request) => {
                request.headers['User-Agent'] = 'Dalvik/2.1.0';
            });
            await shakaPlayer.load(ch.u);
            loader.style.display = 'none';
        } catch (e) { 
            loader.style.display = 'none';
        }
    }

    init();
</script>
</body>
</html>
