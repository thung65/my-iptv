    <style>
        :root { --accent: #ffcc00; }
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        /* Video Box: Cố định 16:9 để không bị nhảy khung hình */
        #video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-bottom: 2px solid var(--accent); }
        video { width: 100%; height: 100%; outline: none; }

        /* Menu Tab: Tối ưu cuộn mượt cho TV */
        .tabs { display: flex; overflow-x: auto; background: #111; padding: 12px; gap: 8px; border-bottom: 1px solid #333; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tabs button { padding: 10px 20px; border: none; background: #222; color: #999; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 6px; white-space: nowrap; transition: 0.2s; }
        .tabs button.active { background: var(--accent); color: #000; transform: scale(1.05); }

        /* Danh sách kênh: Tối ưu Render GPU để giảm lag */
        #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(125px, 1fr)); gap: 12px; padding: 15px; overflow-y: auto; flex: 1; content-visibility: auto; }
        .item { background: #111; padding: 15px 5px; text-align: center; border: 2px solid #222; border-radius: 10px; cursor: pointer; transition: 0.1s; }
        .item:focus, .item.active { border-color: var(--accent); background: #1a1a00; outline: none; }
        .item img { height: 40px; max-width: 85%; object-fit: contain; display: block; margin: 0 auto 8px; pointer-events: none; }
        .item span { font-size: 11px; font-weight: bold; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>

        { n: "PLANET EARTH", u: "https://livecdn.seenow.vn/livesnv2/PE/manifest.mpd", i: "a7c942778e874d43be92b8d0a0cd11b4", k: "6d54358306571658ffdb952c6560688b", l: "https://vnepg.site/logos/138.png", g: "QUỐC TẾ" },

    ];
    
async function play(ch) {
    // 1. Kiểm tra an toàn: Nếu không có link thì thoát luôn, không chạy tiếp để tránh treo web
    if (!ch || !ch.u) return;

    // 2. Dọn dẹp thẻ video trước khi nạp kênh mới
    try {
        if (player) await player.unload();
        video.pause();
        video.src = "";
        video.load();
    } catch (e) { console.log("Lỗi dọn dẹp, bỏ qua..."); }

    // 3. Xử lý logic phát kênh
    try {
        // Trường hợp 1: Link Seenow DRM (MPD)
        if (ch.u.includes('.mpd') || (ch.i && ch.k)) {
            let drm = {};
            // Hàm toHex tự chế của bạn phải chuẩn ở đây
            drm[toHex(ch.i)] = toHex(ch.k);
            
            player.configure({ 
                drm: { clearKeys: drm },
                streaming: { retryParameters: { maxAttempts: 2 } } // Chỉ thử lại 2 lần để tránh treo
            });
            
            await player.load(ch.u);
            video.play();
        } 
        // Trường hợp 2: Link thường (m3u8 hoặc http)
        else {
            throw new Error("Dùng Native");
        }
    } catch (e) {
        // CƠ CHẾ DỰ PHÒNG: Nếu Shaka lỗi, dùng trình phát gốc ngay
        console.warn("Chuyển sang trình phát gốc...");
        video.src = ch.u;
        video.type = ch.u.includes('m3u8') ? 'application/x-mpegURL' : 'video/mp4';
        
        setTimeout(() => {
            video.play().catch(() => {
                // Nếu vẫn không chạy (do Tivi chặn), thì Mute để lách luật tự động phát
                video.muted = true;
                video.play();
            });
        }, 300);
    }
}

    function renderTabs() {
        const bar = document.getElementById('tab-bar');
        bar.innerHTML = TAB_ORDER.map(t => `<button class="${t===curTab?'active':''}" onclick="setTab('${t}', this)">${t==='ALL'?'TẤT CẢ':t}</button>`).join('');
    }

    function render() {
        const box = document.getElementById('list'); box.innerHTML = "";
        const frag = document.createDocumentFragment();
        allData.forEach(ch => {
            if (curTab !== 'ALL' && ch.g !== curTab) return;
            const div = document.createElement('div');
            div.className = "item"; div.dataset.url = ch.u; div.setAttribute('tabindex', '0');
            div.innerHTML = `<img src="${ch.l}" loading="lazy" onerror="this.src='https://via.placeholder.com/50?text=TV'"><span>${ch.n}</span>`;
            div.onclick = () => play(ch);
            frag.appendChild(div);
        });
        box.appendChild(frag);
    }

    function setTab(t, btn) {
        curTab = t;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    function toHex(val) {
        try { return (val.length === 32) ? val : Array.from(atob(val.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0).toString(16).padStart(2,'0')).join(''); } catch(e) { return val; }
    }

    video.onwaiting = function() {
        setTimeout(() => { if (video.paused && !video.ended) { video.load(); video.play(); } }, 4000);
    };

    start();
</script>
