    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --gold: #ffcc00; --bg: #000; --card: #111; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .navbar { background: #151515; padding: 12px; text-align: center; border-bottom: 2px solid var(--gold); color: var(--gold); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        #video-container { width: 100%; max-width: 960px; margin: 0 auto; aspect-ratio: 16/9; background: #000; }
        video { width: 100%; height: 100%; outline: none; }
        .category-bar { display: flex; overflow-x: auto; gap: 8px; padding: 10px; background: #0a0a0a; border-bottom: 1px solid #222; scrollbar-width: none; }
        .tab-btn { padding: 8px 15px; background: #222; border: 1px solid #333; color: #888; cursor: pointer; border-radius: 4px; font-size: 11px; font-weight: bold; white-space: nowrap; transition: 0.3s; }
        .tab-btn.active { background: var(--gold); color: #000; border-color: var(--gold); }
        #channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding: 15px; overflow-y: auto; flex: 1; }
        .card { background: var(--card); border: 1px solid #222; border-radius: 6px; padding: 12px 5px; text-align: center; cursor: pointer; position: relative; transition: 0.2s; }
        .card.active { border-color: var(--gold); background: #1a1700; box-shadow: inset 0 0 10px rgba(255,204,0,0.2); }
        .card img { width: 100%; height: 40px; object-fit: contain; margin-bottom: 5px; }
        .card div { font-size: 11px; font-weight: 600; color: #ccc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tag-vip { position: absolute; top: 4px; right: 4px; background: linear-gradient(135deg, var(--gold), #b8860b); color: #000; font-size: 8px; padding: 1px 4px; border-radius: 2px; font-weight: 900; }
        @media (max-width: 600px) { #channel-grid { grid-template-columns: repeat(3, 1fr); } }
    </style>
</head>
<body>

<div class="navbar">HỆ THỐNG TRUYỀN HÌNH VIP PRO</div>
<div id="video-container"><video id="video" autoplay controls playsinline></video></div>

<div class="category-bar">
    <button class="tab-btn active" onclick="filter('ALL')">TẤT CẢ</button>
    <button class="tab-btn" onclick="filter('QUỐC TẾ')">QUỐC TẾ VIP</button>
    <button class="tab-btn" onclick="filter('SCTV')">SCTV VIP</button>
    <button class="tab-btn" onclick="filter('VTV')">VTV</button>
    <button class="tab-btn" onclick="filter('ĐỊA PHƯƠNG')">ĐỊA PHƯƠNG</button>
</div>

<div id="channel-grid"></div>

        { n: "DISCOVERY ASIA", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/dscasia.smil/manifest.mpd", i: "k0kHsTS+OWOmJjpFOEaSTA", k: "eI4oNfuYVortL0e73AkVFQ", l: "https://vnepg.site/logos/145.png", g: "QUỐC TẾ", isVip: true },
        { n: "ANIMAL PLANET", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/ap.smil/manifest.mpd", i: "7G8HLHElN3qbwK5hWYCV9A", k: "HVOI4HgUFevOyZFPWtdYdQ", l: "https://vnepg.site/logos/143.png", g: "QUỐC TẾ", isVip: true },
        { n: "DMAX HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/dmax.smil/manifest.mpd", i: "U7JvkErgOiC1ZHfPucXcog", k: "DGTM+5eOc5C9MzRAdUkq7A", l: "https://vnepg.site/logos/271.png", g: "QUỐC TẾ", isVip: true },
        { n: "TLC HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/tlc.smil/manifest.mpd", i: "tpCGKXMmOa2kgUpiCCltnA", k: "fKm/A2I/d7Xi8W3wtT8nTQ", l: "https://vnepg.site/logos/168.png", g: "QUỐC TẾ", isVip: true },
        { n: "CNN", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/cnn.smil/manifest.mpd", i: "cUzI7QWgOruaxhvUu9HYoA", k: "Gs9Y/41M2HwtPBLSIkjvsQ", l: "https://vnepg.site/logos/156.png", g: "QUỐC TẾ", isVip: true },
        { n: "BBC NEWS", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/bbcworldnews.smil/manifest.mpd", i: "x7pGCG3aNFqSnim/FV5FnA", k: "03S485kEv1cmieo0euhlkQ", l: "https://vnepg.site/logos/151.png", g: "QUỐC TẾ", isVip: true },
        { n: "BLOOMBERG", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/bloomberg.smil/manifest.mpd", i: "EHE5P4/CN/OpooAoFCEQ9w", k: "eg+MPHLg//+BHVNMkpxXwg", l: "https://vnepg.site/logos/154.png", g: "QUỐC TẾ", isVip: true },
        { n: "CARTOON HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/cn.smil/manifest.mpd", i: "PCAWZmCpOnWsd9uBVnOJ9w", k: "PMGt1Drszj/jHJxqKluMIQ", l: "https://vnepg.site/logos/140.png", g: "QUỐC TẾ", isVip: true },
        { n: "CARTOONITO", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/boomerang.smil/manifest.mpd", i: "sfDXWekUNp2ziLOw3IFZcQ", k: "VnjTF-FwB6iKm5U55FJlEg", l: "https://vnepg.site/logos/138.png", g: "QUỐC TẾ", isVip: true },
        { n: "DREAMWORKS", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/dreamwork.smil/manifest.mpd", i: "Z9riBSfGPa2qrmCaqRV3yw", k: "WTKPYh1WdnvF/5QEqJQGgw", l: "https://vnepg.site/logos/141.png", g: "QUỐC TẾ", isVip: true },
        { n: "BBC EARTH", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/bbcearth.smil/manifest.mpd", i: "UBSUGixCN5iAte33IwTBZQ", k: "8/oP4805pS9O79Nv9xYeiQ", l: "https://vnepg.site/logos/148.png", g: "QUỐC TẾ", isVip: true },
        { n: "BBC CBEEBIES", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/cbb.smil/manifest.mpd", i: "zKc6AGtLOaWVIHzrXtnKCg", k: "uDPR9AwmHveIlvl+BvgM3A", l: "https://vnepg.site/logos/150.png", g: "QUỐC TẾ", isVip: true },
        { n: "BBC LIFESTYLE", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/bbclifestyle.smil/manifest.mpd", i: "WLlJmG7RMpS8AbDzMKvFJw", k: "I+jF8v4gKQasLWVU2VJymQ", l: "https://vnepg.site/logos/149.png", g: "QUỐC TẾ", isVip: true },
        { n: "FASHION TV", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/ftv.smil/manifest.mpd", i: "wdnyVwECNQi/pnN+OoxwAQ", k: "MMNhPpsG4PfMIBAU8xv12A", l: "https://vnepg.site/logos/165.png", g: "QUỐC TẾ", isVip: true },
        { n: "ABC AUSTRALIA", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/aplus.smil/manifest.mpd", i: "mgmnPsHcNIWE4vEw4n2mZw", k: "BvjRpv6v+9q5Kt80fntGnA", l: "https://vnepg.site/logos/153.png", g: "QUỐC TẾ", isVip: true }
    ];

    let allChannels = [...DRM_LIST];
    let currentFilter = 'ALL', activeIdx = 0, shakaPlayer, hlsPlayer;

    function base64ToHex(b64) {
        const bin = atob(b64);
        let res = "";
        for (let i = 0; i < bin.length; i++) {
            let hex = bin.charCodeAt(i).toString(16);
            res += (hex.length === 1 ? '0' : '') + hex;
        }
        return res;
    }

    async function init() {
        shaka.polyfill.installAll();
        shakaPlayer = new shaka.Player(video);
        shakaPlayer.configure({ streaming: { lowLatencyMode: true, bufferingGoal: 10 } });
        
        await loadFromGithub();
        renderGrid();
        play(0);
    }

    async function loadFromGithub() {
        try {
            const res = await fetch(GITHUB_URL);
            const text = await res.text();
            const lines = text.split('\n');
            let cur = null;
            lines.forEach(line => {
                if (line.startsWith('#EXTINF')) {
                    const name = line.split(',')[1]?.trim();
                    let logo = line.match(/tvg-logo="([^"]+)"/)?.[1] || "";
                    const nU = name.toUpperCase();
                    
                    // Xử lý logo KIX và VIP
                    if (nU.includes("KIX")) logo = "https://vnepg.site/logos/167.png";
                    
                    let g = "ĐỊA PHƯƠNG", vip = false;
                    if (nU.includes("SCTV")) { g = "SCTV"; vip = true; }
                    else if (nU.includes("VTV")) {
                        g = "VTV";
                        vip = !(nU.includes("VTV1") || nU.includes("AN NINH") || nU.includes("QUỐC PHÒNG") || nU.includes("TODAY"));
                    } else if (nU.includes("KIX")) { g = "QUỐC TẾ"; vip = true; }

                    cur = { n: name, l: logo, u: "", g: g, isVip: vip };
                } else if (line.startsWith('http') && cur) {
                    cur.u = line.trim();
                    const exists = allChannels.some(c => c.n.toUpperCase().includes(cur.n.split(' ')[0].toUpperCase()));
                    if (!exists) allChannels.push(cur);
                    cur = null;
                }
            });
        } catch (e) {}
    }

    function renderGrid() {
        const grid = document.getElementById('channel-grid');
        grid.innerHTML = "";
        allChannels.forEach((ch, idx) => {
            if (currentFilter !== 'ALL' && !ch.g.includes(currentFilter)) return;
            const div = document.createElement('div');
            div.className = 'card' + (activeIdx === idx ? ' active' : '');
            div.innerHTML = `${ch.isVip ? '<div class="tag-vip">VIP</div>' : ''}<img src="${ch.l}" onerror="this.src='https://via.placeholder.com/100x40/222/555?text=TV'"><div>${ch.n}</div>`;
            div.onclick = () => play(idx);
            grid.appendChild(div);
        });
    }

    async function play(idx) {
        activeIdx = idx; renderGrid();
        const ch = allChannels[idx];
        if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
        await shakaPlayer.unload();
        video.src = ""; // Clear src cũ

        if (ch.i) { // Kênh có DRM
            shakaPlayer.configure({ drm: { clearKeys: { [base64ToHex(ch.i)]: base64ToHex(ch.k) } } });
            await shakaPlayer.load(ch.u);
        } else { // Kênh thường (.m3u8)
            if (Hls.isSupported()) {
                hlsPlayer = new Hls({ capLevelToPlayerSize: true, lowLatencyMode: true });
                hlsPlayer.loadSource(ch.u);
                hlsPlayer.attachMedia(video);
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = ch.u;
            }
        }
    }

    function filter(g) { currentFilter = g; renderGrid(); }
    init();
</script>
</body>
</html>
