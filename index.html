<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMSUNG TV - FIX LIST & HEX DRM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        #video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-bottom: 2px solid #ffcc00; }
        video { width: 100%; height: 100%; outline: none; }
        .tabs { display: flex; overflow-x: auto; background: #111; padding: 10px; gap: 8px; border-bottom: 1px solid #333; scrollbar-width: none; }
        .tabs button { padding: 10px 18px; border: none; background: #222; color: #999; font-weight: bold; border-radius: 4px; white-space: nowrap; }
        .tabs button.active { background: #ffcc00; color: #000; }
        #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding: 12px; overflow-y: auto; flex: 1; }
        .item { background: #111; padding: 10px 5px; text-align: center; border: 1px solid #222; border-radius: 6px; cursor: pointer; }
        .item.active { border-color: #ffcc00; background: #1a1a00; }
        .item img { height: 35px; max-width: 90%; margin-bottom: 5px; background: #fff; border-radius: 2px; object-fit: contain; }
        .item span { font-size: 10px; display: block; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>

<div id="video-box"><video id="video" controls autoplay playsinline></video></div>

<div class="tabs">
    <button class="active" onclick="setTab('ALL', this)">TẤT CẢ</button>
    <button onclick="setTab('VTV', this)">VTV</button>
    <button onclick="setTab('SCTV', this)">SCTV</button>
    <button onclick="setTab('VTVCAB', this)">VTVCAB</button>
    <button onclick="setTab('HTV', this)">HTV</button>
    <button onclick="setTab('ĐỊA PHƯƠNG', this)">ĐỊA PHƯƠNG</button>
    <button onclick="setTab('QUỐC TẾ', this)">QUỐC TẾ</button>
</div>

<div id="list"></div>

<script>
    const GITHUB_URL = "https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/ducnt123";
    const PROXY = "https://api.allorigins.win/raw?url=";
    
    let video = document.getElementById('video'), player, allData = [], curTab = "ALL";

    function hexToUint8(hex) {
        if (!hex) return null;
        const clean = hex.replace(/[^0-9a-fA-F]/g, '');
        const res = new Uint8Array(clean.length / 2);
        for (let i = 0; i < clean.length; i += 2) {
            res[i / 2] = parseInt(clean.substring(i, i + 2), 16);
        }
        return res;
    }

    async function init() {
        shaka.polyfill.installAll();
        player = new shaka.Player(video);
        player.configure({ streaming: { jumpLargeGaps: true } });
        loadM3U();
    }

    async function loadM3U() {
        try {
            const r = await fetch(PROXY + encodeURIComponent(GITHUB_URL));
            const t = await r.text();
            if (!t) throw new Error();
            parse(t);
        } catch (e) { document.getElementById('list').innerHTML = "<p style='padding:20px'>Lỗi tải danh sách từ GitHub</p>"; }
    }

    function parse(data) {
        const lines = data.split('\n');
        let channels = [], cur = null;

        for (let i = 0; i < lines.length; i++) {
            let l = lines[i].trim();
            if (l.startsWith('#EXTINF')) {
                const name = l.split(',')[1] || "Kênh";
                let g = "ĐỊA PHƯƠNG", n = name.toUpperCase();
                if (n.includes("VTVCAB")) g = "VTVCAB";
                else if (n.includes("SCTV")) g = "SCTV";
                else if (n.includes("VTV")) g = "VTV";
                else if (n.includes("HTV")) g = "HTV";
                else if (n.includes("HBO") || n.includes("AXN") || n.includes("CNN")) g = "QUỐC TẾ";

                cur = { n: name, u: "", l: l.match(/tvg-logo="([^"]+)"/i)?.[1] || "", g, kid: "", key: "" };
            } else if (l.includes('license_key=')) {
                try {
                    const json = JSON.parse(l.split('license_key=')[1]);
                    cur.kid = json.keys[0].kid;
                    cur.key = json.keys[0].k;
                } catch (e) {}
            } else if (l.startsWith('http')) {
                if (cur) { cur.u = l; channels.push(cur); cur = null; }
            }
        }
        allData = channels;
        render();
        if (allData.length > 0) play(allData[0]);
    }

    async function play(ch) {
        await player.unload();
        video.src = "";

        if (ch.kid && ch.key) {
            const kid = ch.kid.replace(/[^0-9a-fA-F]/g, '').toLowerCase();
            const key = hexToUint8(ch.key);
            let drm = {};
            drm[kid] = key;
            player.configure({ drm: { clearKeys: drm } });
            try { await player.load(ch.u); } catch (e) {
                try { await player.load(PROXY + encodeURIComponent(ch.u)); } catch(e2) {}
            }
        } else {
            player.configure({ drm: { clearKeys: {} } });
            video.src = ch.u;
        }
        render(ch.u);
    }

    function render(activeUrl = "") {
        const box = document.getElementById('list');
        box.innerHTML = "";
        const filtered = allData.filter(ch => curTab === 'ALL' || ch.g === curTab);
        
        filtered.forEach(ch => {
            const div = document.createElement('div');
            div.className = `item ${ch.u === activeUrl ? 'active' : ''}`;
            div.innerHTML = `<img src="${ch.l}" onerror="this.src='https://via.placeholder.com/50?text=TV'"><span>${ch.n}</span>`;
            div.onclick = () => play(ch);
            box.appendChild(div);
        });
    }

    function setTab(t, btn) {
        curTab = t;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }
    init();
</script>
</body>
</html>
