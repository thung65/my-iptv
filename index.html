        .item.active { background: #102a16; color: var(--accent); border-left: 4px solid var(--accent); }

        .channel-info { flex: 1; display: flex; justify-content: space-between; align-items: center; }
        .tag-vip { font-size: 9px; padding: 2px 5px; border-radius: 3px; font-weight: bold; background: var(--accent); color: #000; }
        #main { flex: 1; position: relative; background: #000; display: flex; align-items: center; }
        video { width: 100%; height: 100%; outline: none; }
        #loader { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
        .spin { width: 40px; height: 40px; border: 3px solid #222; border-top: 3px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }

    const GITHUB_URL = "https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/ducnt123";
    let allChannels = [...VIP_DATA];
    let shakaPlayer, hlsPlayer;

    async function init() {
        shaka.polyfill.installAll();
        shakaPlayer = new shaka.Player(document.getElementById('video'));
        await loadGitHub();
        render();
        play(0);
    }

    async function loadGitHub() {
        try {
            const res = await fetch(GITHUB_URL);
            const text = await res.text();
            const lines = text.split('\n');
            let current = null;

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF')) {
                    const name = line.split(',')[1];
                    const group = line.match(/group-title="([^"]+)"/);
                    const logo = line.match(/tvg-logo="([^"]+)"/);
                    if (name) current = { n: name.trim(), g: group ? group[1].toUpperCase() : "MỚI CẬP NHẬT", l: logo ? logo[1] : "" };
                } else if (line.startsWith('http') && current) {
                    current.u = line;
                    const isDup = VIP_DATA.some(v => v.n.toLowerCase().replace(/\s/g, '') === current.n.toLowerCase().replace(/\s/g, ''));
                    if (!isDup) allChannels.push(current);
                    current = null;
                }
            });
            document.getElementById('status').innerText = `Đã tải ${allChannels.length} kênh.`;
        } catch (e) { document.getElementById('status').innerText = "Lỗi GitHub."; }
    }

    function render() {
        const list = document.getElementById('list');
        list.innerHTML = "";
        let lastG = "";
        allChannels.forEach((ch, idx) => {
            if (ch.g !== lastG) {
                const g = document.createElement('div');
                g.className = 'g-title'; g.innerText = ch.g;
                list.appendChild(g); lastG = ch.g;
            }
            const item = document.createElement('div');
            item.className = 'item';
            const img = ch.l || "https://via.placeholder.com/50x35/222/fff?text=TV";
            item.innerHTML = `<img class="channel-logo" src="${img}" onerror="this.src='https://via.placeholder.com/50x35/222/fff?text=TV'"><div class="channel-info"><span>${ch.n}</span>${ch.i ? '<span class="tag-vip">DRM</span>' : ''}</div>`;
            item.onclick = () => play(idx);
            list.appendChild(item);
        });
    }

    async function play(idx) {
        const ch = allChannels[idx];
        const video = document.getElementById('video');
        const loader = document.getElementById('loader');
        loader.style.display = 'flex';
        document.querySelectorAll('.item').forEach((el, i) => el.classList.toggle('active', idx === i));

        if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
        await shakaPlayer.unload();

        try {
            if (ch.u.includes('.m3u8') && !ch.i) {
                if (Hls.isSupported()) { hlsPlayer = new Hls(); hlsPlayer.loadSource(ch.u); hlsPlayer.attachMedia(video); }
                else { video.src = ch.u; }
            } else {
                shakaPlayer.configure({ drm: { clearKeys: ch.i ? { [ch.i]: ch.k } : {} } });
                shakaPlayer.getNetworkingEngine().registerRequestFilter((t, r) => { r.headers['User-Agent'] = 'Dalvik/2.1.0 (Linux; U; Android 9; TV Box)'; });
                await shakaPlayer.load(ch.u);
            }
            loader.style.display = 'none';
        } catch (e) { loader.style.display = 'none'; }
    }

    init();
