        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .navbar { background: #111; padding: 15px; text-align: center; border-bottom: 2px solid var(--gold); color: var(--gold); font-weight: bold; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #video-container { width: 100%; max-width: 960px; margin: 0 auto; background: #000; }
        .video-js { width: 100%; aspect-ratio: 16/9; }
        .category-bar { display: flex; overflow-x: auto; gap: 10px; padding: 12px; background: #050505; border-bottom: 1px solid #222; scrollbar-width: none; }
        .tab-btn { padding: 8px 20px; background: #1a1a1a; border: 1px solid #333; color: #999; cursor: pointer; border-radius: 20px; font-size: 12px; font-weight: bold; white-space: nowrap; transition: 0.3s; }
        .tab-btn.active { background: var(--gold); color: #000; border-color: var(--gold); box-shadow: 0 0 10px rgba(255, 204, 0, 0.4); }

        .card { background: var(--card); border: 1px solid #222; border-radius: 8px; padding: 12px 5px; text-align: center; cursor: pointer; position: relative; transition: 0.2s; }
        .card.active { border-color: var(--gold); background: #221f00; transform: translateY(-3px); }
        .card img { width: 100%; height: 42px; object-fit: contain; margin-bottom: 8px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .card div { font-size: 11px; font-weight: 600; color: #ddd; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tag-vip { position: absolute; top: 5px; right: 5px; background: linear-gradient(135deg, #ffcc00, #ff9500); color: #000; font-size: 8px; padding: 2px 5px; border-radius: 3px; font-weight: 900; }

        { n: "DISCOVERY ASIA", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/dscasia.smil/manifest.mpd", i: "k0kHsTS+OWOmJjpFOEaSTA", k: "eI4oNfuYVortL0e73AkVFQ", l: "https://vnepg.site/logos/145.png", g: "QUỐC TẾ", isVip: true },

        { n: "BLOOMBERG", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/bloomberg.smil/manifest.mpd", i: "EHE5P4/CN/OpooAoFCEQ9w", k: "eg+MPHLg//+BHVNMkpxXwg", l: "https://vnepg.site/logos/154.png", g: "QUỐC TẾ", isVip: true },

        { n: "DREAMWORKS", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/dreamwork.smil/manifest.mpd", i: "Z9riBSfGPa2qrmCaqRV3yw", k: "WTKPYh1WdnvF/5QEqJQGgw", l: "https://vnepg.site/logos/141.png", g: "QUỐC TẾ", isVip: true },
        { n: "BBC EARTH", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/bbcearth.smil/manifest.mpd", i: "UBSUGixCN5iAte33IwTBZQ", k: "8/oP4805pS9O79Nv9xYeiQ", l: "https://vnepg.site/logos/148.png", g: "QUỐC TẾ", isVip: true },
        { n: "BBC CBEEBIES", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/cbb.smil/manifest.mpd", i: "zKc6AGtLOaWVIHzrXtnKCg", k: "uDPR9AwmHveIlvl+BvgM3A", l: "https://vnepg.site/logos/150.png", g: "QUỐC TẾ", isVip: true },
        { n: "BBC LIFESTYLE", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/bbclifestyle.smil/manifest.mpd", i: "WLlJmG7RMpS8AbDzMKvFJw", k: "I+jF8v4gKQasLWVU2VJymQ", l: "https://vnepg.site/logos/149.png", g: "QUỐC TẾ", isVip: true },
        { n: "FASHION TV", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/ftv.smil/manifest.mpd", i: "wdnyVwECNQi/pnN+OoxwAQ", k: "MMNhPpsG4PfMIBAU8xv12A", l: "https://vnepg.site/logos/165.png", g: "QUỐC TẾ", isVip: true },
        { n: "ABC AUSTRALIA", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/aplus.smil/manifest.mpd", i: "mgmnPsHcNIWE4vEw4n2mZw", k: "BvjRpv6v+9q5Kt80fntGnA", l: "https://vnepg.site/logos/153.png", g: "QUỐC TẾ", isVip: true }
    ];

    let allChannels = [...FIXED_CHANNELS], currentFilter = 'ALL', activeIdx = 0;

    function base64ToHex(b64) {
        const bin = atob(b64); let res = "";
        for (let i = 0; i < bin.length; i++) {
            let hex = bin.charCodeAt(i).toString(16);
            res += (hex.length === 1 ? '0' : '') + hex;
        }
        return res;
    }

    async function init() {
        player = videojs('main-player', { autoplay: true, fluid: true, html5: { vhs: { overrideNative: true } } });
        player.eme();
        await loadFromGithub();
        renderGrid();
        play(0);
    }

    async function loadFromGithub() {
        try {
            const res = await fetch(GITHUB_URL);
            const text = await res.text();
            let cur = null;
            text.split('\n').forEach(line => {
                if (line.startsWith('#EXTINF')) {
                    const name = line.split(',')[1]?.trim();
                    const nU = name.toUpperCase();
                    let g = "ĐỊA PHƯƠNG", vip = false;

                    const isInt = INT_KEYWORDS.some(k => nU.includes(k));

                    if (isInt) { g = "QUỐC TẾ"; vip = true; }
                    else if (nU.includes("SCTV")) { g = "SCTV"; vip = true; }
                    else if (nU.includes("HTV")) { g = "HTV"; vip = nU.includes("HTVC"); }
                    else if (nU.includes("VTV") || nU.includes("AN NINH") || nU.includes("QUỐC PHÒNG") || nU.includes("QPVN") || nU.includes("ANTV")) {
                        g = "VTV";
                        const thietYeu = ["VTV1", "AN NINH", "QUỐC PHÒNG", "QPVN", "ANTV", "HTV7", "HTV9", "TODAY"];
                        vip = !thietYeu.some(k => nU.includes(k));
                    }

                    cur = { n: name, l: line.match(/tvg-logo="([^"]+)"/)?.[1] || "", u: "", g: g, isVip: vip };
                } else if (line.startsWith('http') && cur) {
                    cur.u = line.trim();
                    if (!allChannels.some(c => c.n.toUpperCase() === cur.n.toUpperCase())) allChannels.push(cur);
                    cur = null;
                }
            });
        } catch (e) {}
    }

    function renderGrid() {
        const grid = document.getElementById('channel-grid');
        grid.innerHTML = "";
        allChannels.forEach((ch, idx) => {
            if (currentFilter !== 'ALL' && !ch.g.includes(currentFilter)) return;
            const div = document.createElement('div');
            div.className = 'card' + (activeIdx === idx ? ' active' : '');
            div.innerHTML = `${ch.isVip ? '<div class="tag-vip">VIP</div>' : ''}<img src="${ch.l}" onerror="this.src='https://via.placeholder.com/100x42/222/555?text=TV'"><div>${ch.n}</div>`;
            div.onclick = () => play(idx);
            grid.appendChild(div);
        });
    }

    function play(idx) {
        activeIdx = idx; renderGrid();
        const ch = allChannels[idx];
        let srcObj = { src: ch.u, type: ch.u.includes('.mpd') ? 'application/dash+xml' : 'application/x-mpegURL' };
        if (ch.i) {
            srcObj.keySystems = { 'org.w3.clearkey': { clearkeys: { [base64ToHex(ch.i)]: base64ToHex(ch.k) } } };
        }
        player.src(srcObj);
        player.play().catch(() => { player.load(); player.play(); });
    }

    function filter(g, btn) {
        currentFilter = g;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGrid();
    }
    init();
</script>
