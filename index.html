<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMSUNG TV - QUỐC TẾ VIP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        :root { --gold: #ffcc00; --bg: #000; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #video-container { width: 100%; aspect-ratio: 16/9; background: #000; flex-shrink: 0; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 100; }
        video { width: 100%; height: 100%; background: #000; }

        .tabs { display: flex; overflow-x: auto; background: #111; padding: 10px; gap: 8px; flex-shrink: 0; scrollbar-width: none; }
        .tabs button { padding: 10px 16px; border: none; border-radius: 4px; background: #222; color: #888; white-space: nowrap; font-size: 13px; font-weight: bold; cursor: pointer; }
        .tabs button.active { background: var(--gold); color: #000; }

        #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding: 15px; overflow-y: auto; flex-grow: 1; }
        
        .item { background: #151515; border-radius: 8px; padding: 10px 5px; text-align: center; cursor: pointer; border: 2px solid transparent; position: relative; }
        .item.active { border-color: var(--gold); background: #221f00; }
        .img-wrap { width: 100%; height: 40px; display: flex; align-items: center; justify-content: center; margin-bottom: 5px; }
        .item img { max-width: 85%; max-height: 100%; object-fit: contain; }
        .item span { font-size: 11px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: bold; }
    </style>
</head>
<body>

<div id="video-container">
    <video id="video" controls autoplay playsinline></video>
</div>

<div class="tabs">
    <button class="active" onclick="setTab('ALL', this)">TẤT CẢ</button>
    <button onclick="setTab('VTV', this)">VTV</button>
    <button onclick="setTab('VTVCAB', this)">VTVCAB</button>
    <button onclick="setTab('SCTV', this)">SCTV</button>
    <button onclick="setTab('HTV', this)">HTV</button>
    <button onclick="setTab('ĐỊA PHƯƠNG', this)">ĐỊA PHƯƠNG</button>
    <button onclick="setTab('QUỐC TẾ', this)">QUỐC TẾ VIP</button>
</div>

<div id="list"></div>

<script>
    const GITHUB = "https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/ducnt123";
    const PROXY = "https://api.allorigins.win/raw?url=";
    let video, player, allData = [], curTab = "ALL";

    // Giải mã Base64 sang Hex cho kênh Quốc tế
    function b64ToHex(b64) {
        try {
            const bin = atob(b64.replace(/-/g, '+').replace(/_/g, '/'));
            let res = "";
            for (let i = 0; i < bin.length; i++) {
                let h = bin.charCodeAt(i).toString(16);
                res += (h.length === 1 ? '0' : '') + h;
            }
            return res;
        } catch(e) { return ""; }
    }

    // Chuyển Base64 sang Uint8Array (Bắt buộc cho Samsung TV)
    function b64ToUint8(b64) {
        try {
            const bin = atob(b64.replace(/-/g, '+').replace(/_/g, '/'));
            const res = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) res[i] = bin.charCodeAt(i);
            return res;
        } catch(e) { return null; }
    }

    async function init() {
        video = document.getElementById('video');
        shaka.polyfill.installAll();
        player = new shaka.Player(video);
        
        player.configure({
            streaming: { jumpLargeGaps: true, bufferingGoal: 10 }
        });

        await loadData();
        render();
        if(allData.length > 0) play(0);
    }

    async function loadData() {
        try {
            const r = await fetch(PROXY + encodeURIComponent(GITHUB));
            const txt = await r.text();
            let channels = [], cur = null;

            txt.split('\n').forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF')) {
                    const name = line.split(',')[1] || "Kênh";
                    const nU = name.toUpperCase();
                    let g = "ĐỊA PHƯƠNG";
                    if (nU.includes("VTVCAB")) g = "VTVCAB";
                    else if (nU.includes("SCTV")) g = "SCTV";
                    else if (nU.includes("HTV")) g = "HTV";
                    else if (nU.includes("VTV")) g = "VTV";
                    else if (nU.includes("HBO") || nU.includes("AXN") || nU.includes("DISCOVERY") || nU.includes("KIX")) g = "QUỐC TẾ";

                    cur = { n: name, u: "", l: line.match(/tvg-logo="([^"]+)"/i)?.[1] || "", g: g, kid: "", key: "" };
                } else if (line.includes('license_key=')) {
                    try {
                        const drm = JSON.parse(line.split('license_key=')[1]);
                        cur.kid = drm.keys[0].kid; 
                        cur.key = drm.keys[0].k;
                    } catch(e) {}
                } else if (line.startsWith('http')) {
                    if (cur) { cur.u = line; channels.push(cur); cur = null; }
                }
            });
            allData = channels;
        } catch(e) {}
    }

    async function play(idx) {
        const ch = allData[idx];
        if (!ch) return;

        await player.unload();
        video.removeAttribute('src');
        video.load();

        // Nếu là kênh Quốc tế VIP (Có Key DRM)
        if (ch.kid && ch.key) {
            const kidHex = b64ToHex(ch.kid);
            const keyUint8 = b64ToUint8(ch.key);
            
            if (kidHex && keyUint8) {
                let drm = {};
                drm[kidHex] = keyUint8;
                player.configure({ drm: { clearKeys: drm } });
                try {
                    await player.load(ch.u);
                } catch (e) {
                    try { await player.load(PROXY + encodeURIComponent(ch.u)); } catch(e2) {}
                }
            }
        } 
        // Nếu là link m3u8 (TV360 của bạn hoặc VTV)
        else {
            player.configure({ drm: { clearKeys: {} } });
            if (ch.u.includes('.mpd')) {
                try { await player.load(ch.u); } catch(e) {}
            } else {
                video.src = ch.u;
                video.play().catch(() => {
                    video.src = PROXY + encodeURIComponent(ch.u);
                });
            }
        }
        render(idx);
    }

    function render(activeIdx = -1) {
        const box = document.getElementById('list');
        box.innerHTML = "";
        allData.forEach((ch, i) => {
            if (curTab !== 'ALL' && ch.g !== curTab) return;
            const div = document.createElement('div');
            div.className = `item ${activeIdx === i ? 'active' : ''}`;
            div.innerHTML = `
                <div class="img-wrap"><img src="${ch.l}" onerror="this.src='https://via.placeholder.com/50?text=TV'"></div>
                <span>${ch.n}</span>
            `;
            div.onclick = () => play(i);
            box.appendChild(div);
        });
    }

    function setTab(t, btn) {
        curTab = t;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    init();
</script>
</body>
</html>
