<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truyền Hình Quốc Tế VIP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        :root { --accent: #ffcc00; --bg: #0a0a0a; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        #player-container { width: 100%; max-width: 960px; margin: 0 auto; background: #000; aspect-ratio: 16/9; border-bottom: 2px solid var(--accent); }
        video { width: 100%; height: 100%; display: block; }
        .channel-list { flex: 1; padding: 15px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
        .channel-item { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; transition: 0.2s; }
        .channel-item:hover { border-color: var(--accent); background: #222; }
        .channel-item.active { border-color: var(--accent); background: #2a2a00; }
        .channel-item img { width: 100%; height: 40px; object-fit: contain; margin-bottom: 8px; }
        .channel-item div { font-size: 11px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .header { padding: 10px; text-align: center; background: #111; color: var(--accent); font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="header" id="now-playing">Đang phát: DISCOVERY HD</div>

<div id="player-container">
    <video id="video" autoplay controls playsinline></video>
</div>

<div class="channel-list" id="grid"></div>

<script>
    // Dữ liệu mã Hex được trích xuất chính xác từ hình ảnh danh sách của bạn
    const VIP_CHANNELS = [
        { n: "DISCOVERY HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/dsc.smil/manifest.mpd", i: "eb4160ea553a321d899553e4e796fec2", k: "bea5a07157e0c4d17b11ab399517f952", l: "https://vnepg.site/logos/144.png" },
        { n: "HBO HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/hbo.smil/manifest.mpd", i: "09ddfe3d63863cafaeb79d3546b098ab", k: "3de0f38cf014827dfd5bec39743c6a2e", l: "https://vnepg.site/logos/129.png" },
        { n: "AXN HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd", i: "9d29f87efdec3c9fab368f724e62ad0e", k: "4f1c09c035eab36323d60d1454d3b20d", l: "https://vnepg.site/logos/163.png" },
        { n: "CARTOONITO", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/boomerang.smil/manifest.mpd", i: "b1f0d759e914369db3b8b30c81597156", k: "78d317e17037a8b89d539e452e5b1212", l: "https://vnepg.site/logos/138.png" },
        { n: "CINEMAX HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/max.smil/manifest.mpd", i: "acb4c23471063327adc732e283c0847f", k: "e9868f51473d0fd859ede4de48d531c2", l: "https://vnepg.site/logos/130.png" },
        { n: "ANIMAL PLANET", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/ap.smil/manifest.mpd", i: "ec6f472c7125377a9bc0ae61598095f4", k: "1d5388e078141debce364535b5d61d75", l: "https://vnepg.site/logos/143.png" },
        { n: "WARNER TV", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/wtv.smil/manifest.mpd", i: "086d09a40bff3a00aa6ddddbafbc13b2", k: "34f1908cfade05ee060116d40312cb24", l: "https://vnepg.site/logos/169.png" },
        { n: "BBC NEWS", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/bbcworldnews.smil/manifest.mpd", i: "c7ba46086dda345a92e29bf155e459c", k: "d374b8f39904bf572689ea347ae86591", l: "https://vnepg.site/logos/151.png" }
    ];

    let shakaPlayer;

    async function initPlayer() {
        const video = document.getElementById('video');
        shakaPlayer = new shaka.Player(video);

        // Lắng nghe lỗi để debug nếu cần
        shakaPlayer.addEventListener('error', (event) => console.error('Error code', event.detail.code, 'object', event.detail));

        // Tạo danh sách kênh trên giao diện
        const grid = document.getElementById('grid');
        VIP_CHANNELS.forEach((ch, idx) => {
            const item = document.createElement('div');
            item.className = 'channel-item';
            item.innerHTML = `<img src="${ch.l}"><div>${ch.n}</div>`;
            item.onclick = () => loadChannel(idx);
            grid.appendChild(item);
        });

        // Tự động phát kênh đầu tiên
        loadChannel(0);
    }

    async function loadChannel(index) {
        const ch = VIP_CHANNELS[index];
        document.getElementById('now-playing').innerText = "Đang phát: " + ch.n;
        
        // Cập nhật trạng thái active trên danh sách
        document.querySelectorAll('.channel-item').forEach((el, i) => {
            el.classList.toggle('active', i === index);
        });

        // Cấu hình trình giải mã ClearKey (DRM)
        shakaPlayer.configure({
            drm: {
                clearKeys: {
                    [ch.i]: ch.k
                }
            }
        });

        try {
            await shakaPlayer.load(ch.u);
            console.log('Kênh đã tải thành công!');
        } catch (e) {
            console.error('Lỗi tải kênh:', e);
        }
    }

    document.addEventListener('DOMContentLoaded', initPlayer);
</script>
</body>
</html>
