<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV VIP - FULL OPTION</title>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mux.js/6.0.1/mux.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>

    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{width:280px;padding:16px;font-family:'Segoe UI',system-ui,sans-serif;background:#202020;color:#f5f5f5;font-size:13px}
        h2{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
        p{color:#a0a0a0;line-height:1.5;margin-bottom:12px}
        .steps{list-style:none;counter-reset:s}
        .steps li{counter-increment:s;padding:6px 0;color:#ccc;display:flex;align-items:flex-start;gap:8px}
        .steps li::before{content:counter(s);background:#60a5fa;color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
        .highlight{color:#60a5fa;font-weight:600}
        .credit{margin-top:12px;text-align:center;font-size:11px;color:#666}
        .credit a{color:#60a5fa;text-decoration:none}
        .credit a:hover{text-decoration:underline}
</style>
</head>
<body>

<div id="video-box">
    <video id="video" controls autoplay playsinline></video>
</div>

<div class="tabs">
    <button class="active" onclick="setTab('ALL', this)">TẤT CẢ</button>
    <button onclick="setTab('VTV', this)">VTV</button>
    <button onclick="setTab('THIẾT YẾU', this)">🌐| Thiết yếu</button>
    <button onclick="setTab('VTVCab', this)">VTVCab</button>
    <button onclick="setTab('HTV', this)">HTV</button>
    <button onclick="setTab('HTVC', this)">HTVC</button> 
    <button onclick="setTab('SCTV', this)">SCTV</button>
    <button onclick="setTab('ĐỊA PHƯƠNG', this)">Địa Phương</button>
    <button onclick="setTab('QUỐC TẾ', this)">Quốc Tế</button>
</div>

<div id="list"></div>

<script>
    const GITHUB = "https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/ducnt123";
    let video, player, allData = [], curTab = "ALL", curIdx = -1;

    function toHex(val) {
        if (!val) return "";
        if (val.length === 32) return val;
        try {
            return Array.from(atob(val.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0).toString(16).padStart(2,'0')).join('');
        } catch(e) { return val; }
    }

    async function start() {
        shaka.polyfill.installAll();
        player = new shaka.Player(video);
        player.configure({ streaming: { bufferingGoal: 8, rebufferingGoal: 2 } });

        try {
            const r = await fetch(GITHUB_URL);
            const t = await r.text();
            let ext = [], cur = null;
            t.split('\n').forEach(l => {
                l = l.trim();
                if (l.startsWith('#EXTINF')) {
                    const n = l.split(',')[1] || "";
                    let g = "ĐỊA PHƯƠNG";
                    if (n.includes("VTVCAB")) g = "VTVCAB";
                    else if (n.includes("HTV")) g = "HTV";
                    cur = { n, u: "", l: l.match(/tvg-logo="([^"]+)"/i)?.[1] || "", g };
                } else if (l.startsWith('http') && cur) {
                    cur.u = l; ext.push(cur); cur = null;
                }
            });
            allData = [...FIXED_CHANNELS, ...ext].filter((v,i,a) => a.findIndex(x => x.u === v.u) === i);
            render();
            if(allData.length > 0) play(allData[0]);
        } catch(e) {}
    }

    async function play(ch) {
        await player.unload();
        let drmConfig = {};
        if (ch.i && ch.k) {
            drmConfig[toHex(ch.i)] = toHex(ch.k);
            player.configure({ drm: { clearKeys: drmConfig } });
        }
        try {
            await player.load(ch.u);
            video.play();
        } catch (e) {
            video.src = ch.u;
            video.play();
        }
        render(ch.u);
    }

    function render(activeUrl = "") {
        const box = document.getElementById('list');
        box.innerHTML = "";
        allData.forEach(ch => {
            if (curTab !== 'ALL' && ch.g !== curTab) return;
            const div = document.createElement('div');
            div.className = `item ${ch.u === activeUrl ? 'active' : ''}`;
            div.innerHTML = `<img src="${ch.l}" onerror="this.src='https://via.placeholder.com/50?text=TV'"><span>${ch.n}</span>`;
            div.onclick = () => play(ch);
            box.appendChild(div);
        });
    }

    function setTab(t, btn) {
        curTab = t;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    start();
</script>
</body>
</html>
