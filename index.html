    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        #video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-bottom: 2px solid #ffcc00; }
        video { width: 100%; height: 100%; outline: none; }
        .tabs { display: flex; overflow-x: auto; background: #111; padding: 10px; gap: 8px; border-bottom: 1px solid #333; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tabs button { padding: 10px 18px; border: none; background: #222; color: #999; font-size: 13px; font-weight: bold; cursor: pointer; border-radius: 4px; white-space: nowrap; }
        .tabs button.active { background: #ffcc00; color: #000; }
        #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding: 12px; overflow-y: auto; flex: 1; }
        .item { background: #111; padding: 12px 5px; text-align: center; border: 1px solid #222; border-radius: 6px; cursor: pointer; }
        .item.active { border-color: #ffcc00; background: #1a1a00; }
        .item img { height: 35px; max-width: 90%; object-fit: contain; display: block; margin: 0 auto 5px; }
        .item span { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; font-weight: bold; }
    </style>
</head>
<body>

<div id="video-box"><video id="video" controls autoplay playsinline></video></div>

<div class="tabs">
    <button class="active" onclick="setTab('ALL', this)">TẤT CẢ</button>
    <button onclick="setTab('VTV', this)">VTV</button>
    <button onclick="setTab('SCTV', this)">SCTV</button>
    <button onclick="setTab('VTVCAB', this)">VTVCAB</button>
    <button onclick="setTab('HTV', this)">HTV/HTVC</button>
    <button onclick="setTab('ĐỊA PHƯƠNG', this)">ĐỊA PHƯƠNG</button>
    <button onclick="setTab('QUỐC TẾ', this)">QUỐC TẾ</button>
</div>

        { n: "FASHION TV", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/ftv.smil/manifest.mpd", i: "wdnyVwECNQi/pnN+OoxwAQ", k: "MMNhPpsG4PfMIBAU8xv12A", l: "https://vnepg.site/logos/165.png", g: "QUỐC TẾ", v: true }
    ];

    function toHex(val) {
        if (!val) return "";
        if (val.length === 32) return val;
        try {
            return Array.from(atob(val.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0).toString(16).padStart(2,'0')).join('');
        } catch(e) { return val; }
    }

    async function start() {
        shaka.polyfill.installAll();
        player = new shaka.Player(video);
        player.configure({ streaming: { bufferingGoal: 8, rebufferingGoal: 2 } });

        try {
            const r = await fetch(GITHUB_URL);
            const t = await r.text();
            let ext = [], cur = null;
            t.split('\n').forEach(l => {
                l = l.trim();
                if (l.startsWith('#EXTINF')) {
                    const n = l.split(',')[1] || "";
                    let g = "ĐỊA PHƯƠNG";
                    if (n.includes("VTVCAB")) g = "VTVCAB";
                    else if (n.includes("HTV")) g = "HTV";
                    cur = { n, u: "", l: l.match(/tvg-logo="([^"]+)"/i)?.[1] || "", g };
                } else if (l.startsWith('http') && cur) {
                    cur.u = l; ext.push(cur); cur = null;
                }
            });
            allData = [...FIXED_CHANNELS, ...ext].filter((v,i,a) => a.findIndex(x => x.u === v.u) === i);
            render();
            if(allData.length > 0) play(allData[0]);
        } catch(e) {}
    }

    async function play(ch) {
        await player.unload();
        let drmConfig = {};
        if (ch.i && ch.k) {
            drmConfig[toHex(ch.i)] = toHex(ch.k);
            player.configure({ drm: { clearKeys: drmConfig } });
        }
        try {
            await player.load(ch.u);
            video.play();
        } catch (e) {
            video.src = ch.u;
            video.play();
        }
        render(ch.u);
    }

    function render(activeUrl = "") {
        const box = document.getElementById('list');
        box.innerHTML = "";
        allData.forEach(ch => {
            if (curTab !== 'ALL' && ch.g !== curTab) return;
            const div = document.createElement('div');
            div.className = `item ${ch.u === activeUrl ? 'active' : ''}`;
            div.innerHTML = `<img src="${ch.l}" onerror="this.src='https://via.placeholder.com/50?text=TV'"><span>${ch.n}</span>`;
            div.onclick = () => play(ch);
            box.appendChild(div);
        });
    }

    function setTab(t, btn) {
        curTab = t;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    start();
</script>
