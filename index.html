    ];
    
    function toHex(val) {
        if (!val || val.length === 32) return val;
        try { return Array.from(atob(val.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0).toString(16).padStart(2,'0')).join(''); } catch(e) { return val; }
    }

    async function start() {
        shaka.polyfill.installAll();
        if (window.muxjs) window.muxjs.mp4.transmuxer = window.muxjs.mp4.transmuxer;
        
        player = new shaka.Player(video);
        
        // CẤU HÌNH LOW LATENCY - BUFFER THẤP NHẤT
        player.configure({ 
            streaming: { 
                bufferingGoal: 3,        // Chỉ tải trước 3 giây
                rebufferingGoal: 1,      // Cần 1 giây dữ liệu là phát lại ngay
                bufferBehind: 0,         // Xóa dữ liệu cũ ngay lập tức để giải phóng RAM
                jumpLargeGaps: true
            } 
        });

        try {
            const r = await fetch(GITHUB_URL);
            const t = await r.text();
            let ext = [], cur = null;
            t.split('\n').forEach(l => {
                l = l.trim();
                if (l.startsWith('#EXTINF')) {
                    const n = l.split(',')[1] || "";
                    let g = "ĐỊA PHƯƠNG";
                    if (n.includes("VTVCAB")) g = "VTVCAB";
                    else if (n.includes("HTV")) g = "HTV";
                    cur = { n, u: "", l: l.match(/tvg-logo="([^"]+)"/i)?.[1] || "", g };
                } else if (l.startsWith('http') && cur) {
                    cur.u = l; ext.push(cur); cur = null;
                }
            });
            allData = [...FIXED_CHANNELS, ...ext].filter((v,i,a) => a.findIndex(x => x.u === v.u) === i);
            render();
            if(allData.length > 0) play(allData[0]);
        } catch(e) { allData = FIXED_CHANNELS; render(); }

        window.addEventListener('keydown', handleRemote);
    }

    async function play(ch) {
        if (player) await player.unload();
        video.pause(); video.src = "";
        iframe.src = "about:blank";
        video.style.display = 'none'; iframe.style.display = 'none';

        if (ch.u.includes('hoiquan.click') || ch.u.includes('module')) {
            iframe.style.display = 'block';
            setTimeout(() => { iframe.src = ch.u; }, 100);
        } else {
            video.style.display = 'block';
            let drmConfig = {};
            if (ch.i && ch.k) {
                drmConfig[toHex(ch.i)] = toHex(ch.k);
                player.configure({ drm: { clearKeys: drmConfig } });
            } else { player.configure({ drm: { clearKeys: {} } }); }
            
            try {
                await player.load(ch.u);
                video.play();
            } catch (e) {
                video.src = ch.u;
                video.play().catch(()=>{});
            }
        }
        render(ch.u);
    }

    function handleRemote(e) {
        const active = document.activeElement;
        switch(e.keyCode) {
            case 38: if(active.classList.contains('item')) document.querySelector('.tabs button.active').focus(); break;
            case 40: if(active.parentElement.id === 'tab-bar') document.querySelector('.item')?.focus(); break;
            case 37: active.previousElementSibling?.focus(); break;
            case 39: active.nextElementSibling?.focus(); break;
            case 13: active.click(); break;
        }
    }

    function render(activeUrl = "") {
        const box = document.getElementById('list');
        box.innerHTML = "";
        allData.forEach(ch => {
            if (curTab !== 'ALL' && ch.g !== curTab) return;
            const div = document.createElement('div');
            div.className = `item ${ch.u === activeUrl ? 'active' : ''}`;
            div.tabIndex = 0;
            div.innerHTML = `<img src="${ch.l}" onerror="this.src='https://via.placeholder.com/50?text=TV'"><span>${ch.n}</span>`;
            div.onclick = () => play(ch);
            box.appendChild(div);
        });
    }

    function setTab(t, btn) {
        curTab = t;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    start();
</script>
