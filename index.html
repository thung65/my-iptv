<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMSUNG TV PLAYER - FIXED</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #video-box { width: 100%; aspect-ratio: 16/9; background: #000; flex-shrink: 0; position: relative; }
        video { width: 100%; height: 100%; display: block; }
        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 18px; color: #ffcc00; }
        .tabs { display: flex; overflow-x: auto; background: #111; padding: 10px; gap: 5px; border-bottom: 1px solid #333; }
        .tabs button { padding: 8px 15px; border: none; background: #333; color: #fff; cursor: pointer; border-radius: 4px; white-space: nowrap; }
        .tabs button.active { background: #ffcc00; color: #000; font-weight: bold; }
        #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; padding: 10px; overflow-y: auto; flex: 1; }
        .item { background: #222; padding: 10px; text-align: center; border-radius: 5px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .item:hover { background: #333; }
        .item.active { border-color: #ffcc00; background: #333; }
        .item img { width: 100%; height: 40px; object-fit: contain; pointer-events: none; }
        .item span { font-size: 11px; display: block; margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none; }
        .item.loading-item { opacity: 0.5; }
    </style>
</head>
<body>

<div id="video-box">
    <video id="myVideo" controls autoplay playsinline></video>
    <div class="loading" id="loadingIndicator" style="display: none;">Đang tải...</div>
</div>

<div class="tabs" id="tabBar">
    <button class="active" onclick="setTab('TẤT CẢ', this)">TẤT CẢ</button>
    <button onclick="setTab('VTV', this)">VTV</button>
    <button onclick="setTab('SCTV', this)">SCTV</button>
    <button onclick="setTab('HTV', this)">HTV</button>
    <button onclick="setTab('QUỐC TẾ', this)">QUỐC TẾ</button>
    <button onclick="setTab('ĐỊA PHƯƠNG', this)">ĐỊA PHƯƠNG</button>
</div>

<div id="list">Đang tải dữ liệu...</div>

<script>
    // 1. Cấu hình hằng số
    const GITHUB_URL = "https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/mytvt";
    const FIXED_CHANNELS = [
        { n: "ĐỒNG NAI 3", u: "https://vietanhtv.id.vn/vieon.php?type=tivi&kenh=dong-nai-3", l: "https://vnepg.site/logos/95.png", g: "ĐỊA PHƯƠNG", t: "php" }
    ];

    // 2. Khai báo biến toàn cục
    let videoEl, shakaPlayer, allData = [], curTab = "TẤT CẢ";

    function toHex(val) {
        if (!val || val.length === 32) return val || "";
        try {
            return Array.from(atob(val.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0).toString(16).padStart(2,'0')).join('');
        } catch(e) { return val; }
    }

    // 3. Xác định loại link
    function getLinkType(url) {
        if (!url) return "unknown";
        const lower = url.toLowerCase();
        if (lower.includes('.mpd')) return "mpd";
        if (lower.includes('.m3u8')) return "m3u8";
        if (lower.includes('.php')) return "php";
        return "auto";
    }

    // 4. Phát kênh
    async function play(ch) {
        if (!shakaPlayer || !videoEl) {
            console.log("Player chưa khởi tạo");
            return;
        }

        showLoading(true);
        const linkType = ch.t || getLinkType(ch.u);

        try {
            // Reset trình phát hoàn toàn
            try {
                await shakaPlayer.unload();
            } catch(e) {}
            
            videoEl.pause();
            videoEl.removeAttribute('src');
            videoEl.src = '';
            videoEl.load();

            if (linkType === "mpd") {
                // Xử lý link MPD với Widevine DRM/ClearKey
                let drmConfig = { clearKeys: {} };
                
                if (ch.i && ch.k) {
                    // Có clearkey: chuyển hex
                    const keyId = toHex(ch.i);
                    const key = toHex(ch.k);
                    drmConfig.clearKeys[keyId] = key;
                    console.log("DRM ClearKey được cấu hình");
                }

                shakaPlayer.configure({ drm: drmConfig });
                
                // Cấu hình streaming cho MPD
                shakaPlayer.configure({ 
                    streaming: { 
                        bufferingGoal: 10,
                        rebufferingGoal: 8
                    }
                });

                await shakaPlayer.load(ch.u);
                await videoEl.play();
                console.log("Phát MPD thành công");

            } else if (linkType === "m3u8") {
                // Xử lý link M3U8 (HLS)
                shakaPlayer.configure({ drm: { clearKeys: {} } });
                
                shakaPlayer.configure({ 
                    streaming: { 
                        bufferingGoal: 10,
                        rebufferingGoal: 8
                    }
                });

                await shakaPlayer.load(ch.u);
                await videoEl.play();
                console.log("Phát M3U8 thành công");

            } else {
                // Xử lý link PHP hoặc loại khác (phát gốc)
                shakaPlayer.configure({ drm: { clearKeys: {} } });
                
                videoEl.src = ch.u;
                videoEl.crossOrigin = "anonymous";
                
                await videoEl.play();
                console.log("Phát Native (PHP/HLS) thành công");
            }

            renderList(ch.u);
            showLoading(false);

        } catch (error) {
            console.error("Lỗi phát:", error);
            showLoading(false);
            
            // Fallback: thử phát trực tiếp
            try {
                videoEl.src = ch.u;
                videoEl.crossOrigin = "anonymous";
                await videoEl.play();
                console.log("Fallback: Phát trực tiếp thành công");
            } catch(e) {
                console.error("Fallback thất bại:", e);
                alert("Không thể phát kênh này. Thử lại sau!");
            }
        }
    }

    function showLoading(show) {
        document.getElementById('loadingIndicator').style.display = show ? 'block' : 'none';
    }

    // 5. Khởi tạo ứng dụng
    async function initApp() {
        videoEl = document.getElementById('myVideo');
        
        // Cài đặt Shaka Player
        shaka.polyfill.installAll();
        
        if (shaka.Player.isBrowserSupported()) {
            shakaPlayer = new shaka.Player(videoEl);
            
            // Xử lý lỗi
            shakaPlayer.addEventListener('error', onPlayerError);
            
            // Tải dữ liệu
            try {
                const response = await fetch(GITHUB_URL);
                const text = await response.text();
                let extData = [], currentItem = null;

                text.split('\n').forEach(line => {
                    line = line.trim();
                    if (line.startsWith('#EXTINF')) {
                        const name = line.split(',')[1] || "Kênh không tên";
                        let group = "ĐỊA PHƯƠNG";
                        
                        if (name.includes("VTVCAB")) group = "VTVCAB";
                        else if (name.includes("SCTV")) group = "SCTV";
                        else if (name.includes("HTV")) group = "HTV";
                        else if (name.includes("VTV")) group = "VTV";
                        
                        currentItem = { 
                            n: name, 
                            u: "", 
                            l: line.match(/tvg-logo="([^"]+)"/i)?.[1] || "", 
                            g: group,
                            t: "auto",
                            i: line.match(/tvg-key-id="([^"]+)"/i)?.[1] || "",
                            k: line.match(/tvg-key="([^"]+)"/i)?.[1] || ""
                        };
                    } else if (line.startsWith('http') && currentItem) {
                        currentItem.u = line;
                        currentItem.t = getLinkType(line);
                        extData.push(currentItem);
                        currentItem = null;
                    }
                });

                allData = [...FIXED_CHANNELS, ...extData].filter((v, i, a) => a.findIndex(x => x.u === v.u) === i);
                console.log(`Tải được ${allData.length} kênh`);
                
                renderList();
                if (allData.length > 0) play(allData[0]);

            } catch (error) {
                console.error("Lỗi tải dữ liệu:", error);
                allData = FIXED_CHANNELS;
                renderList();
                if (allData.length > 0) play(allData[0]);
            }
        } else {
            alert("Trình duyệt không hỗ trợ Shaka Player");
        }
    }

    function onPlayerError(event) {
        console.error('Lỗi Shaka Player:', event.detail);
    }

    function renderList(activeUrl = "") {
        const container = document.getElementById('list');
        container.innerHTML = "";
        
        allData.forEach(ch => {
            if (curTab !== 'TẤT CẢ' && ch.g !== curTab) return;
            
            const itemDiv = document.createElement('div');
            itemDiv.className = `item ${ch.u === activeUrl ? 'active' : ''}`;
            itemDiv.innerHTML = `
                <img src="${ch.l}" onerror="this.src='https://via.placeholder.com/50?text=TV'" alt="${ch.n}">
                <span title="${ch.n}">${ch.n}</span>
            `;
            itemDiv.onclick = () => play(ch);
            container.appendChild(itemDiv);
        });
    }

    function setTab(tabName, btn) {
        curTab = tabName;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderList();
    }

    // Chạy khi trang tải xong
    document.addEventListener('DOMContentLoaded', initApp);
</script>

</body>
</html>
