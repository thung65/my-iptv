    function toHex(val) {
        if (!val) return "";
        if (val.length === 32) return val;
        try {
            return Array.from(atob(val.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0).toString(16).padStart(2,'0')).join('');
        } catch(e) { return val; }
    }

    async function start() {
        shaka.polyfill.installAll();
        player = new shaka.Player(video);
        player.configure({ streaming: { bufferingGoal: 8, rebufferingGoal: 2 } });

        try {
            const r = await fetch(GITHUB_URL);
            const t = await r.text();
            let ext = [], cur = null;
            t.split('\n').forEach(l => {
                l = l.trim();
                if (l.startsWith('#EXTINF')) {
                    const n = l.split(',')[1] || "";
                    let g = "ĐỊA PHƯƠNG";
                    if (n.includes("VTVCAB")) g = "VTVCAB";
                    else if (n.includes("HTV")) g = "HTV";
                    cur = { n, u: "", l: l.match(/tvg-logo="([^"]+)"/i)?.[1] || "", g };
                } else if (l.startsWith('http') && cur) {
                    cur.u = l; ext.push(cur); cur = null;
                }
            });
            allData = [...FIXED_CHANNELS, ...ext].filter((v,i,a) => a.findIndex(x => x.u === v.u) === i);
            render();
            if(allData.length > 0) play(allData[0]);
        } catch(e) {}
    }

    async function play(idx) {
        curIdx = idx; render();
        const ch = allData[idx];
        if (ch.i && ch.k) {
            player.configure({ drm: { clearKeys: { [toHex(ch.i)]: toHex(ch.k) } } });
        } else {
            player.configure({ drm: { clearKeys: {} } });
        }
        try {
            await player.load(ch.u);
            video.play();
        } catch (e) {
            if (ch.u.includes('.m3u8')) {
                video.src = ch.u; video.play();
            }
        }
    }

    function render() {
        const box = document.getElementById('list');
        box.innerHTML = "";
        allData.forEach((ch, i) => {
            if (curTab !== 'ALL' && ch.g !== curTab) return;
            const div = document.createElement('div');
            div.className = `item ${curIdx === i ? 'active' : ''}`;
            div.innerHTML = `
                ${ch.v ? '<div class="vip">VIP</div>' : ''}
                <div class="img-wrap"><img src="${ch.l || 'https://via.placeholder.com/100x45/222/555?text=TV'}" onerror="this.src='https://via.placeholder.com/100x45/222/555?text=TV'"></div>
                <span>${ch.n}</span>
            `;
            div.onclick = () => play(i);
            box.appendChild(div);
        });
    }

    function setTab(t, btn) {
        curTab = t;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
                        }
    start();
