<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMSUNG TV - CORE PRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        :root { --gold: #ffcc00; --bg: #000; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Video cố định - Giảm lag bằng cách cố định tỉ lệ 16/9 */
        #v-box { width: 100%; aspect-ratio: 16/9; background: #000; flex-shrink: 0; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 100; }
        video { width: 100%; height: 100%; }

        /* Thanh Tab mượt hơn */
        .tabs { display: flex; overflow-x: auto; background: #111; padding: 10px; gap: 8px; flex-shrink: 0; -webkit-overflow-scrolling: touch; }
        .tabs::-webkit-scrollbar { display: none; }
        .tabs button { padding: 8px 16px; border: none; border-radius: 4px; background: #222; color: #888; white-space: nowrap; font-size: 13px; font-weight: bold; cursor: pointer; }
        .tabs button.active { background: var(--gold); color: #000; }

        /* Danh sách kênh dùng Grid để Tivi render nhanh hơn */
        #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 10px; padding: 15px; overflow-y: auto; flex-grow: 1; }
        .item { background: #151515; border-radius: 8px; padding: 10px 5px; text-align: center; cursor: pointer; border: 2px solid transparent; }
        .item.active { border-color: var(--gold); background: #221f00; }
        .item img { height: 35px; max-width: 85%; object-fit: contain; margin-bottom: 5px; }
        .item span { font-size: 11px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: bold; }
    </style>
</head>
<body>

<div id="v-box"><video id="video" controls autoplay playsinline></video></div>

<div class="tabs" id="tab-bar">
    <button class="active" onclick="setTab('ALL', this)">TẤT CẢ</button>
</div>

<div id="list">Đang tải kênh...</div>

<script>
    const GITHUB = "https://raw.githubusercontent.com/thung65/Iptv-vietnam/main/ducnt123";
    const PROXY = "https://api.allorigins.win/raw?url=";
    let video, player, allData = [], curTab = "ALL";

    // BỘ GIẢI MÃ BẠN THÍCH (GIỮ NGUYÊN)
    function toHex(val) {
        if (!val) return "";
        if (val.length === 32) return val;
        try {
            // Chuyển Base64/Key dạng chuỗi sang Hex string cho Shaka
            const decoded = atob(val.replace(/-/g,'+').replace(/_/g,'/'));
            return Array.from(decoded, c => c.charCodeAt(0).toString(16).padStart(2,'0')).join('');
        } catch(e) { return val; }
    }

    // Chuyển Hex string sang Uint8Array (Bắt buộc để Tivi Samsung không lỗi)
    function hexToUint8(hex) {
        if (!hex) return null;
        const clean = hex.replace(/[: -]/g, '');
        const res = new Uint8Array(clean.length / 2);
        for (let i = 0; i < clean.length; i += 2) res[i / 2] = parseInt(clean.substring(i, 2), 16);
        return res; // Tivi Samsung cần mảng byte này
    }

    async function init() {
        video = document.getElementById('video');
        shaka.polyfill.installAll();
        player = new shaka.Player(video);
        player.configure({ streaming: { jumpLargeGaps: true } });
        
        await loadData();
    }

    async function loadData() {
        try {
            const r = await fetch(PROXY + encodeURIComponent(GITHUB + "?t=" + Date.now()));
            const t = await r.text();
            let channels = [], groups = new Set();
            
            // Tách cụm #EXTINF để không bao giờ thiếu kênh
            const parts = t.split('#EXTINF');
            parts.shift();

            parts.forEach(part => {
                const lines = part.split('\n');
                const info = lines[0];
                const name = info.split(',')[1]?.trim() || "Kênh";
                const logo = info.match(/tvg-logo="([^"]+)"/i)?.[1] || "";
                const group = info.match(/group-title="([^"]+)"/i)?.[1] || "Khác";
                
                let url = "", kid = "", key = "";
                lines.forEach(l => {
                    l = l.trim();
                    if (l.startsWith('http')) url = l;
                    else if (l.includes('license_key=')) {
                        const val = l.split('license_key=')[1];
                        if (val.startsWith('{')) {
                            const drm = JSON.parse(val);
                            kid = drm.keys[0].kid; key = drm.keys[0].k;
                        } else if (val.includes(':')) {
                            const p = val.split(':');
                            kid = p[0]; key = p[1];
                        }
                    }
                });

                if (url) {
                    channels.push({ n: name, l: logo, g: group, u: url, i: kid, k: key });
                    groups.add(group);
                }
            });

            allData = channels;
            createTabs(groups);
            render();
            if(allData.length > 0) play(allData[0]);
        } catch(e) { document.getElementById('list').innerText = "Lỗi kết nối!"; }
    }

    function createTabs(groups) {
        const bar = document.getElementById('tab-bar');
        // Sắp xếp: Tất cả -> Các nhóm -> Quốc tế (cuối)
        const sorted = Array.from(groups).sort((a,b) => a.includes("Quốc Tế") ? 1 : -1);
        sorted.forEach(g => {
            const btn = document.createElement('button');
            btn.innerText = g.toUpperCase();
            btn.onclick = (e) => setTab(g, e.target);
            bar.appendChild(btn);
        });
    }

    async function play(ch) {
        await player.unload();
        video.src = "";

        if (ch.i && ch.k) {
            const kidHex = toHex(ch.i);
            const keyHex = toHex(ch.k);
            
            // Ép ClearKey cho Samsung TV (Dùng mảng byte từ Hex)
            let drmConfig = {};
            // Chuyển key hex sang byte array
            const keyArr = new Uint8Array(keyHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
            drmConfig[kidHex] = keyArr;
            
            player.configure({ drm: { clearKeys: drmConfig } });
            try { await player.load(ch.u); } catch(e) {}
        } else {
            player.configure({ drm: { clearKeys: {} } });
            if (ch.u.includes('.mpd')) await player.load(ch.u);
            else video.src = ch.u;
        }
        render(ch.u);
    }

    function render(activeUrl = "") {
        const box = document.getElementById('list');
        box.innerHTML = "";
        allData.forEach(ch => {
            if (curTab !== 'ALL' && ch.g !== curTab) return;
            const div = document.createElement('div');
            div.className = `item ${ch.u === activeUrl ? 'active' : ''}`;
            div.innerHTML = `<img src="${ch.l}" onerror="this.src='https://via.placeholder.com/50?text=TV'"><span>${ch.n}</span>`;
            div.onclick = () => play(ch);
            box.appendChild(div);
        });
    }

    function setTab(t, btn) {
        curTab = t;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    init();
</script>
</body>
</html>
