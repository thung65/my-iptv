<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMSUNG IPTV - MPD & MP4 FIX</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        #video-box { width: 100%; aspect-ratio: 16/9; background: #000; }
        video { width: 100%; height: 100%; background: #000; }
        .tabs { display: flex; overflow-x: auto; background: #111; padding: 10px; gap: 8px; border-bottom: 1px solid #333; scrollbar-width: none; }
        .tabs button { padding: 10px 18px; border: none; background: #222; color: #999; font-size: 13px; font-weight: bold; cursor: pointer; border-radius: 4px; white-space: nowrap; }
        .tabs button.active { background: #ffcc00; color: #000; }
        #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding: 12px; overflow-y: auto; flex: 1; }
        .item { background: #111; padding: 10px 5px; text-align: center; border: 1px solid #222; border-radius: 6px; cursor: pointer; }
        .item.active { border-color: #ffcc00; background: #1a1a00; }
        .item img { height: 35px; max-width: 90%; object-fit: contain; display: block; margin: 0 auto 5px; background: #fff; border-radius: 3px; }
        .item span { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; font-weight: bold; }
    </style>
</head>
<body>

<div id="video-box"><video id="video" controls autoplay playsinline></video></div>

<div class="tabs">
    <button class="active" onclick="setTab('ALL', this)">TẤT CẢ</button>
    <button onclick="setTab('VTV', this)">VTV</button>
    <button onclick="setTab('SCTV', this)">SCTV</button>
    <button onclick="setTab('VTVCAB', this)">VTVCAB</button>
    <button onclick="setTab('HTV', this)">HTV</button>
    <button onclick="setTab('KHÁC', this)">KHÁC</button>
</div>

<div id="list"></div>

<script>
    const PROXY = "https://api.allorigins.win/raw?url=";
    const M3U_URL = "https://raw.githubusercontent.com/thung65/Iptv-vietnam/main/ducnt123";
    
    let video = document.getElementById('video'), player, allData = [], curTab = "ALL";

    function toHex(val) {
        if (!val || val.length === 32) return val;
        try { return Array.from(atob(val.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0).toString(16).padStart(2,'0')).join(''); } catch(e) { return val; }
    }

    async function start() {
        shaka.polyfill.installAll();
        player = new shaka.Player(video);

        try {
            const r = await fetch(PROXY + encodeURIComponent(M3U_URL));
            const t = await r.text();
            let lines = t.split('\n'), ext = [], cur = null;
            
            lines.forEach(l => {
                l = l.trim();
                if (l.startsWith('#EXTINF')) {
                    const name = l.split(',')[1] || "Kênh";
                    let g = "KHÁC";
                    const n = name.toUpperCase();
                    if (n.includes("VTVCAB")) g = "VTVCAB";
                    else if (n.includes("SCTV")) g = "SCTV";
                    else if (n.includes("VTV")) g = "VTV";
                    else if (n.includes("HTV")) g = "HTV";
                    cur = { n: name, u: "", l: l.match(/tvg-logo="([^"]+)"/i)?.[1] || "", g: g, i: "", k: "" };
                } else if (l.includes('license_key=')) {
                    try {
                        const drm = JSON.parse(l.split('license_key=')[1]);
                        cur.i = drm.keys[0].kid; cur.k = drm.keys[0].k;
                    } catch(e) {}
                } else if (l.startsWith('http')) {
                    if (cur) { cur.u = l; ext.push(cur); cur = null; }
                }
            });
            allData = ext;
            render();
            if(allData.length > 0) play(allData[0]);
        } catch(e) {}
    }

    async function play(ch) {
        await player.unload();
        video.removeAttribute('src');
        video.load();
        
        // KIỂM TRA LOẠI LINK
        const isMPD = ch.u.toLowerCase().includes('.mpd');
        const isMP4 = ch.u.toLowerCase().includes('.mp4');

        if (ch.i && ch.k) {
            // NẾU LÀ MPD CÓ KEY: PHẢI PHÁT TRỰC TIẾP QUA SHAKA
            let drmConfig = {};
            drmConfig[toHex(ch.i)] = toHex(ch.k);
            player.configure({ drm: { clearKeys: drmConfig } });
            try {
                await player.load(ch.u);
            } catch(e) {
                // Nếu lỗi do CORS, lúc này mới thử bọc Proxy cho MPD
                await player.load(PROXY + encodeURIComponent(ch.u));
            }
        } else if (isMP4) {
            // NẾU LÀ MP4: PHÁT TRỰC TIẾP BẰNG VIDEO SRC
            video.src = ch.u;
            video.onerror = () => { video.src = PROXY + encodeURIComponent(ch.u); video.play(); };
        } else {
            // CÁC LINK PHP/TV360 KHÁC
            player.configure({ drm: { clearKeys: {} } });
            video.src = ch.u;
            video.onerror = () => { video.src = PROXY + encodeURIComponent(ch.u); video.play(); };
        }

        video.play().catch(() => {
            video.src = PROXY + encodeURIComponent(ch.u);
            video.play();
        });
        render(ch.u);
    }

    function render(activeUrl = "") {
        const box = document.getElementById('list');
        box.innerHTML = "";
        allData.forEach(ch => {
            if (curTab !== 'ALL' && ch.g !== curTab) return;
            const div = document.createElement('div');
            div.className = `item ${ch.u === activeUrl ? 'active' : ''}`;
            div.innerHTML = `<img src="${ch.l}" onerror="this.src='https://via.placeholder.com/50?text=TV'"><span>${ch.n}</span>`;
            div.onclick = () => play(ch);
            box.appendChild(div);
        });
    }

    function setTab(t, btn) {
        curTab = t;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }
    start();
</script>
</body>
</html>
