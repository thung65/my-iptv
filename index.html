<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV VIP - Sắp xếp theo yêu cầu</title>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        :root { --gold: #ffcc00; --bg: #000; --card: #121212; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #video-box { width: 100%; max-width: 960px; margin: 0 auto; background: #000; aspect-ratio: 16/9; position: sticky; top: 0; z-index: 99; }
        video { width: 100%; height: 100%; }
        .tabs { display: flex; overflow-x: auto; background: #111; padding: 10px; gap: 8px; border-bottom: 1px solid #222; scrollbar-width: none; }
        .tabs button { padding: 8px 15px; border: none; border-radius: 20px; background: #222; color: #888; white-space: nowrap; font-size: 12px; font-weight: bold; cursor: pointer; }
        .tabs button.active { background: var(--gold); color: #000; }
        #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding: 15px; overflow-y: auto; flex: 1; }
        .item { background: var(--card); border-radius: 8px; padding: 10px 5px; text-align: center; cursor: pointer; border: 1px solid #222; position: relative; }
        .item.active { border-color: var(--gold); background: #1a1a00; }
        .item img { width: 100%; height: 40px; object-fit: contain; margin-bottom: 5px; }
        .item span { font-size: 11px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .vip { position: absolute; top: 5px; right: 5px; background: var(--gold); color: #000; font-size: 8px; padding: 1px 4px; border-radius: 2px; font-weight: bold; }
    </style>
</head>
<body>

<div id="video-box">
    <video id="video" controls autoplay playsinline></video>
</div>

<div class="tabs">
    <button class="active" onclick="setTab('ALL', this)">TẤT CẢ</button>
    <button onclick="setTab('VTV', this)">VTV/THIẾT YẾU</button>
    <button onclick="setTab('VTVCAB', this)">VTVCAB VIP</button>
    <button onclick="setTab('HTV', this)">HTV/HTVC</button>
    <button onclick="setTab('SCTV', this)">SCTV VIP</button>
    <button onclick="setTab('ĐỊA PHƯƠNG', this)">ĐỊA PHƯƠNG</button>
    <button onclick="setTab('QUỐC TẾ', this)">QUỐC TẾ VIP</button>
</div>

<div id="list"></div>

<script>
    const GITHUB = "https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/ducnt123";
    let video, player, allData = [], curTab = "ALL", curIdx = 0;

    // DANH SÁCH QUỐC TẾ (Sẽ được đẩy xuống dưới cùng)
    const FIXED_INT = [
        { n: "HBO HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/hbo.smil/manifest.mpd", i: "Cd3+PWOGPK+ut50FRrCYqw", k: "PeDzjc8BSCff1b7Dh0PGog", l: "https://vnepg.site/logos/129.png", g: "QUỐC TẾ", v: true },
        { n: "AXN HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd", i: "nSn4fv3sPJ+rNo9ySmKtDg", k: "bxwJwDXqs2Mj1g0UVNs9IA", l: "https://vnepg.site/logos/163.png", g: "QUỐC TẾ", v: true },
        { n: "CINEMAX HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/max.smil/manifest.mpd", i: "rLTCNHEGMyetxzLig8CEfw", k: "6YaPX0c9D9hpnt5I1THCsA", l: "https://vnepg.site/logos/130.png", g: "QUỐC TẾ", v: true },
        { n: "CINEMAWORLD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/cinemaworld.smil/manifest.mpd", i: "7nkVVk10OdCb01Vv/MyHpA", k: "s14Sp1pCpvkYRyOpD/QtnA", l: "https://vnepg.site/logos/164.png", g: "QUỐC TẾ", v: true },
        { n: "WARNER TV", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/wtv.smil/manifest.mpd", i: "CG0JpAv/OgCqbdTbr5wTsg", k: "NPGQjP4uBe4GAEbUDxSuyQ", l: "https://vnepg.site/logos/169.png", g: "QUỐC TẾ", v: true },
        { n: "DISCOVERY HD", u: "https://s7770.cdn.mytvnet.vn/pkg20/live_dzones/dsc.smil/manifest.mpd", i: "60Fg6lU6Mh2JlVPk55b+wg", k: "vqWgcVfgxNF7Eas5lRf5Ug", l: "https://vnepg.site/logos/144.png", g: "QUỐC TẾ", v: true },
        { n: "CARTOON HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/cn.smil/manifest.mpd", i: "PCAWZmCpOnWsd9uBVnOJ9w", k: "PMGt1Drszj/jHJxqKluMIQ", l: "https://vnepg.site/logos/140.png", g: "QUỐC TẾ", v: true },
        { n: "FASHION TV", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/ftv.smil/manifest.mpd", i: "wdnyVwECNQi/pnN+OoxwAQ", k: "MMNhPpsG4PfMIBAU8xv12A", l: "https://vnepg.site/logos/165.png", g: "QUỐC TẾ", v: true }
        // Bạn có thể dán tiếp các kênh quốc tế khác vào đây...
    ];

    function toHex(b64) {
        const bin = atob(b64); let res = "";
        for (let i = 0; i < bin.length; i++) {
            let h = bin.charCodeAt(i).toString(16);
            res += (h.length === 1 ? '0' : '') + h;
        }
        return res;
    }

    async function start() {
        video = document.getElementById('video');
        player = new shaka.Player(video);
        player.configure({ streaming: { jumpLargeGaps: true } });
        await load();
        render();
        if(allData.length > 0) play(0);
    }

    async function load() {
        let vnChannels = [];
        try {
            const r = await fetch(GITHUB);
            const txt = await r.text();
            let cur = null;
            txt.split('\n').forEach(line => {
                if (line.includes('#EXTINF')) {
                    const name = line.split(',')[1]?.trim();
                    const nU = name.toUpperCase();
                    let g = "ĐỊA PHƯƠNG", vip = false;

                    const INT_KEY = ["BOX MOVIE", "HAPPY KIDS", "MUSIC BOX", "CINE", "OUTDOOR", "HOLLYWOOD", "WOMAN", "HBO", "AXN", "DISCOVERY"];
                    if (INT_KEY.some(k => nU.includes(k))) { g = "QUỐC TẾ"; vip = true; }
                    else if (nU.includes("VTVCAB") || nU.includes("ON ")) { g = "VTVCAB"; vip = true; }
                    else if (nU.includes("SCTV")) { g = "SCTV"; vip = true; }
                    else if (nU.includes("HTV")) { g = "HTV"; vip = nU.includes("HTVC"); }
                    else if (nU.includes("VTV") || nU.includes("ANTV") || nU.includes("QPVN") || nU.includes("VIETNAM TODAY")) {
                        g = "VTV";
                        const free = ["VTV1", "ANTV", "QPVN", "HTV7", "HTV9", "VIETNAM TODAY"];
                        vip = !free.some(k => nU.includes(k));
                    }
                    cur = { n: name, u: "", l: line.match(/logo="([^"]+)"/)?.[1] || "", g: g, v: vip };
                } else if (line.startsWith('http') && cur) {
                    cur.u = line.trim();
                    vnChannels.push(cur);
                    cur = null;
                }
            });
        } catch(e) {}

        // KẾT HỢP: Việt Nam trước, Quốc tế dán cứng sau cùng
        allData = [...vnChannels, ...FIXED_INT];
    }

    async function play(idx) {
        curIdx = idx; render();
        const ch = allData[idx];
        if (ch.i && ch.k) {
            player.configure({ drm: { clearKeys: { [toHex(ch.i)]: toHex(ch.k) } } });
        } else {
            player.configure({ drm: { clearKeys: {} } });
        }
        try { await player.load(ch.u); video.play(); } catch (e) {}
    }

    function render() {
        const box = document.getElementById('list');
        box.innerHTML = "";
        allData.forEach((ch, i) => {
            if (curTab !== 'ALL' && ch.g !== curTab) return;
            const div = document.createElement('div');
            div.className = `item ${curIdx === i ? 'active' : ''}`;
            div.innerHTML = `${ch.v ? '<div class="vip">VIP</div>' : ''}<img src="${ch.l}" onerror="this.src='https://via.placeholder.com/100x40/222/555?text=TV'"><span>${ch.n}</span>`;
            div.onclick = () => play(i);
            box.appendChild(div);
        });
    }

    function setTab(t, btn) {
        curTab = t;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }
    start();
</script>
</body>
</html>
