<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV PLAYER FINAL</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #v-wrap { width: 100%; aspect-ratio: 16/9; background: #000; border-bottom: 2px solid #ffcc00; }
        video { width: 100%; height: 100%; }
        
        /* Tab menu: ALL đầu - QUỐC TẾ cuối */
        .tabs { display: flex; overflow-x: auto; background: #111; padding: 10px; gap: 5px; }
        .tabs button { padding: 8px 15px; border: none; background: #222; color: #aaa; border-radius: 4px; white-space: nowrap; cursor: pointer; }
        .tabs button.active { background: #ffcc00; color: #000; font-weight: bold; }

        #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding: 10px; overflow-y: auto; flex: 1; }
        .item { background: #1a1a1a; padding: 10px 5px; text-align: center; border-radius: 5px; cursor: pointer; border: 1px solid #333; }
        .item.active { border-color: #ffcc00; background: #332b00; }
        .item img { height: 40px; max-width: 90%; object-fit: contain; }
        .item span { display: block; font-size: 11px; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

<div id="v-wrap"><video id="video" controls autoplay playsinline></video></div>

<div class="tabs" id="tab-bar">
    <button class="active" onclick="setTab('ALL', this)">TẤT CẢ</button>
    <button onclick="setTab('VTV', this)">VTV</button>
    <button onclick="setTab('HTV', this)">HTV/HTVC</button>
    <button onclick="setTab('SCTV', this)">SCTV</button>
    <button onclick="setTab('VTVCAB', this)">VTVCAB</button>
    <button onclick="setTab('ĐỊA PHƯƠNG', this)">ĐỊA PHƯƠNG</button>
    <button onclick="setTab('QUỐC TẾ', this)">QUỐC TẾ</button>
</div>

<div id="list"></div>

<script>
    let player, video = document.getElementById('video');
    let curT = 'ALL', curI = 0;

    // DANH SÁCH TỔNG HỢP CỦA BẠN (Dán hết vào đây)
    const DATA = [
        { n: "HBO HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/hbo.smil/manifest.mpd", i: "Cd3+PWOGPK+ut50FRrCYqw", k: "PeDzjc8BSCff1b7Dh0PGog", l: "https://vnepg.site/logos/129.png", g: "QUỐC TẾ" },
        { n: "AXN HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd", i: "nSn4fv3sPJ+rNo9ySmKtDg", k: "bxwJwDXqs2Mj1g0UVNs9IA", l: "https://vnepg.site/logos/163.png", g: "QUỐC TẾ" },
        { n: "VTV3 HD", u: "https://live.fptplay53.net/fnxch2/vtv3hd_abr.smil/chunklist_b4200000.m3u8", l: "https://vnepg.site/logos/3.png", g: "VTV" },
        { n: "Kênh Hội Quán", u: "https://ace.hoiquan.click/module/IPTV/?id=youtv&accKenh=madam69", l: "https://via.placeholder.com/50", g: "VTV" }
    ];

    // Chuyển Base64/Hex về dạng Shaka hiểu được
    function fix(v) {
        if (!v) return ""; v = v.trim();
        if (v.length === 32) return v.toLowerCase();
        try {
            return Array.from(atob(v.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0).toString(16).padStart(2,'0')).join('').toLowerCase();
        } catch(e) { return v; }
    }

    async function init() {
        shaka.polyfill.installAll();
        player = new shaka.Player(video);
        player.addEventListener('error', (e) => {
            // NẾU SHAKA LỖI (như link Hội Quán), CHUYỂN SANG PHÁT TRỰC TIẾP
            if (video.src !== DATA[curI].u) {
                video.src = DATA[curI].u;
                video.play().catch(()=>{});
            }
        });
        show();
        play(0);
    }

    async function play(idx) {
        curI = idx; show();
        const ch = DATA[idx];
        await player.unload();
        video.src = ""; // Xóa link cũ hoàn toàn

        if (ch.i && ch.k) {
            player.configure({ drm: { clearKeys: { [fix(ch.i)]: fix(ch.k) } } });
        } else {
            player.configure({ drm: { clearKeys: {} } });
        }

        try {
            await player.load(ch.u);
        } catch (e) {
            // Lệnh dự phòng cuối cùng cho link Ace/M3U8 khó
            video.src = ch.u;
            video.play().catch(()=>{});
        }
    }

    function show() {
        const b = document.getElementById('list'); b.innerHTML = "";
        DATA.forEach((ch, i) => {
            if (curT !== 'ALL' && ch.g !== curT) return;
            const d = document.createElement('div');
            d.className = `item ${curI === i ? 'active' : ''}`;
            d.innerHTML = `<img src="${ch.l}" onerror="this.src='https://via.placeholder.com/50'"><span>${ch.n}</span>`;
            d.onclick = () => play(i);
            b.appendChild(d);
        });
    }

    function tab(g, btn) {
        curT = g;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        show();
    }

    init();
</script>
</body>
</html>
