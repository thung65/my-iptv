    <style>
        :root { --accent: #00ff42; --bg: #0a0a0a; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 360px; background: #111; border-right: 1px solid #222; display: flex; flex-direction: column; }
        .header { padding: 15px; background: #1a1a1a; border-bottom: 2px solid var(--accent); text-align: center; }
        .header h2 { margin: 0; font-size: 14px; color: var(--accent); text-transform: uppercase; }
        #list { flex: 1; overflow-y: auto; scrollbar-width: thin; }
        .g-title { background: #181818; padding: 10px; font-size: 11px; color: #777; text-transform: uppercase; position: sticky; top: 0; z-index: 10; }
        .item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #1a1a1a; display: flex; align-items: center; transition: 0.2s; }
        .item:hover { background: #222; }
        .item.active { background: #102a16; border-left: 4px solid var(--accent); color: var(--accent); }
        .logo { width: 50px; height: 32px; object-fit: contain; margin-right: 12px; background: #000; border-radius: 4px; border: 1px solid #333; }
        #main { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
        video { width: 100%; height: 100%; outline: none; }
        .vip-tag { font-size: 9px; padding: 2px 5px; background: var(--accent); color: #000; border-radius: 3px; margin-left: auto; font-weight: bold; }
    </style>
</head>

        { n: "CARTOONNITO", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/boomerang.smil/manifest.mpd", i: "sfDXWekUNp2ziLOw3IFZcQ", k: "VnjTF-FwB6iKm5U55FJlEg", l: "https://www.diversetechgeek.com/wp-content/uploads/2021/09/cartoonito_logo.jpeg" },

        { n: "FASHION TV", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/ftv.smil/manifest.mpd", i: "wdnyVwECNQi/pnN+OoxwAQ", k: "MMNhPpsG4PfMIBAU8xv12A", l: "https://vnepg.site/logos/165.png" },
        { n: "ABC AUSTRALIA HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/aplus.smil/manifest.mpd", i: "mgmnPsHcNIWE4vEw4n2mZw", k: "BvjRpv6v+9q5Kt80fntGnA", l: "https://vnepg.site/logos/153.png" }
    ];

    const GITHUB_URL = "https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/ducnt123";
    let allChannels = [];
    let player, hls, selectedIdx = 0;

    async function init() {
        shaka.polyfill.installAll();
        player = new shaka.Player(document.getElementById('video'));
        
        // Nạp danh sách VIP đã sửa logo
        VIP_DATA.forEach(c => allChannels.push({...c, g: "VIP QUỐC TẾ (ĐÃ FIX LOGO)"}));
        
        // Nạp thêm từ GitHub của bạn
        await loadGitHub();
        render();
        play(0);
    }

    async function loadGitHub() {
        try {
            const res = await fetch(GITHUB_URL);
            const text = await res.text();
            const lines = text.split('\n');
            let cur = null;
            lines.forEach(l => {
                l = l.trim();
                if (l.startsWith('#EXTINF')) {
                    const n = l.split(',')[1]?.trim();
                    const g = l.match(/group-title="([^"]+)"/);
                    const lo = l.match(/tvg-logo="([^"]+)"/);
                    cur = { n, g: g ? g[1] : "KÊNH KHÁC", l: lo ? lo[1] : "" };
                } else if (l.startsWith('http') && cur) {
                    cur.u = l;
                    if (!VIP_DATA.some(v => v.n === cur.n)) allChannels.push(cur);
                    cur = null;
                }
            });
        } catch(e) {}
    }

    function render() {
        const list = document.getElementById('list');
        list.innerHTML = ""; let lastG = "";
        allChannels.forEach((ch, idx) => {
            if (ch.g !== lastG) {
                const g = document.createElement('div'); g.className = 'g-title';
                g.innerText = ch.g; list.appendChild(g); lastG = ch.g;
            }
            const item = document.createElement('div');
            item.className = 'item' + (selectedIdx === idx ? ' active' : '');
            item.innerHTML = `
                <img class="logo" src="${ch.l}" onerror="this.src='https://via.placeholder.com/50x32/222/fff?text=TV'">
                <span>${ch.n}</span>
                ${ch.i ? '<span class="vip-tag">FIXED</span>' : ''}
            `;
            item.onclick = () => play(idx);
            list.appendChild(item);
        });
    }

    async function play(idx) {
        selectedIdx = idx; render();
        const ch = allChannels[idx];
        const video = document.getElementById('video');
        if (hls) { hls.destroy(); hls = null; }
        await player.unload();

        try {
            if (ch.i) {
                player.configure({
                    drm: { clearKeys: { [ch.i]: ch.k } },
                    streaming: { bufferingGoal: 10 }
                });
                player.getNetworkingEngine().registerRequestFilter((type, request) => {
                    request.headers['User-Agent'] = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36';
                });
                await player.load(ch.u);
            } else {
                if (Hls.isSupported()) { hls = new Hls(); hls.loadSource(ch.u); hls.attachMedia(video); }
                else { video.src = ch.u; }
            }
        } catch(e) { console.error("Lỗi:", e); }
    }

    init();
</script>

</html>
