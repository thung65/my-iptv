<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMSUNG TV PLAYER</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
        }
        #video-box { 
            width: 100%; 
            aspect-ratio: 16/9; 
            background: #000; 
            flex-shrink: 0; 
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video { 
            width: 100%; 
            height: 100%; 
            display: block; 
        }
        .status-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 100;
        }
        .status-message.show {
            display: block;
        }
        .tabs { 
            display: flex; 
            overflow-x: auto; 
            background: #111; 
            padding: 10px; 
            gap: 5px; 
            border-bottom: 1px solid #333; 
        }
        .tabs button { 
            padding: 8px 15px; 
            border: none; 
            background: #333; 
            color: #fff; 
            cursor: pointer; 
            border-radius: 4px; 
            white-space: nowrap;
            font-size: 12px;
        }
        .tabs button.active { 
            background: #ffcc00; 
            color: #000; 
            font-weight: bold; 
        }
        #list { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); 
            gap: 8px; 
            padding: 10px; 
            overflow-y: auto; 
            flex: 1; 
        }
        .item { 
            background: #222; 
            padding: 8px; 
            text-align: center; 
            border-radius: 5px; 
            cursor: pointer; 
            border: 2px solid transparent; 
            transition: 0.2s;
            font-size: 10px;
        }
        .item:hover { 
            background: #333; 
        }
        .item.active { 
            border-color: #ffcc00; 
            background: #333; 
        }
        .item img { 
            width: 100%; 
            height: 35px; 
            object-fit: contain;
            background: #111;
        }
        .item span { 
            font-size: 9px; 
            display: block; 
            margin-top: 4px; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div id="video-box">
    <video id="myVideo" controls autoplay playsinline></video>
    <div class="status-message" id="statusMsg">Đang tải...</div>
</div>

<div class="tabs" id="tabBar">
    <button class="active" onclick="setTab('TẤT CẢ', this)">TẤT CẢ</button>
    <button onclick="setTab('VTV', this)">VTV</button>
    <button onclick="setTab('SCTV', this)">SCTV</button>
    <button onclick="setTab('HTV', this)">HTV</button>
    <button onclick="setTab('QUỐC TẾ', this)">QUỐC TẾ</button>
</div>

<div id="list">Đang tải...</div>

<script>
    // ==== CONFIG ====
    const GITHUB_URL = "https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/mytvt";
    const TIMEOUT = 15000; // 15 giây timeout
    
    let videoEl, shakaPlayer, allData = [], curTab = "TẤT CẢ", currentChannel = null;

    // ==== HỆ THỐNG THÔNG BÁO ====
    function showStatus(msg, duration = 3000) {
        const el = document.getElementById('statusMsg');
        el.textContent = msg;
        el.classList.add('show');
        if (duration > 0) {
            setTimeout(() => el.classList.remove('show'), duration);
        }
    }

    // ==== XÁC ĐỊNH LOẠI LINK ====
    function getLinkType(url) {
        if (!url) return "unknown";
        const lower = url.toLowerCase();
        if (lower.includes('.mpd')) return "mpd";
        if (lower.includes('.m3u8') || lower.includes('m3u8')) return "m3u8";
        if (lower.includes('.php')) return "php";
        if (lower.includes('.ts') || lower.includes('playlist')) return "m3u8";
        return "auto";
    }

    // ==== CHUYỂN HEX ====
    function toHex(val) {
        if (!val || val.length === 32) return val || "";
        try {
            const str = atob(val.replace(/-/g, '+').replace(/_/g, '/'));
            return Array.from(str, c => c.charCodeAt(0).toString(16).padStart(2, '0')).join('');
        } catch(e) { 
            console.log("Không thể chuyển hex:", val);
            return val; 
        }
    }

    // ==== PHÁT VIDEO ====
    async function play(ch) {
        if (!videoEl || !shakaPlayer) {
            showStatus("❌ Player chưa sẵn sàng");
            return;
        }

        currentChannel = ch;
        showStatus("⏳ Đang kết nối...", -1);
        
        const linkType = getLinkType(ch.u);
        console.log(`Phát: ${ch.n} | Loại: ${linkType} | Link: ${ch.u.substring(0, 50)}...`);

        try {
            // Reset player
            await shakaPlayer.unload().catch(() => {});
            videoEl.pause();
            videoEl.src = '';
            videoEl.load();

            if (linkType === "mpd") {
                // ===== MPD (DASH) =====
                let drmConfig = {};
                
                if (ch.i && ch.k) {
                    const keyId = toHex(ch.i);
                    const key = toHex(ch.k);
                    drmConfig[keyId] = key;
                    console.log("✓ DRM ClearKey được thêm");
                }

                shakaPlayer.configure({
                    drm: { clearKeys: drmConfig },
                    streaming: {
                        bufferingGoal: 15,
                        rebufferingGoal: 8,
                        retryParameters: {
                            maxAttempts: 5,
                            baseDelay: 1000,
                            backoffMultiplier: 2,
                            maxDelay: 30000,
                            stallTimeout: 5000,
                            connectionTimeout: 10000
                        }
                    }
                });

                await shakaPlayer.load(ch.u);
                await videoEl.play();
                showStatus("✅ Phát MPD thành công", 2000);

            } else if (linkType === "m3u8") {
                // ===== M3U8 (HLS) =====
                shakaPlayer.configure({
                    drm: { clearKeys: {} },
                    streaming: {
                        bufferingGoal: 10,
                        rebufferingGoal: 6,
                        retryParameters: {
                            maxAttempts: 5,
                            baseDelay: 1000,
                            backoffMultiplier: 2,
                            maxDelay: 30000,
                            stallTimeout: 5000,
                            connectionTimeout: 10000
                        }
                    }
                });

                await shakaPlayer.load(ch.u);
                await videoEl.play();
                showStatus("✅ Phát M3U8 thành công", 2000);

            } else {
                // ===== PHP / AUTO =====
                videoEl.src = ch.u;
                videoEl.crossOrigin = "use-credentials";
                videoEl.controlsList = "nofullscreen";
                
                try {
                    await videoEl.play();
                    showStatus("✅ Phát PHP thành công", 2000);
                } catch(e) {
                    throw new Error("Native playback failed: " + e.message);
                }
            }

            renderList(ch.u);

        } catch (error) {
            console.error("Lỗi phát:", error.message);
            showStatus(`❌ Lỗi: ${error.message.substring(0, 30)}...`);
            
            // Fallback 1: Thử phát trực tiếp
            try {
                console.log("🔄 Thử fallback 1: Phát trực tiếp...");
                videoEl.src = ch.u;
                videoEl.crossOrigin = "use-credentials";
                await videoEl.play();
                showStatus("✅ Fallback: Phát thành công", 2000);
                return;
            } catch(e) {}

            // Fallback 2: Thử Shaka với CORS bypass
            try {
                console.log("🔄 Thử fallback 2: Shaka với CORS...");
                await shakaPlayer.load(ch.u);
                await videoEl.play();
                showStatus("✅ Fallback 2: Phát thành công", 2000);
                return;
            } catch(e) {}

            showStatus("❌ Không phát được kênh này");
        }
    }

    // ==== TẢI DỮ LIỆU ====
    async function loadChannels() {
        try {
            console.log("Tải dữ liệu từ:", GITHUB_URL);
            const response = await fetch(GITHUB_URL, { timeout: TIMEOUT });
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const text = await response.text();
            let extData = [], currentItem = null;

            text.split('\n').forEach(line => {
                line = line.trim();
                
                if (line.startsWith('#EXTINF')) {
                    const name = line.split(',')[1]?.trim() || "Kênh không tên";
                    let group = "KHÁC";
                    
                    if (name.includes("VTV")) group = "VTV";
                    else if (name.includes("SCTV")) group = "SCTV";
                    else if (name.includes("HTV")) group = "HTV";
                    else if (name.includes("HBO") || name.includes("Fox")) group = "QUỐC TẾ";
                    
                    currentItem = { 
                        n: name, 
                        u: "", 
                        l: line.match(/tvg-logo="([^"]+)"/i)?.[1] || "", 
                        g: group,
                        i: line.match(/tvg-chno="([^"]+)"/i)?.[1] || "",
                        k: line.match(/key="([^"]+)"/i)?.[1] || ""
                    };
                } else if (line.startsWith('http') && currentItem) {
                    currentItem.u = line;
                    extData.push(currentItem);
                    currentItem = null;
                }
            });

            allData = extData.filter((v, i, a) => a.findIndex(x => x.u === v.u) === i);
            console.log(`✓ Tải được ${allData.length} kênh`);
            return allData.length > 0;

        } catch (error) {
            console.error("Lỗi tải dữ liệu:", error);
            return false;
        }
    }

    // ==== RENDER DANH SÁCH ====
    function renderList(activeUrl = "") {
        const container = document.getElementById('list');
        container.innerHTML = "";
        
        let count = 0;
        allData.forEach(ch => {
            if (curTab !== 'TẤT CẢ' && ch.g !== curTab) return;
            
            count++;
            const itemDiv = document.createElement('div');
            itemDiv.className = `item ${ch.u === activeUrl ? 'active' : ''}`;
            itemDiv.innerHTML = `
                <img src="${ch.l}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22%3E%3Crect fill=%22%23333%22 width=%22100%22 height=%2240%22/%3E%3C/svg%3E'" alt="${ch.n}">
                <span title="${ch.n}">${ch.n}</span>
            `;
            itemDiv.onclick = () => play(ch);
            container.appendChild(itemDiv);
        });

        if (count === 0) {
            container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 20px; color: #999;">Không có kênh nào</div>`;
        }
    }

    // ==== ĐỔI TAB ====
    function setTab(tabName, btn) {
        curTab = tabName;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderList();
    }

    // ==== KHỞI TẠO ====
    async function initApp() {
        console.log("=== Khởi tạo ứng dụng ===");
        
        videoEl = document.getElementById('myVideo');
        shaka.polyfill.installAll();
        
        if (!shaka.Player.isBrowserSupported()) {
            showStatus("❌ Trình duyệt không hỗ trợ");
            return;
        }

        shakaPlayer = new shaka.Player(videoEl);
        shakaPlayer.addEventListener('error', (e) => {
            console.error('Shaka Error:', e.detail);
        });

        // Tải dữ liệu
        const success = await loadChannels();
        
        if (success) {
            renderList();
            showStatus("✅ Sẵn sàng", 1000);
            // Phát kênh đầu tiên
            setTimeout(() => play(allData[0]), 1000);
        } else {
            showStatus("❌ Không tải được danh sách kênh");
            document.getElementById('list').innerHTML = '<div style="grid-column: 1/-1; padding: 20px; color: #f00;">Lỗi: Không tải được dữ liệu từ GitHub</div>';
        }
    }

    // Chạy
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
    } else {
        initApp();
    }
</script>

</body>
</html>
