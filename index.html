<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IPTV PRO PLAYER</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.3.5/dist/shaka-player.ui.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.3.5/dist/controls.css">
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; display: flex; height: 100vh; }
        #sidebar { width: 300px; background: #111; border-right: 1px solid #333; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-weight: bold; color: #0078d4; border-bottom: 1px solid #333; }
        #channel-list { flex: 1; overflow-y: auto; }
        .channel-item { display: flex; align-items: center; padding: 10px; cursor: pointer; border-bottom: 1px solid #222; }
        .channel-item:hover { background: #222; }
        .channel-item.active { background: #005a9e; }
        .channel-logo { width: 50px; height: 30px; object-fit: contain; margin-right: 10px; background: #000; }
        #video-container { flex: 1; position: relative; }
        video { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="sidebar-header">LIVE TV</div>
        <div id="channel-list">Syncing...</div>
    </div>
    <div id="video-container" data-shaka-player-container>
        <video data-shaka-player id="video" autoplay></video>
    </div>

<script>
    // Phá cache bằng cách thêm số ngẫu nhiên vào link
    const M3U_URL = 'https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/ducnt123?v=' + Math.random();
    const DRM_KEYS = { '09ddfe3d63863cafaeb79d0546b098ab': '3de0f38dcf014827dfd5bec38743c6a2' };

    let hlsPlayer;
    async function init() {
        const video = document.getElementById('video');
        const ui = video['ui'];
        const player = ui.getControls().getPlayer();
        player.configure({ drm: { clearKeys: DRM_KEYS } });

        try {
            const res = await fetch(M3U_URL);
            const data = await res.text();
            render(data, player, video);
        } catch (e) { console.error("Load error"); }
    }

    function render(data, player, video) {
        const list = document.getElementById('channel-list');
        list.innerHTML = '';
        const lines = data.split('\n');
        let meta = {};

        lines.forEach(line => {
            if (line.includes('#EXTINF')) {
                const logo = line.match(/tvg-logo="([^"]+)"/);
                meta.logo = logo ? logo[1] : '';
                meta.name = line.split(',')[1] || 'No Name';
            } else if (line.startsWith('http')) {
                const url = line.trim();
                const div = document.createElement('div');
                div.className = 'channel-item';
                div.innerHTML = `<img class="channel-logo" src="${meta.logo}"> <span>${meta.name}</span>`;
                div.onclick = () => play(url, player, video, div);
                list.appendChild(div);
                meta = {};
            }
        });
    }

    async function play(url, player, video, el) {
        document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
        video.src = '';

        if (url.includes('.mpd')) {
            await player.load(url);
        } else if (url.includes('.m3u8')) {
            if (Hls.isSupported()) {
                hlsPlayer = new Hls();
                hlsPlayer.loadSource(url);
                hlsPlayer.attachMedia(video);
            }
        }
    }
    document.addEventListener('shaka-ui-loaded', init);
</script>
</body>
</html>
