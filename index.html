<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV GLOBAL - DRM PREMIUM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 320px; background: #111; display: flex; flex-direction: column; border-right: 1px solid #333; }
        .header { padding: 20px; background: #b71c1c; text-align: center; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        #channel-list { flex: 1; overflow-y: auto; padding: 10px; }
        .channel-item { padding: 12px; cursor: pointer; border-radius: 6px; margin-bottom: 8px; background: #1a1a1a; display: flex; align-items: center; transition: 0.2s; border: 1px solid transparent; }
        .channel-item:hover { background: #222; border-color: #444; }
        .channel-item.active { background: #b71c1c; border-color: #ffeb3b; font-weight: bold; }
        .channel-logo { width: 45px; height: 30px; margin-right: 12px; object-fit: contain; background: #fff; border-radius: 4px; padding: 2px; }
        #main-video { flex: 1; position: relative; background: radial-gradient(circle, #222 0%, #000 100%); }
        video { width: 100%; height: 100%; outline: none; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; display: none; }
        .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid #ffeb3b; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="header">📺 Kênh Quốc Tế Full</div>
    <div id="channel-list"></div>
</div>

<div id="main-video">
    <div id="overlay">
        <div class="spinner"></div>
        <p style="margin-top: 15px;">ĐANG GIẢI MÃ DRM...</p>
    </div>
    <video id="video-player" controls autoplay playsinline></video>
</div>

<script>
    // Danh sách kênh tổng hợp từ nguồn của bạn
    const CHANNELS = [
        { name: "HBO HD", id: "09ddfe3d63863cafaeb79d0546b098ab", key: "3de0f38dcf014827dfd5bec38743c6a2", url: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/hbo.smil/manifest.mpd" },
        { name: "AXN HD", id: "d29f87efdec3c9fab358f724e62ad0e", key: "6f1c09c03eab36323d60d1454db3d20", url: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd" },
        { name: "CINEMAX", id: "acb4c23471063327adc732e283c0847f", key: "e9868f51473d0fd859ede48d531c2b0", url: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/max.smil/manifest.mpd" },
        { name: "CINEMA WORLD", id: "ee7915564d7439d09bd3556fccc87a4a", key: "b35e12a75a42e5f9184723a90ff42d9c", url: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/cinemaworld.smil/manifest.mpd" },
        { name: "ANIMAL PLANET", id: "ec6f072c7125377a9bc0ae61598095f4", key: "1d5388e0781415ebcec99f4f5ad75875", url: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/ap.smil/manifest.mpd" },
        { name: "DREAMWORKS", id: "67dae20527c3dadaae503aa91577cb", key: "59328f621d56767bc5ff9404a8f94016", url: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/dreamwork.smil/manifest.mpd" },
        { name: "CARTOONITO", id: "b1f0d759e914369db388b3b0dc815971", key: "5678d317e17007a88a9b9539e4526512", url: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/boomerang.smil/manifest.mpd" },
        { name: "BBC CBEEBIES", id: "cca73a006b4b39a595207ceb5ed9ca0a", key: "b333d1140c261ef79896f97e06ff080c", url: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/cbb.smil/manifest.mpd" },
        { name: "WARNER TV", id: "086d09a40bff3a00aa6dd4dbaf9c13b2", key: "34f1908c1e2e05600046b04f14aec9d8", url: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/wtv.smil/manifest.mpd" },
        { name: "DMAX", id: "53b26f904ae03a20b56477cfb9c5dca2", key: "0c64ccfb978e739bd33344075492aec2", url: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/dmax.smil/manifest.mpd" },
        { name: "CARTOON NETWORK", id: "3c20166660a93a75ec77db81567389f7", key: "3cc1ad643aecee3fe31c9c6a2a5b8c21", url: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/cn.smil/manifest.mpd" },
        { name: "DISCOVERY ASIA", id: "934907b134be3963a6253a453846924c", key: "788e2835fb98568aed2f47bbdc091515", url: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/disc.smil/manifest.mpd" },
        { name: "ABC AUSTRALIA", id: "9a09a73ec1dc348584e2f130e27da667", key: "06f8d1a6feaffbdab92edf347e7b469c", url: "https://s935.cdn.mytvnet.vn/pkg20/live_dzones/aplus.smil/manifest.mpd" },
        { name: "BBC LIFESTYLE", id: "58b949986ed13294bc01b0f330abc527", key: "23e8c5f2fe202906ac2d6554d9527299", url: "https://s7770.cdn.mytvnet.vn/pkg20/live_dzones/bbclifestyle.smil/manifest.mpd" },
        { name: "BBC EARTH", id: "5014941a2c42379880b5ed72304c165f", key: "3fa1fe3d39a52f4eefd3ff7161e89fde", url: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/bbcearth.smil/manifest.mpd" },
        { name: "BBC WORLD NEWS", id: "c7ba46086dda345a929e29bf155e4d37", key: "4b8f39904bf572689ea347ae86591", url: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/bbcworldnews.smil/manifest.mpd" }
    ];

    let shakaPlayer;
    let currentIndex = -1;

    async function init() {
        const video = document.getElementById('video-player');
        shakaPlayer = new shaka.Player(video);

        // Chính sách mạng: Vượt rào cản chặn User-Agent
        shakaPlayer.getNetworkingEngine().registerRequestFilter((type, request) => {
            request.headers['User-Agent'] = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/115.0.0.0 Safari/537.36';
        });

        render();
        if (CHANNELS.length > 0) play(0);
    }

    function render() {
        const list = document.getElementById('channel-list');
        list.innerHTML = CHANNELS.map((ch, i) => `
            <div class="channel-item" id="ch-${i}" onclick="play(${i})">
                <img class="channel-logo" src="https://via.placeholder.com/45x30?text=TV">
                <span>${ch.name}</span>
            </div>
        `).join('');
    }

    async function play(index) {
        if (currentIndex === index) return;
        currentIndex = index;
        const ch = CHANNELS[index];
        const overlay = document.getElementById('overlay');
        overlay.style.display = 'flex';

        document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
        document.getElementById('ch-' + index).classList.add('active');

        // Áp dụng chìa khóa giải mã chính xác cho từng kênh
        shakaPlayer.configure({
            drm: { clearKeys: { [ch.id]: ch.key } }
        });

        try {
            await shakaPlayer.load(ch.url);
        } catch (e) {
            console.error("Lỗi chính sách luồng:", e);
        } finally {
            overlay.style.display = 'none';
        }
    }

    shaka.polyfill.installAll();
    init();
</script>
</body>
</html>
