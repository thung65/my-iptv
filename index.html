<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMSUNG TV - FIXED LAYOUT</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        /* Cấu trúc cố định toàn màn hình */
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Video luôn nằm trên cùng và cố định */
        #video-container { width: 100%; background: #000; aspect-ratio: 16/9; flex-shrink: 0; z-index: 10; border-bottom: 2px solid #ffcc00; }
        video { width: 100%; height: 100%; display: block; }

        /* Phần điều hướng */
        .tabs { display: flex; overflow-x: auto; background: #111; padding: 10px; gap: 8px; flex-shrink: 0; scrollbar-width: none; }
        .tabs button { padding: 12px 20px; border: none; background: #222; color: #999; font-weight: bold; border-radius: 4px; white-space: nowrap; cursor: pointer; font-size: 14px; }
        .tabs button.active { background: #ffcc00; color: #000; }

        /* Danh sách kênh có thể cuộn độc lập */
        #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; padding: 15px; overflow-y: auto; flex-grow: 1; background: #080808; }
        
        .item { background: #1a1a1a; padding: 10px 5px; text-align: center; border: 2px solid transparent; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .item.active { border-color: #ffcc00; background: #332b00; }
        .item:hover { background: #333; }
        .item img { height: 40px; max-width: 90%; margin-bottom: 8px; background: #fff; border-radius: 4px; object-fit: contain; padding: 2px; }
        .item span { font-size: 11px; display: block; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #eee; }
        
        /* Loading ẩn trên video */
        #status { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); padding: 5px 10px; font-size: 12px; border-radius: 4px; display: none; color: #ffcc00; }
    </style>
</head>
<body>

<div id="video-container">
    <div id="status">Đang tải...</div>
    <video id="video" controls autoplay playsinline></video>
</div>

<div class="tabs">
    <button class="active" onclick="setTab('ALL', this)">TẤT CẢ</button>
    <button onclick="setTab('VTV', this)">VTV</button>
    <button onclick="setTab('SCTV', this)">SCTV</button>
    <button onclick="setTab('VTVCAB', this)">VTVCAB</button>
    <button onclick="setTab('HTV', this)">HTV</button>
    <button onclick="setTab('ĐỊA PHƯƠNG', this)">ĐỊA PHƯƠNG</button>
    <button onclick="setTab('QUỐC TẾ', this)">QUỐC TẾ</button>
</div>

<div id="list"></div>

<script>
    const GITHUB_URL = "https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/ducnt123";
    const PROXY = "https://api.allorigins.win/raw?url=";
    
    let video = document.getElementById('video'), player, allData = [], curTab = "ALL";

    // BỘ GIẢI MÃ VẠN NĂNG (Hex/Base64/Base64Url)
    function universalDecode(str) {
        if (!str) return null;
        str = str.trim();
        // Kiểm tra định dạng Hex (cho VTV Prime/TV360)
        if (/^[0-9a-fA-F]{32}$/.test(str.replace(/[: -]/g, ''))) {
            const clean = str.replace(/[: -]/g, '').toLowerCase();
            const res = new Uint8Array(clean.length / 2);
            for (let i = 0; i < clean.length; i += 2) res[i / 2] = parseInt(clean.substring(i, i + 2), 16);
            return res;
        }
        // Thử giải mã Base64 (cho kênh Quốc tế)
        try {
            const b64 = str.replace(/-/g, '+').replace(/_/g, '/');
            const bin = atob(b64);
            const res = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) res[i] = bin.charCodeAt(i);
            return res;
        } catch (e) { return null; }
    }

    function bufToHex(buffer) {
        return Array.prototype.map.call(new Uint8Array(buffer), x => ('00' + x.toString(16)).slice(-2)).join('');
    }

    async function init() {
        shaka.polyfill.installAll();
        player = new shaka.Player(video);
        player.configure({ streaming: { jumpLargeGaps: true } });
        loadM3U();
    }

    async function loadM3U() {
        try {
            const r = await fetch(PROXY + encodeURIComponent(GITHUB_URL));
            const t = await r.text();
            parse(t);
        } catch (e) { document.getElementById('list').innerHTML = "Lỗi kết nối dữ liệu."; }
    }

    function parse(data) {
        const lines = data.split('\n');
        let channels = [], cur = null;
        for (let l of lines) {
            l = l.trim();
            if (l.startsWith('#EXTINF')) {
                const name = l.split(',')[1] || "Kênh";
                let g = "ĐỊA PHƯƠNG", n = name.toUpperCase();
                if (n.includes("VTVCAB")) g = "VTVCAB";
                else if (n.includes("SCTV")) g = "SCTV";
                else if (n.includes("VTV")) g = "VTV";
                else if (n.includes("HTV")) g = "HTV";
                else if (n.includes("HBO") || n.includes("AXN")) g = "QUỐC TẾ";
                cur = { n: name, u: "", l: l.match(/tvg-logo="([^"]+)"/i)?.[1] || "", g, kid: "", key: "" };
            } else if (l.includes('license_key=')) {
                try {
                    const drm = JSON.parse(l.split('license_key=')[1]);
                    cur.kid = drm.keys[0].kid; cur.key = drm.keys[0].k;
                } catch (e) {}
            } else if (l.startsWith('http')) {
                if (cur) { cur.u = l; channels.push(cur); cur = null; }
            }
        }
        allData = channels;
        render();
        if (allData.length > 0) play(allData[0]);
    }

    async function play(ch) {
        document.getElementById('status').style.display = 'block';
        await player.unload();
        video.src = "";

        if (ch.kid && ch.key) {
            const kidBuf = universalDecode(ch.kid);
            const keyBuf = universalDecode(ch.key);
            if (kidBuf && keyBuf) {
                let drm = {};
                drm[bufToHex(kidBuf)] = keyBuf;
                player.configure({ drm: { clearKeys: drm } });
                try { await player.load(ch.u); } catch (e) {
                    try { await player.load(PROXY + encodeURIComponent(ch.u)); } catch(e2) {}
                }
            }
        } else {
            player.configure({ drm: { clearKeys: {} } });
            if (ch.u.includes('.mpd')) {
                try { await player.load(ch.u); } catch(e) {}
            } else {
                video.src = ch.u;
            }
        }
        document.getElementById('status').style.display = 'none';
        render(ch.u);
    }

    function render(activeUrl = "") {
        const box = document.getElementById('list');
        box.innerHTML = "";
        allData.forEach(ch => {
            if (curTab !== 'ALL' && ch.g !== curTab) return;
            const div = document.createElement('div');
            div.className = `item ${ch.u === activeUrl ? 'active' : ''}`;
            div.innerHTML = `<img src="${ch.l}" onerror="this.src='https://via.placeholder.com/50?text=TV'"><span>${ch.n}</span>`;
            div.onclick = () => play(ch);
            box.appendChild(div);
        });
    }

    function setTab(t, btn) {
        curTab = t;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }
    init();
</script>
</body>
</html>
