<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV TỔNG LỰC - LỌC TRÙNG DRM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        :root { --red: #e50914; --side-w: 320px; }
        body { margin: 0; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: var(--side-w); background: #111; border-right: 1px solid #333; display: flex; flex-direction: column; flex-shrink: 0; }
        .header { padding: 15px; background: #1a1a1a; border-bottom: 2px solid var(--red); }
        .header h2 { margin: 0; font-size: 16px; color: var(--red); text-transform: uppercase; }
        #search { width: 100%; padding: 10px; margin-top: 10px; border-radius: 4px; border: none; background: #222; color: #fff; outline: none; box-sizing: border-box; }
        #list { flex: 1; overflow-y: auto; }
        .g-title { background: #222; padding: 10px 15px; font-size: 11px; color: #ffeb3b; text-transform: uppercase; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #333; }
        .item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #1a1a1a; font-size: 13px; display: flex; justify-content: space-between; transition: 0.2s; }
        .item:hover { background: #222; }
        .item.active { background: var(--red); font-weight: bold; }
        .tag { font-size: 9px; background: #444; padding: 2px 5px; border-radius: 3px; color: #ccc; }
        #main { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; }
        #loader { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
        .spin { width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid var(--red); border-radius: 50%; animation: s 1s linear infinite; }
        @keyframes s { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="header">
        <h2>IPTV ULTIMATE 2025</h2>
        <input type="text" id="search" placeholder="Tìm kênh...">
    </div>
    <div id="list"></div>
</div>

<div id="main">
    <div id="loader"><div class="spin"></div></div>
    <video id="video" autoplay playsinline controls></video>
</div>

<script>
    // 1. DANH SÁCH VIP (LUÔN GIỮ LẠI)
    const DRM_VIP = [
        { g: "QUỐC TẾ VIP (DRM)", n: "HBO HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/hbo.smil/manifest.mpd", i: "09ddfe3d63863cafaeb79d0546b098ab", k: "3de0f38dcf014827dfd5bec38743c6a2" },
        { g: "QUỐC TẾ VIP (DRM)", n: "CINEMAX", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/max.smil/manifest.mpd", i: "acb4c23471063327adc732e283c0847f", k: "e9868f51473d0fd859ede48d531c2b0" },
        { g: "QUỐC TẾ VIP (DRM)", n: "AXN HD", u: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd", i: "9d29f87efdec3c9fab368f724e62ad0e", k: "6f1c09c035eab36323d60d1454db3d20" },
        { g: "QUỐC TẾ VIP (DRM)", n: "DISCOVERY", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/discovery.smil/manifest.mpd", i: "8677c3850022370ca981c2f9435a4d46", k: "1689269430f9a2b8e390c50d3c631e78" },
        { g: "QUỐC TẾ VIP (DRM)", n: "ANIMAL PLANET", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/ap.smil/manifest.mpd", i: "ec6f072c7125377a9bc0ae61598095f4", k: "1d5388e0781415ebcec99f4f5ad75875" },
        { g: "QUỐC TẾ VIP (DRM)", n: "CINEMA WORLD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/cinemaworld.smil/manifest.mpd", i: "804d99f0744e3975877843d182550186", k: "859c0490f8450f389926869403d52361" },
        { g: "QUỐC TẾ VIP (DRM)", n: "SCTV 9 HD", u: "https://livecdn.seenow.vn/mean/SCTV9/manifest.mpd", i: "22a9a9a63d2746df9f90c184c596105a", k: "2d9d24caeaea42f8b44e413fe04f0e5c" },
        { g: "QUỐC TẾ VIP (DRM)", n: "SCTV 15 HD", u: "https://livecdn.seenow.vn/mean/SCTV15HD/manifest.mpd", i: "a7c942778e874d43be92b8d0a0cd11b4", k: "6d54358306571658ffdb952c6560688b" },
        { g: "QUỐC TẾ VIP (DRM)", n: "WARNER TV", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/warnertv.smil/manifest.mpd", i: "0886119565e33d3c8d9df20556209564", k: "77764d0d0df35f377c8e714659b8544c" },
        { g: "QUỐC TẾ VIP (DRM)", n: "FASHION TV", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/fashiontv.smil/manifest.mpd", i: "c1d9f25701023508ba6737e3a8c7001", k: "30c3613e9b06e0f7cc201014f31bf5d" }
    ];

    const GITHUB_URL = "https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/ducnt123";
    let allChannels = [...DRM_VIP]; 
    let player;

    // Chuẩn hóa tên để so sánh (xóa dấu, xóa khoảng trắng, viết hoa)
    function cleanName(n) { return n.toUpperCase().replace(/\s+/g, '').replace(/HD/g, ''); }

    async function init() {
        shaka.polyfill.installAll();
        player = new shaka.Player(document.getElementById('video'));

        try {
            const res = await fetch(GITHUB_URL);
            const text = await res.text();
            const lines = text.split('\n');
            let cur = null;

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF')) {
                    const name = line.substring(line.lastIndexOf(',') + 1).trim();
                    const group = line.match(/group-title="([^"]+)"/)?.[1] || "KÊNH KHÁC";
                    cur = { n: name, g: group };
                } else if (line.startsWith('http') && cur) {
                    cur.u = line;
                    
                    // KIỂM TRA LỌC TRÙNG
                    const isDuplicate = DRM_VIP.some(v => cleanName(v.n) === cleanName(cur.n));
                    
                    if (!isDuplicate) {
                        allChannels.push(cur);
                    }
                    cur = null;
                }
            });
        } catch (e) { console.error("GitHub Error"); }

        render(allChannels);
        if(allChannels.length > 0) play(0);

        document.getElementById('search').oninput = (e) => {
            const k = e.target.value.toLowerCase();
            render(allChannels.filter(c => c.n.toLowerCase().includes(k) || c.g.toLowerCase().includes(k)));
        };
    }

    function render(list) {
        const container = document.getElementById('list');
        container.innerHTML = "";
        let lastG = "";
        list.forEach((ch, idx) => {
            if (ch.g !== lastG) {
                const g = document.createElement('div');
                g.className = 'g-title'; g.innerText = ch.g;
                container.appendChild(g); lastG = ch.g;
            }
            const d = document.createElement('div');
            d.className = 'item'; 
            d.innerHTML = `<span>${ch.n}</span> ${ch.i ? '<span class="tag">DRM</span>' : ''}`;
            d.onclick = () => play(allChannels.indexOf(ch));
            container.appendChild(d);
        });
    }

    async function play(idx) {
        const ch = allChannels[idx];
        const loader = document.getElementById('loader');
        loader.style.display = 'flex';

        document.querySelectorAll('.item').forEach((el, i) => {
            el.classList.toggle('active', allChannels.indexOf(ch) === i);
        });

        try {
            player.configure({
                drm: { clearKeys: ch.i ? { [ch.i]: ch.k } : {} }
            });

            player.getNetworkingEngine().registerRequestFilter((type, request) => {
                request.headers['User-Agent'] = 'Dalvik/2.1.0';
            });

            await player.load(ch.u);
            loader.style.display = 'none';
        } catch (e) {
            console.error(e);
            loader.style.display = 'none';
        }
    }

    init();
</script>
</body>
</html>
