<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Web Player - Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.3.5/dist/shaka-player.ui.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.3.5/dist/controls.css">
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 280px; background: #111; border-right: 1px solid #333; overflow-y: auto; z-index: 10; }
        #main { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; }
        .channel-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #222; font-size: 14px; }
        .channel-item:hover { background: #333; }
        .active { background: #0078d4 !important; font-weight: bold; }
        #video { width: 100%; height: 100%; background: #000; }
        .header { padding: 15px; background: #222; font-weight: bold; color: #0078d4; border-bottom: 1px solid #333; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="header">DANH SÁCH KÊNH</div>
    <div id="list">Đang tải playlist...</div>
</div>

<div id="main" data-shaka-player-container>
    <video data-shaka-player id="video" autoplay></video>
</div>

<script>
    const playlistUrl = 'https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/ducnt123';
    const clearKeyID = '09ddfe3d63863cafaeb79d0546b098ab';
    const clearKey = '3de0f38dcf014827dfd5bec38743c6a2';

    let shakaPlayer;
    let hlsInstance;

    async function init() {
        const video = document.getElementById('video');
        const ui = video['ui'];
        shakaPlayer = ui.getControls().getPlayer();

        // Tải danh sách kênh
        try {
            const res = await fetch(playlistUrl);
            const text = await res.text();
            renderChannels(text);
        } catch (e) {
            document.getElementById('list').innerHTML = "Lỗi tải playlist!";
        }
    }

    function renderChannels(data) {
        const lines = data.split('\n');
        const listDiv = document.getElementById('list');
        listDiv.innerHTML = '';
        let currentTitle = '';

        lines.forEach(line => {
            if (line.startsWith('#EXTINF')) {
                currentTitle = line.split(',')[1] || "Kênh không tên";
            } else if (line.startsWith('http')) {
                const url = line.trim();
                const btn = document.createElement('div');
                btn.className = 'channel-item';
                btn.innerText = currentTitle;
                btn.onclick = () => play(url, btn);
                listDiv.appendChild(btn);
            }
        });
    }

    async function play(url, element) {
        const video = document.getElementById('video');
        
        // Reset trạng thái
        document.querySelectorAll('.channel-item').forEach(d => d.classList.remove('active'));
        element.classList.add('active');
        if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
        video.src = '';

        // Phân loại xử lý
        if (url.includes('.mpd')) {
            // Cấu hình DRM cho file MPD
            shakaPlayer.configure({
                drm: { clearKeys: { [clearKeyID]: clearKey } }
            });
            try {
                await shakaPlayer.load(url);
            } catch (e) { alert("Lỗi MPD: " + e.code); }
        } 
        else if (url.includes('.m3u8')) {
            // Hỗ trợ HLS (m3u8)
            if (Hls.isSupported()) {
                hlsInstance = new Hls();
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else {
                video.src = url; // Dành cho Safari/iOS
            }
        }
        else {
            // Link video thường (mp4, v.v.)
            video.src = url;
            video.play();
        }
    }

    document.addEventListener('shaka-ui-loaded', init);
</script>

</body>
</html>
