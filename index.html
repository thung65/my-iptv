<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV ULTIMATE PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.3.5/dist/shaka-player.ui.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.3.5/dist/controls.css">
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        /* Left Sidebar */
        #sidebar { width: 320px; background: #111; border-right: 1px solid #222; display: flex; flex-direction: column; }
        
        /* Category / Menu Header */
        .menu-header { padding: 15px; background: #1a1a1a; border-bottom: 2px solid #0084ff; text-align: center; }
        .all-channels-btn { 
            background: #0084ff; color: white; border: none; padding: 10px 20px; 
            border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%;
        }
        .all-channels-btn:hover { background: #0056b3; }

        #channel-list { flex: 1; overflow-y: auto; }
        .channel-item { display: flex; align-items: center; padding: 12px; cursor: pointer; border-bottom: 1px solid #1a1a1a; transition: 0.2s; }
        .channel-item:hover { background: #222; }
        .channel-item.active { background: #004a99; border-left: 4px solid #fff; }
        
        .channel-logo { width: 55px; height: 32px; object-fit: contain; margin-right: 12px; background: #000; border-radius: 4px; }
        .channel-name { font-size: 14px; font-weight: 500; }

        /* Main Video Area */
        #main-content { flex: 1; position: relative; background: #000; }
        video { width: 100%; height: 100%; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="menu-header">
        <button class="all-channels-btn" onclick="scrollToTop()">ALL CHANNELS</button>
    </div>
    <div id="channel-list">Loading Playlist...</div>
</div>

<div id="main-content" data-shaka-player-container>
    <video data-shaka-player id="video" autoplay></video>
</div>

<script>
    const M3U_SOURCE = 'https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/ducnt123?v=' + Date.now();
    const DRM_CONFIG = { '09ddfe3d63863cafaeb79d0546b098ab': '3de0f38dcf014827dfd5bec38743c6a2' };

    let playerInstance;

    async function initPlayer() {
        const video = document.getElementById('video');
        const ui = video['ui'];
        playerInstance = ui.getControls().getPlayer();

        // Optimized for Speed & AutoPlay
        playerInstance.configure({
            drm: { clearKeys: DRM_CONFIG },
            streaming: {
                rebufferingGoal: 1,
                bufferingGoal: 5,
                lowLatencyMode: true
            }
        });

        try {
            const response = await fetch(M3U_SOURCE);
            const m3uText = await response.text();
            parsePlaylist(m3uText);
        } catch (e) {
            document.getElementById('channel-list').innerText = "Load Failed!";
        }
    }
