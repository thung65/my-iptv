    ];

    let player;

    async function init() {
        player = new shaka.Player(document.getElementById('video'));
        const grid = document.getElementById('list');
        DATA.forEach((ch, idx) => {
            const div = document.createElement('div');
            div.className = 'ch';
            div.innerText = ch.n;
            div.onclick = () => load(idx);
            grid.appendChild(div);
        });
        if (DATA.length > 0) load(0);
    }

    async function load(idx) {
        const ch = DATA[idx];
        document.querySelectorAll('.ch').forEach((el, i) => el.classList.toggle('active', i === idx));
        player.configure({ drm: { clearKeys: { [ch.i]: ch.k } } });
        try { await player.load(ch.u); } catch (e) { console.error(e); }
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
