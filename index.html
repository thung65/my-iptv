<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV GITHUB FIRST - VIP DECRYPT</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --accent: #00ff42; --bg: #050505; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 380px; background: #0f0f0f; border-right: 1px solid #222; display: flex; flex-direction: column; }
        .header { padding: 15px; background: #151515; border-bottom: 2px solid var(--accent); }
        .header h2 { margin: 0; font-size: 14px; color: var(--accent); text-transform: uppercase; }
        .search-box { padding: 10px; background: #111; }
        #search { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; outline: none; }
        #list { flex: 1; overflow-y: auto; scrollbar-width: thin; }
        .g-title { background: #1a1a1a; padding: 10px 15px; font-size: 11px; color: var(--accent); text-transform: uppercase; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #222; opacity: 0.9; }
        .item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #111; font-size: 13px; display: flex; align-items: center; transition: 0.2s; }
        .item:hover { background: #181818; }
        .item.active { background: #102a16; color: var(--accent); border-left: 4px solid var(--accent); }
        .channel-logo { width: 50px; height: 35px; object-fit: contain; margin-right: 12px; background: #000; border-radius: 4px; }
        #main { flex: 1; position: relative; background: #000; display: flex; align-items: center; }
        video { width: 100%; height: 100%; outline: none; }
        #loader { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
        .spin { width: 40px; height: 40px; border: 3px solid #222; border-top: 3px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="header">
        <h2>DANH SÁCH GITHUB & VIP</h2>
        <div id="status" style="font-size: 10px; color: #666; margin-top:5px;">Đang ưu tiên tải GitHub...</div>
    </div>
    <div class="search-box">
        <input type="text" id="search" placeholder="Tìm tên kênh hoặc nhóm...">
    </div>
    <div id="list"></div>
</div>

<div id="main">
    <div id="loader"><div class="spin"></div><p style="margin-top:10px; font-size: 12px; color: var(--accent);">ĐANG GIẢI MÃ DRM...</p></div>
    <video id="video" autoplay playsinline controls></video>
</div>

<script>
    // Dữ liệu giải mã chuẩn (Sẽ được dùng để thay thế link thường nếu tên kênh trùng nhau)
    const VIP_MAP = {
        "HBO HD": { u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/hbo.smil/manifest.mpd", i: "09ddfe3d63863cafaeb79d0546b098ab", k: "3de0f38dcf014827dfd5bec38743c6a2", l: "https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/2025101112004508.jpg" },
        "DMAX": { u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/dmax.smil/manifest.mpd", i: "53b26f934ae03a20b56477cfb9c5dca2", k: "0c64ccfb978e739bd33344075492aec3", l: "https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/2025110412260998.jpg" },
        "CINEMAX HD": { u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/max.smil/manifest.mpd", i: "acb4c23471063327adc732e283c0847f", k: "e9868f51473d0fd859ede48d531c2b0", l: "https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/2025101112012221.jpg" },
        "AXN HD": { u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd", i: "9d29f87efdec3c9fab368f724e62ad0e", k: "6f1c09c035eab36323d60d1454db3d20", l: "https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/2025101112020264.jpg" },
        "CINEMAXWORLD HD": { u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/cinemaworld.smil/manifest.mpd", i: "ee7915564d7439d09bd3556ffccc87a4", k: "b35e12a75a42e4f9184723a90ff42d9c", l: "https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/2025101112013869.jpg" },
        "DISCOVERY HD": { u: "https://s7770.cdn.mytvnet.vn/pkg20/live_dzones/dsc.smil/manifest.mpd", i: "60Fg6lU6Mh2JlVPk55b+wg", k: "vqWgcVfgxNF7Eas5lRf5Ug", l: "https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/2025101112294108.jpg" },
        "DISCOVERY ASIA HD": { u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/dscasia.smil/manifest.mpd", i: "k0kHsTS+OWOmJjpFOEaSTA", k: "eI4oNfuYVortL0e73AkVFQ", l: "https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/2025101112300368.jpg" },
        "CARTOON NETWORK HD": { u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/cn.smil/manifest.mpd", i: "PCAWZmCpOnWsd9uBVnOJ9w", k: "PMGt1Drszj/jHJxqKluMIQ", l: "https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/2025101112303314.jpg" },
        "WBTV HD": { u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/wtv.smil/manifest.mpd", i: "CG0JpAv/OgCqbdTbr5wTsg", k: "NPGQjP4uBe4GAEbUDxSuyQ", l: "https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/2025101113084887.jpg" }
    };

    const GITHUB_URL = "https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/ducnt123";
    let allChannels = [];
    let player, hls;

    async function init() {
        shaka.polyfill.installAll();
        player = new shaka.Player(document.getElementById('video'));
        await loadGitHubFirst();
        render();
        play(0);
        
        document.getElementById('search').addEventListener('input', (e) => render(e.target.value));
    }

    async function loadGitHubFirst() {
        try {
            const res = await fetch(GITHUB_URL);
            const text = await res.text();
            const lines = text.split('\n');
            let current = null;

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF')) {
                    const name = line.split(',')[1]?.trim();
                    const group = line.match(/group-title="([^"]+)"/);
                    const logo = line.match(/tvg-logo="([^"]+)"/);
                    if (name) {
                        current = { n: name, g: group ? group[1] : "GITHUB", l: logo ? logo[1] : "" };
                    }
                } else if (line.startsWith('http') && current) {
                    current.u = line;
                    // Kiểm tra nếu kênh này có Key giải mã VIP thì cập nhật luôn
                    if (VIP_MAP[current.n]) {
                        const vip = VIP_MAP[current.n];
                        current.u = vip.u;
                        current.i = vip.i;
                        current.k = vip.k;
                        current.l = vip.l;
                    }
                    allChannels.push(current);
                    current = null;
                }
            });
            document.getElementById('status').innerText = `GitHub: ${allChannels.length} kênh - Đã ưu tiên đầu danh sách.`;
        } catch (e) { document.getElementById('status').innerText = "Lỗi kết nối GitHub!"; }
    }

    function render(filter = "") {
        const list = document.getElementById('list');
        list.innerHTML = "";
        let lastG = "";
        const filtered = allChannels.filter(ch => 
            ch.n.toLowerCase().includes(filter.toLowerCase()) || 
            ch.g.toLowerCase().includes(filter.toLowerCase())
        );

        filtered.forEach((ch, idx) => {
            if (ch.g !== lastG) {
                const g = document.createElement('div');
                g.className = 'g-title'; g.innerText = ch.g;
                list.appendChild(g); lastG = ch.g;
            }
            const item = document.createElement('div');
            item.className = 'item';
            const img = ch.l || "https://via.placeholder.com/50x35/222/fff?text=TV";
            item.innerHTML = `
                <img class="channel-logo" src="${img}" onerror="this.src='https://via.placeholder.com/50x35/222/fff?text=TV'">
                <div class="channel-info">
                    <span>${ch.n}</span>
                    ${ch.i ? '<span class="tag-vip">DRM VIP</span>' : ''}
                </div>`;
            item.onclick = () => play(allChannels.indexOf(ch));
            list.appendChild(item);
        });
    }

    async function play(idx) {
        const ch = allChannels[idx];
        const video = document.getElementById('video');
        const loader = document.getElementById('loader');
        loader.style.display = 'flex';
        
        document.querySelectorAll('.item').forEach(el => el.classList.remove('active'));
        const currentItem = document.querySelectorAll('.item')[idx];
        if(currentItem) currentItem.classList.add('active');

        if (hls) { hls.destroy(); hls = null; }
        await player.unload();

        try {
            if (ch.u.includes('.m3u8') && !ch.i) {
                if (Hls.isSupported()) { hls = new Hls(); hls.loadSource(ch.u); hls.attachMedia(video); }
                else { video.src = ch.u; }
            } else {
                player.configure({ drm: { clearKeys: ch.i ? { [ch.i]: ch.k } : {} } });
                player.getNetworkingEngine().registerRequestFilter((t, r) => { r.headers['User-Agent'] = 'Dalvik/2.1.0'; });
                await player.load(ch.u);
            }
            loader.style.display = 'none';
        } catch (e) { 
            loader.style.display = 'none'; 
            console.error("Lỗi phát:", e);
        }
    }

    init();
</script>
</body>
</html>
