    <style>
        :root { --gold: #ffcc00; --bg: #000; --card: #151515; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #video-box { width: 100%; max-width: 960px; margin: 0 auto; background: #000; aspect-ratio: 16/9; position: sticky; top: 0; z-index: 99; border-bottom: 2px solid var(--gold); }
        video { width: 100%; height: 100%; }
        .tabs { display: flex; overflow-x: auto; background: #111; padding: 10px; gap: 8px; border-bottom: 1px solid #222; scrollbar-width: none; }
        .tabs button { padding: 8px 15px; border: none; border-radius: 20px; background: #222; color: #888; white-space: nowrap; font-size: 11px; font-weight: bold; cursor: pointer; }
        .tabs button.active { background: var(--gold); color: #000; }
        #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding: 15px; overflow-y: auto; flex: 1; }
        .item { background: var(--card); border-radius: 8px; padding: 12px 5px; text-align: center; cursor: pointer; border: 1px solid #222; position: relative; transition: 0.2s; }
        .item.active { border-color: var(--gold); background: #221f00; border-bottom: 3px solid var(--gold); }
        .img-wrap { width: 100%; height: 45px; display: flex; align-items: center; justify-content: center; margin-bottom: 5px; }
        .item img { max-width: 90%; max-height: 100%; object-fit: contain; }
        .item span { font-size: 10px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: bold; color: #ccc; }
        .vip { position: absolute; top: 5px; right: 5px; background: var(--gold); color: #000; font-size: 8px; padding: 1px 4px; border-radius: 2px; font-weight: 900; }
    </style>
</head>

</div>

    <button class="active" onclick="setTab('ALL', this)">TẤT CẢ</button>
    <button onclick="setTab('QUỐC TẾ', this)">QUỐC TẾ VIP</button>
    <button onclick="setTab('VTV', this)">VTV/THIẾT YẾU</button>
    <button onclick="setTab('HTV', this)">HTV/HTVC</button>
</div>

<div id="list"></div>

        { n: "CNN", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/cnn.smil/manifest.mpd", i: "cUzI7QWgOruaxhvUu9HYoA", k: "Gs9Y/41M2HwtPBLSIkjvsQ", l: "https://vnepg.site/logos/156.png", g: "QUỐC TẾ", v: true },
        { n: "BBC NEWS", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/bbcworldnews.smil/manifest.mpd", i: "x7pGCG3aNFqSnim/FV5FnA", k: "03S485kEv1cmieo0euhlkQ", l: "https://vnepg.site/logos/151.png", g: "QUỐC TẾ", v: true },

        { n: "BBC EARTH", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/bbcearth.smil/manifest.mpd", i: "UBSUGixCN5iAte33IwTBZQ", k: "8/oP4805pS9O79Nv9xYeiQ", l: "https://vnepg.site/logos/148.png", g: "QUỐC TẾ", v: true },
        { n: "BBC CBEEBIES", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/cbb.smil/manifest.mpd", i: "zKc6AGtLOaWVIHzrXtnKCg", k: "uDPR9AwmHveIlvl+BvgM3A", l: "https://vnepg.site/logos/150.png", g: "QUỐC TẾ", v: true },
        { n: "BBC LIFESTYLE", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/bbclifestyle.smil/manifest.mpd", i: "WLlJmG7RMpS8AbDzMKvFJw", k: "I+jF8v4gKQasLWVU2VJymQ", l: "https://vnepg.site/logos/149.png", g: "QUỐC TẾ", v: true },
        { n: "FASHION TV", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/ftv.smil/manifest.mpd", i: "wdnyVwECNQi/pnN+OoxwAQ", k: "MMNhPpsG4PfMIBAU8xv12A", l: "https://vnepg.site/logos/165.png", g: "QUỐC TẾ", v: true }
    ];

    function toHex(b64) {
        try {
            const bin = atob(b64.replace(/-/g, '+').replace(/_/g, '/'));
            let res = "";
            for (let i = 0; i < bin.length; i++) {
                let h = bin.charCodeAt(i).toString(16);
                res += (h.length === 1 ? '0' : '') + h;
            }
            return res;
        } catch(e) { return ""; }
    }

    async function start() {
        video = document.getElementById('video');
        shaka.polyfill.installAll();
        if (shaka.Player.isBrowserSupported()) {
            player = new shaka.Player(video);
            player.configure({
                streaming: { bufferingGoal: 10, jumpLargeGaps: true }
            });
            await load();
            render();
            // Tự động phát kênh đầu tiên trong Tab Quốc Tế để kiểm tra
            const firstInt = allData.findIndex(ch => ch.g === "QUỐC TẾ");
            if(firstInt !== -1) play(firstInt);
        }
    }

    async function load() {
        let vnChannels = [];
        try {
            const r = await fetch(GITHUB);
            const txt = await r.text();
            let cur = null;
            txt.split('\n').forEach(line => {
                if (line.includes('#EXTINF')) {
                    const name = line.split(',')[1]?.trim() || "Kênh";
                    const nU = name.toUpperCase();
                    let logoMatch = line.match(/(?:tvg-logo|logo|tvg-logo-url)="([^"]+)"/i);
                    let logo = logoMatch ? logoMatch[1] : "";
                    let g = "ĐỊA PHƯƠNG", vip = false;
                    if (nU.includes("VTVCAB") || nU.includes("ON ")) { g = "VTVCAB"; vip = true; }
                    else if (nU.includes("SCTV")) { g = "SCTV"; vip = true; }
                    else if (nU.includes("HTV")) { g = "HTV"; vip = nU.includes("HTVC"); }
                    else if (nU.includes("VTV")) { g = "VTV"; vip = !["VTV1","VTV2","VTV3"].some(k => nU === k); }
                    cur = { n: name, u: "", l: logo, g: g, v: vip };
                } else if (line.startsWith('http') && cur) {
                    cur.u = line.trim(); vnChannels.push(cur); cur = null;
                }
            });
        } catch(e) {}
        allData = [...FIXED_INT, ...vnChannels];
    }

    async function play(idx) {
        curIdx = idx; render();
        const ch = allData[idx];
        if (ch.i && ch.k) {
            player.configure({ drm: { clearKeys: { [toHex(ch.i)]: toHex(ch.k) } } });
        } else {
            player.configure({ drm: { clearKeys: {} } });
        }
        try {
            await player.load(ch.u);
            video.play();
        } catch (e) {
            if (ch.u.includes('.m3u8')) { video.src = ch.u; video.play(); }
        }
    }

    function render() {
        const box = document.getElementById('list');
        box.innerHTML = "";
        allData.forEach((ch, i) => {
            if (curTab !== 'ALL' && ch.g !== curTab) return;
            const div = document.createElement('div');
            div.className = `item ${curIdx === i ? 'active' : ''}`;
            div.innerHTML = `
                ${ch.v ? '<div class="vip">VIP</div>' : ''}
                <div class="img-wrap"><img src="${ch.l || 'https://via.placeholder.com/100x45/222/555?text=TV'}" onerror="this.src='https://via.placeholder.com/100x45/222/555?text=TV'"></div>
                <span>${ch.n}</span>
            `;
            div.onclick = () => play(i);
            box.appendChild(div);
        });
    }

    function setTab(t, btn) {
        curTab = t;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }
    start();
</script>
</body>
</html>
