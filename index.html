<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV QUỐC TẾ TỔNG LỰC</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.debug.js"></script>
    <style>
        :root { --accent: #ffcc00; --bg: #0a0a0a; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        #player-wrapper { width: 100%; max-width: 1000px; margin: 0 auto; aspect-ratio: 16/9; background: #000; position: relative; }
        video { width: 100%; height: 100%; }
        .search-area { padding: 10px; background: #111; text-align: center; }
        #search { width: 90%; padding: 10px; border-radius: 20px; border: 1px solid #333; background: #222; color: #fff; }
        #grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding: 15px; overflow-y: auto; }
        .card { background: #1a1a1a; border: 1px solid #222; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; position: relative; }
        .card:hover { border-color: var(--accent); }
        .card.active { border-color: var(--accent); background: #2a2500; }
        .card img { width: 100%; height: 40px; object-fit: contain; margin-bottom: 5px; }
        .card .name { font-size: 11px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>

<div id="player-wrapper">
    <video id="video" autoplay controls playsinline></video>
</div>

<div class="search-area">
    <input type="text" id="search" placeholder="Tìm kênh quốc tế..." onkeyup="render()">
</div>

<div id="grid"></div>

<script>
    let shakaPlayer, activeIdx = -1;

    // DỮ LIỆU ĐẦY ĐỦ TỪ HÌNH ẢNH CỦA BẠN
    const FULL_CHANNELS = [
        { n: "HBO HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/hbo.smil/manifest.mpd", i: "09ddfe3d63863cafaeb79d3546b098ab", k: "3de0f38cf014827dfd5bec39743c6a2e", l: "https://vnepg.site/logos/129.png" },
        { n: "AXN HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd", i: "9d29f87efdec3c9fab368f724e62ad0e", k: "4f1c09c035eab36323d60d1454d3b20d", l: "https://vnepg.site/logos/163.png" },
        { n: "CINEMAX HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/max.smil/manifest.mpd", i: "acb4c23471063327adc732e283c0847f", k: "e9868f51473d0fd859ede4de48d531c2", l: "https://vnepg.site/logos/130.png" },
        { n: "CINEMA WORLD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/cinemaworld.smil/manifest.mpd", i: "ee7915564d7439d09bd3556fccc87a4a", k: "b35e12a75a42e5f9184723a90ff42d9c", l: "https://vnepg.site/logos/164.png" },
        { n: "ANIMAL PLANET", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/ap.smil/manifest.mpd", i: "ec6f472c7125377a9bc0ae61598095f4c", k: "1d5388e078141debce364535b5d61d75", l: "https://vnepg.site/logos/143.png" },
        { n: "DREAMWORKS", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/dreamwork.smil/manifest.mpd", i: "67dae20527c63dadaaa6509aa91577cb", k: "59328f621d56767bc5ff9404a8940163", l: "https://vnepg.site/logos/141.png" },
        { n: "CARTOONITO", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/boomerang.smil/manifest.mpd", l: "https://www.diversetechgeek.com/wp-content/uploads/2021/09/cartoonito_logo.jpeg" },
        { n: "BBC CBEEBIES", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/cbb.smil/manifest.mpd", i: "cca73a60b643b3a959207ceb5ed9ca0a", k: "b833d14f0c261ef78896f9720b080cdc", l: "https://vnepg.site/logos/150.png" },
        { n: "WARNER TV", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/wtv.smil/manifest.mpd", i: "086d09a40bff3a00aa6ddddbafbc13b2", k: "34f1908cfade05ee060116d40312cb24", l: "https://vnepg.site/logos/169.png" },
        { n: "DMAX", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/dmax.smil/manifest.mpd", i: "53b26f934ae03a20b56477cfb9c5dca2", k: "0c64ccffb978e739bd33344075492aec", l: "https://106b9c59d.vws.vegacdn.vn/rBN9EfEEFSyoELIQDjEu/1200x1200x0/cmc_new/img.live_channel/0/0/0/0/271.jpg" },
        { n: "CARTOON NETWORK", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/cn.smil/manifest.mpd", i: "3c20166660a93a75ac77db81567389f7", k: "3cc3add43aecce3fe31c9c6a2e5bcc83", l: "https://vnepg.site/logos/140.png" },
        { n: "DISCOVERY ASIA", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/dscasia.smil/manifest.mpd", i: "934907b134be3963a6263a453b98544d", k: "788e2835fb98568aed2f47bbbc491515", l: "https://vnepg.site/logos/145.png" },
        { n: "TLC", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/tlc.smil/manifest.mpd", i: "bf908629732639ada481a6208296d9c", k: "7ca9bfd362377b5e2f16df0b53f274d", l: "https://vnepg.site/logos/168.png" },
        { n: "FASHION TV", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/ftv.smil/manifest.mpd", i: "c1d9f25701023508bfa6737e3a8c7001", k: "3c3613e9b06e0f7cc201014f31bf5df8", l: "https://vnepg.site/logos/165.png" },
        { n: "ABC AUSTRALIA", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/apius.smil/manifest.mpd", i: "9a09a73ec1dc348584e2f130e27da667", k: "06f8d1a6feaffbdab92edf347e7b469c", l: "https://vnepg.site/logos/153.png" },
        { n: "BLOOMBERG", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/bloomberg.smil/manifest.mpd", l: "https://vnepg.site/logos/154.png" },
        { n: "BBC LIFESTYLE", u: "https://s7770.cdn.mytvnet.vn/pkg20/live_dzones/bbclifestyle.smil/manifest.mpd", i: "58b949986ed13294bc01b0f330abc527", k: "23e8c5f2fe2029d3ac2d6554d9527299", l: "https://vnepg.site/logos/149.png" },
        { n: "BBC NEWS", u: "https://s935.cdn.mytvnet.vn/pkg20/live_dzones/bbc.smil/manifest.mpd", i: "c7ba46086dda345a92e29bf155e459c", k: "d374b8f39904bf572689ea347ae86591", l: "https://vnepg.site/logos/151.png" },
        { n: "BBC EARTH", u: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/bbcearth.smil/manifest.mpd", i: "5012521a2c42379880b5ddf72304c165", k: "f3fa0fe3dd39a52f4edfd36df7161e89", l: "https://vnepg.site/logos/148.png" }
    ];

    async function init() {
        shakaPlayer = new shaka.Player(document.getElementById('video'));
        render();
        if(FULL_CHANNELS.length > 0) play(0);
    }

    function render() {
        const grid = document.getElementById('grid');
        const s = document.getElementById('search').value.toLowerCase();
        grid.innerHTML = "";
        FULL_CHANNELS.forEach((ch, idx) => {
            if (!ch.n.toLowerCase().includes(s)) return;
            const div = document.createElement('div');
            div.className = `card ${activeIdx === idx ? 'active' : ''}`;
            div.innerHTML = `<img src="${ch.l}" onerror="this.src='https://via.placeholder.com/100x40/222/555?text=TV'"><div class="name">${ch.n}</div>`;
            div.onclick = () => play(idx);
            grid.appendChild(div);
        });
    }

    async function play(idx) {
        activeIdx = idx;
        const ch = FULL_CHANNELS[idx];
        render();
        try {
            if (ch.i && ch.k) {
                shakaPlayer.configure({ drm: { clearKeys: { [ch.i]: ch.k } } });
                await shakaPlayer.load(ch.u);
            } else {
                await shakaPlayer.unload();
                document.getElementById('video').src = ch.u;
            }
        } catch (e) { console.error("Lỗi phát kênh"); }
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
