<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>IPTV SAMSUNG TV - VIETTEL & TV360</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 300px; background: #111; border-right: 1px solid #333; display: flex; flex-direction: column; transition: 0.3s; }
        .sidebar-hidden #sidebar { margin-left: -300px; }
        .header { padding: 15px; background: #ee0000; text-align: center; font-weight: bold; border-bottom: 2px solid #fff; }
        #channel-list { flex: 1; overflow-y: auto; background: #050505; }
        .channel-item { display: flex; align-items: center; padding: 10px; cursor: pointer; border-bottom: 1px solid #1a1a1a; }
        .channel-item.active { background: #222; border-left: 5px solid #ee0000; }
        .channel-logo { width: 50px; height: 30px; object-fit: contain; margin-right: 12px; background: #fff; border-radius: 2px; }
        #main-player { flex: 1; position: relative; background: #000; }
        video { width: 100%; height: 100%; }
        #osd { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 5px; border-left: 4px solid #ee0000; display: none; z-index: 100; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="header">VIETTEL TV MODE</div>
    <div id="channel-list">Đang kiểm tra luồng...</div>
</div>

<div id="main-player">
    <div id="osd"></div>
    <video id="video" autoplay controls playsinline></video>
</div>

<script>
    const M3U_URL = 'https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/ducnt123?v=' + Date.now();
    let hls;
    let channels = [];
    let currentIndex = 0;
    const video = document.getElementById('video');
    const osd = document.getElementById('osd');

    async function init() {
        try {
            const res = await fetch(M3U_URL);
            const text = await res.text();
            parseM3U(text);
        } catch (e) { console.error("Lỗi nạp danh sách"); }
    }

    function parseM3U(data) {
        const lines = data.split('\n');
        let temp = {}; channels = [];
        lines.forEach(line => {
            if (line.includes('#EXTINF')) {
                temp.name = line.split(',')[1]?.trim() || 'Kênh TV';
                temp.logo = line.match(/tvg-logo="([^"]+)"/i)?.[1] || '';
            } else if (line.startsWith('http')) {
                channels.push({ url: line.trim(), name: temp.name, logo: temp.logo });
                temp = {};
            }
        });
        renderList();
        if (channels.length > 0) playChannel(0);
    }

    function renderList() {
        const list = document.getElementById('channel-list');
        list.innerHTML = channels.map((ch, i) => `
            <div class="channel-item" id="ch-${i}" onclick="playChannel(${i})">
                <img class="channel-logo" src="${ch.logo}" onerror="this.src='https://via.placeholder.com/50x30?text=TV'">
                <span>${ch.name}</span>
            </div>
        `).join('');
    }

    function showOSD(name) {
        osd.innerText = "ĐANG PHÁT: " + name;
        osd.style.display = 'block';
        clearTimeout(window.osdTimer);
        window.osdTimer = setTimeout(() => { osd.style.display = 'none'; }, 3000);
    }

    function playChannel(index) {
        if (index < 0) index = channels.length - 1;
        if (index >= channels.length) index = 0;
        
        currentIndex = index;
        const ch = channels[currentIndex];

        // Highlight kênh đang chọn
        document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
        const activeItem = document.getElementById('ch-' + index);
        activeItem?.classList.add('active');
        activeItem?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        showOSD(ch.name);

        if (hls) hls.destroy();

        let finalUrl = ch.url;

        // TỰ ĐỘNG PHÂN LOẠI SERVER ĐỂ GIẢI MÃ
        if (ch.url.includes('27.67.') || ch.url.includes('dpdns.org')) {
            // Đối với server IP Viettel: Dùng Proxy để vượt rào cản Mixed Content của TV
            finalUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(ch.url);
        } else if (ch.url.includes('tv360.vn')) {
            // Đối với TV360 chính chủ: Để link gốc (vì TV360 có CDN tốt)
            finalUrl = ch.url;
        }

        if (Hls.isSupported()) {
            hls = new Hls({
                enableWorker: true,
                xhrSetup: function(xhr, url) {
                    xhr.withCredentials = false;
                }
            });
            hls.loadSource(finalUrl);
            hls
