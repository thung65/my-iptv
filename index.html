<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV PRO - MULTI PLAYER</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mux.js/6.0.1/mux.min.js"></script>

    <style>
        :root { --gold: #ffcc00; }
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Khu vực hiển thị: Tự động đổi giữa Video và Web trung gian */
        #display-box { width: 100%; aspect-ratio: 16/9; background: #000; border-bottom: 2px solid var(--gold); position: relative; }
        video, iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; }
        .hidden { display: none; }

        .tabs { display: flex; overflow-x: auto; background: #111; padding: 10px; gap: 8px; border-bottom: 1px solid #222; }
        .tabs button { padding: 10px 18px; border: none; background: #222; color: #888; border-radius: 4px; white-space: nowrap; font-weight: bold; cursor: pointer; }
        .tabs button.active { background: var(--gold); color: #000; }

        #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 10px; padding: 15px; overflow-y: auto; flex: 1; }
        .item { background: #151515; border-radius: 8px; padding: 12px 5px; text-align: center; cursor: pointer; border: 1px solid #222; }
        .item.active { border-color: var(--gold); background: #221f00; border-bottom: 4px solid var(--gold); }
        .item img { height: 40px; max-width: 85%; object-fit: contain; margin-bottom: 5px; }
        .item span { display: block; font-size: 11px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>

<div id="display-box">
    <video id="video" controls autoplay playsinline></video>
    <iframe id="web-frame" class="hidden" allowfullscreen></iframe>
</div>

<div class="tabs">
    <button class="active" onclick="changeTab('ALL', this)">TẤT CẢ</button>
    <button onclick="changeTab('VTV', this)">VTV</button>
    <button onclick="changeTab('QUỐC TẾ', this)">QUỐC TẾ</button>
</div>

<div id="list"></div>

<script>
    let video = document.getElementById('video');
    let frame = document.getElementById('web-frame');
    let player, currentTab = 'ALL', currentIndex = 0;

    const CHANNELS = [
        { n: "HBO HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/hbo.smil/manifest.mpd", i: "Cd3+PWOGPK+ut50FRrCYqw", k: "PeDzjc8BSCff1b7Dh0PGog", l: "https://vnepg.site/logos/129.png", g: "QUỐC TẾ" },
        { n: "VTV3 HD", u: "https://live.fptplay53.net/fnxch2/vtv3hd_abr.smil/chunklist_b4200000.m3u8", l: "https://vnepg.site/logos/3.png", g: "VTV" },
        // Kênh dùng web trung gian
        { n: "Hội Quán (Web)", u: "https://ace.hoiquan.click/module/IPTV/?id=youtv&accKenh=madam69", l: "https://via.placeholder.com/50", g: "VTV", type: "web" }
    ];

    function toHex(v) {
        if (!v || v.length === 32) return v;
        try { return Array.from(atob(v.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0).toString(16).padStart(2,'0')).join('').toLowerCase(); } catch(e) { return v; }
    }

    async function init() {
        shaka.polyfill.installAll();
        player = new shaka.Player(video);
        render();
        play(0);
    }

    async function play(idx) {
        currentIndex = idx;
        const ch = CHANNELS[idx];
        render();

        // 1. Dọn dẹp cả hai trình phát
        await player.unload();
        video.src = "";
        frame.src = "";
        
        // 2. Kiểm tra loại kênh
        if (ch.type === "web") {
            // Hiển thị khung Web trung gian
            video.classList.add('hidden');
            frame.classList.remove('hidden');
            frame.src = ch.u;
        } else {
            // Hiển thị trình phát Video
            frame.classList.add('hidden');
            video.classList.remove('hidden');

            if (ch.i && ch.k) {
                player.configure({ drm: { clearKeys: { [toHex(ch.i)]: toHex(ch.k) } } });
                try { await player.load(ch.u); } catch(e) { video.src = ch.u; }
            } else {
                video.src = ch.u;
                video.play().catch(() => {});
            }
        }
    }

    function render() {
        const container = document.getElementById('list');
        container.innerHTML = "";
        CHANNELS.forEach((ch, i) => {
            if (currentTab !== 'ALL' && ch.g !== currentTab) return;
            const item = document.createElement('div');
            item.className = `item ${currentIndex === i ? 'active' : ''}`;
            item.innerHTML = `<img src="${ch.l}" onerror="this.src='https://via.placeholder.com/50'"><span>${ch.n}</span>`;
            item.onclick = () => play(i);
            container.appendChild(item);
        });
    }

    function changeTab(g, btn) {
        currentTab = g;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    init();
</script>
</body>
</html>
