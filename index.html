<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV ULTIMATE - 20 KÊNH QUỐC TẾ & VN</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.debug.js"></script>
    <style>
        :root { --accent: #00ffcc; --bg: #0a0a0a; --panel: #161616; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #video-box { width: 100%; max-width: 1000px; margin: 0 auto; background: #000; aspect-ratio: 16/9; position: relative; border-bottom: 2px solid var(--accent); }
        video { width: 100%; height: 100%; display: block; }
        .controls { padding: 12px; background: #111; display: flex; flex-direction: column; gap: 8px; }
        #search { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #fff; outline: none; box-sizing: border-box; }
        .tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
        .tab { padding: 6px 15px; background: #222; border-radius: 4px; font-size: 12px; cursor: pointer; white-space: nowrap; border: 1px solid #333; transition: 0.3s; }
        .tab.active { background: var(--accent); color: #000; font-weight: bold; border-color: var(--accent); }
        #grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 12px; padding: 12px; overflow-y: auto; }
        .card { background: var(--panel); border: 1px solid #222; border-radius: 8px; padding: 12px 5px; text-align: center; cursor: pointer; position: relative; transition: 0.2s; }
        .card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .card.active { border-color: var(--accent); background: #00221a; }
        .card img { width: 100%; height: 40px; object-fit: contain; margin-bottom: 8px; }
        .card .name { font-size: 10px; font-weight: 600; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
        .vip-tag { position: absolute; top: 5px; right: 5px; background: var(--accent); color: #000; font-size: 7px; font-weight: 900; padding: 1px 4px; border-radius: 3px; }
    </style>
</head>
<body>

<div id="video-box">
    <video id="video" autoplay controls playsinline></video>
</div>

<div class="controls">
    <input type="text" id="search" placeholder="Tìm kiếm kênh (HBO, Discovery, VTV...)" onkeyup="render()">
    <div class="tabs">
        <div class="tab active" onclick="filter('VIP', this)">QUỐC TẾ VIP (20)</div>
        <div class="tab" onclick="filter('VN', this)">VIỆT NAM</div>
        <div class="tab" onclick="filter('ALL', this)">TẤT CẢ</div>
    </div>
</div>

<div id="grid"></div>

    let player, allChannels = [], currentFilter = 'VIP', activeIdx = -1;

        { n: "HBO HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/hbo.smil/manifest.mpd", i: "09ddfe3d63863cafaeb79d3546b098ab", k: "3de0f38cf014827dfd5bec39743c6a2e", l: "https://vnepg.site/logos/129.png", g: "VIP" },
        { n: "AXN HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd", i: "9d29f87efdec3c9fab368f724e62ad0e", k: "4f1c09c035eab36323d60d1454d3b20d", l: "https://vnepg.site/logos/163.png", g: "VIP" },
        { n: "CINEMAX", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/max.smil/manifest.mpd", i: "acb4c23471063327adc732e283c0847f", k: "e9868f51473d0fd859ede4de48d531c2", l: "https://vnepg.site/logos/130.png", g: "VIP" },
        { n: "CINEMA WORLD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/cinemaworld.smil/manifest.mpd", i: "ee7915564d7439d09bd3556fccc87a4a", k: "b35e12a75a42e5f9184723a90ff42d9c", l: "https://vnepg.site/logos/164.png", g: "VIP" },
        { n: "CARTOONITO", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/boomerang.smil/manifest.mpd", i: "b1f0d759e914369db3b8b30c81597156", k: "78d317e17037a8b89d539e452e5b1212", l: "https://www.diversetechgeek.com/wp-content/uploads/2021/09/cartoonito_logo.jpeg", g: "VIP" },
        { n: "CARTOON NETWORK", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/cn.smil/manifest.mpd", i: "3c20166660a93a75ac77db81567389f7", k: "3cc3add43aecce3fe31c9c6a2e5bcc83", l: "https://vnepg.site/logos/140.png", g: "VIP" },
        { n: "DREAMWORKS", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/dreamwork.smil/manifest.mpd", i: "67dae20527c63dadaaa6509aa91577cb", k: "59328f621d56767bc5ff9404a8940163", l: "https://vnepg.site/logos/141.png", g: "VIP" },
        { n: "WARNER TV", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/wtv.smil/manifest.mpd", i: "086d09a40bff3a00aa6ddddbafbc13b2", k: "34f1908cfade05ee060116d40312cb24", l: "https://vnepg.site/logos/169.png", g: "VIP" },
        { n: "BBC CBEEBIES", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/cbb.smil/manifest.mpd", i: "cca73a60b643b3a959207ceb5ed9ca0a", k: "b833d14f0c261ef78896f97e06ff0cdc", l: "https://vnepg.site/logos/150.png", g: "VIP" },
        { n: "BBC EARTH", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/bbcearth.smil/manifest.mpd", i: "5014941a2c42379880b5ddf72304c165", k: "f3fa0fe3dd39a52f4edfd36df7161e89", l: "https://vnepg.site/logos/148.png", g: "VIP" },
        { n: "BBC LIFESTYLE", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/bbclifestyle.smil/manifest.mpd", i: "58b949986ed13294bc01b0f330abc527", k: "23e8c5f2fe2029d3ac2d6554d9527299", l: "https://vnepg.site/logos/149.png", g: "VIP" },
        { n: "BBC NEWS", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/bbc.smil/manifest.mpd", i: "c7ba46086dda345a92e29bf155e459c", k: "d374b8f39904bf572689ea347ae86591", l: "https://vnepg.site/logos/151.png", g: "VIP" },
        { n: "BLOOMBERG", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/bloomberg.smil/manifest.mpd", l: "https://vnepg.site/logos/154.png", g: "VIP" },
        { n: "FASHION TV", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/ftv.smil/manifest.mpd", i: "c1d9f25701023508bfa6737e3a8c7001", k: "3c3613e9b06e0f7cc201014f31bf5df8", l: "https://vnepg.site/logos/165.png", g: "VIP" },
        { n: "ABC AUSTRALIA", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/apius.smil/manifest.mpd", i: "9a09a73ec1dc348584e2f130e27da667", k: "06f8d1a6feaffbdab92edf347e7b469c", l: "https://vnepg.site/logos/153.png", g: "VIP" }
    ];

    async function init() {
        shakaPlayer = new shaka.Player(document.getElementById('video'));
        allChannels = [...VIP_DATA];
        await fetchVN();
        render();
        if(allChannels.length > 0) play(0);
    }

    async function fetchVN() {
        try {
            const res = await fetch(GITHUB_SOURCE);
            const text = await res.text();
            let cur = null;
            text.split('\n').forEach(line => {
                if (line.includes('#EXTINF')) {
                    cur = { n: line.split(',').pop().trim(), l: line.match(/tvg-logo="([^"]+)"/)?.[1] || "", u: "", g: "VN" };
                } else if (line.startsWith('http') && cur) {
                    cur.u = line.trim(); allChannels.push(cur); cur = null;
                }
            });
        } catch(e) {}
    }

    function render() {
        const grid = document.getElementById('grid');
        const s = document.getElementById('search').value.toLowerCase();
        grid.innerHTML = "";
        allChannels.forEach((ch, idx) => {
            if (currentFilter !== 'ALL' && ch.g !== currentFilter) return;
            if (!ch.n.toLowerCase().includes(s)) return;
            const div = document.createElement('div');
            div.className = `card ${activeIdx === idx ? 'active' : ''}`;
            div.innerHTML = `${ch.i ? '<div class="vip-tag">VIP</div>' : ''}<img src="${ch.l}" onerror="this.src='https://via.placeholder.com/100x40/222/555?text=TV'"><div class="name">${ch.n}</div>`;
            div.onclick = () => play(idx);
            grid.appendChild(div);
        });
    }

    async function play(idx) {
        activeIdx = idx;
        const ch = allChannels[idx];
        render();
        try {
            if (ch.i && ch.k) {
                shakaPlayer.configure({ drm: { clearKeys: { [ch.i]: ch.k } } });
                await shakaPlayer.load(ch.u);
            } else {
                await shakaPlayer.unload();
                document.getElementById('video').src = ch.u;
            }
        } catch (e) { console.error("Lỗi phát luồng"); }
    }

    function filter(group, el) {
        currentFilter = group;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        render();
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
