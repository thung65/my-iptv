    <style>
        :root { --accent: #00ff42; --bg: #000; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 350px; background: #111; border-right: 1px solid #333; display: flex; flex-direction: column; }
        .header { padding: 15px; background: #1a1a1a; border-bottom: 2px solid var(--accent); text-align: center; font-weight: bold; color: var(--accent); }
        #list { flex: 1; overflow-y: auto; scrollbar-width: thin; }
        .g-title { background: #222; padding: 10px; font-size: 11px; color: #aaa; text-transform: uppercase; position: sticky; top: 0; z-index: 10; }
        .item { padding: 12px; cursor: pointer; border-bottom: 1px solid #1a1a1a; display: flex; align-items: center; font-size: 13px; }
        .item:hover { background: #252525; }
        .item.active { background: #102a16; color: var(--accent); border-left: 4px solid var(--accent); }
        .logo { width: 60px; height: 40px; object-fit: contain; margin-right: 12px; background: #111; border-radius: 4px; border: 1px solid #333; }
        #main { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; }
        .tag-vip { font-size: 9px; padding: 1px 4px; background: var(--accent); color: #000; border-radius: 2px; margin-left: auto; font-weight: bold; }
    </style>
</head>

        { n: "CARTOONNITO", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/boomerang.smil/manifest.mpd", i: "sfDXWekUNp2ziLOw3IFZcQ", k: "VnjTF-FwB6iKm5U55FJlEg", l: "https://www.diversetechgeek.com/wp-content/uploads/2021/09/cartoonito_logo.jpeg" },
        { n: "BBC EARTH HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/bbcearth.smil/manifest.mpd", i: "UBSUGixCN5iAte33IwTBZQ", k: "8/oP4805pS9O79Nv9xYeiQ", l: "https://vnepg.site/logos/148.png" },
        { n: "BBC CBEEBIES HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/cbb.smil/manifest.mpd", i: "zKc6AGtLOaWVIHzrXtnKCg", k: "uDPR9AwmHveIlvl+BvgM3A", l: "https://vnepg.site/logos/150.png" },
        { n: "BBC LIFESTYLE HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/bbclifestyle.smil/manifest.mpd", i: "WLlJmG7RMpS8AbDzMKvFJw", k: "I+jF8v4gKQasLWVU2VJymQ", l: "https://vnepg.site/logos/149.png" },
        { n: "BBC NEWS", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/bbcworldnews.smil/manifest.mpd", i: "x7pGCG3aNFqSnim/FV5FnA", k: "03S485kEv1cmieo0euhlkQ", l: "https://vnepg.site/logos/151.png" },
        { n: "WBTV HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/wtv.smil/manifest.mpd", i: "CG0JpAv/OgCqbdTbr5wTsg", k: "NPGQjP4uBe4GAEbUDxSuyQ", l: "https://vnepg.site/logos/169.png" },
        { n: "BLOOMBERG TV ASIA", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/bloomberg.smil/manifest.mpd", i: "EHE5P4/CN/OpooAoFCEQ9w", k: "eg+MPHLg//+BHVNMkpxXwg", l: "https://vnepg.site/logos/154.png" },
        { n: "DREAMWORKS HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/dreamwork.smil/manifest.mpd", i: "Z9riBSfGPa2qrmCaqRV3yw", k: "WTKPYh1WdnvF/5QEqJQGgw", l: "https://vnepg.site/logos/141.png" },
        { n: "FASHION TV", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/ftv.smil/manifest.mpd", i: "wdnyVwECNQi/pnN+OoxwAQ", k: "MMNhPpsG4PfMIBAU8xv12A", l: "https://vnepg.site/logos/165.png" },
        { n: "ABC AUSTRALIA HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/aplus.smil/manifest.mpd", i: "mgmnPsHcNIWE4vEw4n2mZw", k: "BvjRpv6v+9q5Kt80fntGnA", l: "https://vnepg.site/logos/153.png" }
    ];

    const GITHUB_URL = "https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/ducnt123";
    let allChannels = [];
    let player, hlsPlayer, currentIdx = 0;

    function toUint8Array(base64) {
        const binary = atob(base64.replace(/-/g, '+').replace(/_/g, '/'));
        return new Uint8Array(binary.length).map((_, i) => binary.charCodeAt(i));
    }

    async function init() {
        shaka.polyfill.installAll();
        player = new shaka.Player(document.getElementById('video'));
        
        // Nhóm VIP
        VIP_CHANNELS.forEach(c => allChannels.push({...c, g: "QUỐC TẾ GIẢI MÃ VIP"}));
        
        await fetchAndProcessList();
        render();
        play(0);
    }

    async function fetchAndProcessList() {
        try {
            const res = await fetch(GITHUB_URL);
            const data = await res.text();
            const lines = data.split('\n');
            let tempSCTV = [];
            let tempOthers = [];
            let cur = null;

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF')) {
                    const name = line.split(',')[1]?.trim();
                    const group = line.match(/group-title="([^"]+)"/);
                    const logo = line.match(/tvg-logo="([^"]+)"/);
                    cur = { n: name, g: group ? group[1] : "KHÁC", l: logo ? logo[1] : "" };
                } else if (line.startsWith('http') && cur) {
                    cur.u = line;
                    if (cur.n.toUpperCase().includes("SCTV")) {
                        cur.g = "SCTV";
                        tempSCTV.push(cur);
                    } else if (!VIP_CHANNELS.some(v => v.n === cur.n)) {
                        tempOthers.push(cur);
                    }
                    cur = null;
                }
            });

            tempSCTV.sort((a, b) => {
                const numA = parseInt(a.n.replace(/\D/g, '')) || 0;
                const numB = parseInt(b.n.replace(/\D/g, '')) || 0;
                return numA - numB;
            });

            allChannels = [...allChannels, ...tempSCTV, ...tempOthers];
        } catch (e) { console.error(e); }
    }

    function render() {
        const list = document.getElementById('list');
        list.innerHTML = ""; let lastG = "";
        allChannels.forEach((ch, idx) => {
            if (ch.g !== lastG) {
                const gt = document.createElement('div'); gt.className = 'g-title';
                gt.innerText = ch.g; list.appendChild(gt); lastG = ch.g;
            }
            const item = document.createElement('div');
            item.className = 'item' + (currentIdx === idx ? ' active' : '');
            item.innerHTML = `
                <img class="logo" src="${ch.l}" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='https://via.placeholder.com/60x40/222/fff?text=TV';">
                <span>${ch.n}</span>
                ${ch.i ? '<span class="tag-vip">VIP</span>' : ''}
            `;
            item.onclick = () => play(idx);
            list.appendChild(item);
        });
    }

    async function play(idx) {
        currentIdx = idx; render();
        const ch = allChannels[idx];
        const video = document.getElementById('video');

        // Reset cả hai trình phát trước khi đổi kênh
        if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
        await player.unload();

        try {
            // Trường hợp 1: DASH (Dùng Shaka)
            if (ch.u.includes('.mpd')) {
                if (ch.i) {
                    const kid = toUint8Array(ch.i), key = toUint8Array(ch.k);
                    player.configure({ 
                        drm: { clearKeys: { [shaka.util.Uint8ArrayUtils.toHex(kid)]: shaka.util.Uint8ArrayUtils.toHex(key) } } 
                    });
                } else {
                    player.configure({ drm: { clearKeys: {} } });
                }
                await player.load(ch.u);
            } 
            // Trường hợp 2: HLS (Dùng Hls.js)
            else if (ch.u.includes('.m3u8') || !ch.i) {
                if (Hls.isSupported()) {
                    hlsPlayer = new Hls();
                    hlsPlayer.loadSource(ch.u);
                    hlsPlayer.attachMedia(video);
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = ch.u;
                }
            }
        } catch (e) { console.error("Lỗi phát kênh:", e); }
    }
    init();
</script>
</body>
</html>
