    <style>
        :root { --gold: #ffcc00; --bg: #000; --sidebar-bg: rgba(20, 20, 20, 0.98); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* THANH ĐIỀU KHIỂN TRÊN CÙNG - GOM TẤT CẢ NÚT */
        #top-bar {
            position: fixed; top: 0; left: 0; width: 100%; height: 85px;
            background: rgba(0, 0, 0, 0.9); display: flex; align-items: center;
            padding: 0 15px; gap: 10px; z-index: 10001; border-bottom: 3px solid #333;
        }

        #menu-toggle {
            width: 65px; height: 65px; background: var(--gold); border: none; border-radius: 12px;
            cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
        }
        .bar { width: 32px; height: 5px; background: #000; border-radius: 2px; }

        .btn-top {
            height: 65px; padding: 0 25px; font-size: 22px; font-weight: bold;
            color: white; border: 4px solid #fff; border-radius: 12px; cursor: pointer;
            display: flex; align-items: center;
        }
        .btn-prev { background: #d9534f; }
        .btn-next { background: #5cb85c; }

        /* SIDEBAR */
        #sidebar { 
            position: fixed; left: -350px; top: 0; width: 340px; height: 100%; 
            background: var(--sidebar-bg); z-index: 10002; transition: 0.4s;
            border-right: 3px solid var(--gold); display: flex; flex-direction: column;
        }
        #sidebar.open { left: 0; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 10001; }

        /* VIDEO */
        #main-view { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; padding-top: 85px; position: relative; }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* LIST KÊNH */
        .tabs-header { display: grid; grid-template-columns: 1fr 1fr; background: #111; }
        .tabs-header button { padding: 15px; background: #1a1a1a; color: #fff; border: 1px solid #333; font-weight: bold; }
        .tabs-header button.active { background: var(--gold); color: #000; }
        #channel-list { flex: 1; overflow-y: auto; padding: 10px; }
        .item { display: flex; align-items: center; padding: 12px; background: #222; margin-bottom: 8px; border-radius: 8px; border: 2px solid transparent; }
        .item.active { border-color: var(--gold); background: #333; }
        .item img { width: 75px; height: 42px; object-fit: contain; background: #fff; margin-right: 15px; border-radius: 4px; }

        #osd { position: absolute; top: 100px; left: 20px; background: rgba(0,0,0,0.85); padding: 15px; border-left: 8px solid var(--gold); display: none; z-index: 100; pointer-events: none; }
    </style>
</head>

<div id="top-bar">
    <button id="menu-toggle" onclick="toggleMenu()"><div class="bar"></div><div class="bar"></div><div class="bar"></div></button>

</div>

<div id="overlay" onclick="toggleMenu()"></div>

        { n: "DREAMWORKS", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/dreamwork.smil/manifest.mpd", i: "Z9riBSfGPa2qrmCaqRV3yw", k: "WTKPYh1WdnvF/5QEqJQGgw", l: "https://vnepg.site/logos/141.png", g: "QUỐC TẾ" },
        { n: "BBC EARTH", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/bbcearth.smil/manifest.mpd", i: "UBSUGixCN5iAte33IwTBZQ", k: "8/oP4805pS9O79Nv9xYeiQ", l: "https://vnepg.site/logos/148.png", g: "QUỐC TẾ" },
        { n: "BBC CBEEBIES", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/cbb.smil/manifest.mpd", i: "zKc6AGtLOaWVIHzrXtnKCg", k: "uDPR9AwmHveIlvl+BvgM3A", l: "https://vnepg.site/logos/150.png", g: "QUỐC TẾ" },
        { n: "BBC LIFESTYLE", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/bbclifestyle.smil/manifest.mpd", i: "WLlJmG7RMpS8AbDzMKvFJw", k: "I+jF8v4gKQasLWVU2VJymQ", l: "https://vnepg.site/logos/149.png", g: "QUỐC TẾ" },
        { n: "FASHION TV", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/ftv.smil/manifest.mpd", i: "wdnyVwECNQi/pnN+OoxwAQ", k: "MMNhPpsG4PfMIBAU8xv12A", l: "https://vnepg.site/logos/165.png", g: "QUỐC TẾ" }
    ];

    let player, video = document.getElementById('video'), allChannels = [], currentIdx = 0, curTab = "ALL";
    const GROUP_ORDER = ["ALL", "VTV", "THIẾT YẾU", "VTVCAB", "HTV", "SCTV", "ĐỊA PHƯƠNG", "INTERNATIONAL"];

    function toggleMenu() {
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('overlay');
        const isOpen = sb.classList.toggle('open');
        ov.style.display = isOpen ? 'block' : 'none';
    }

    async function init() {
        shaka.polyfill.installAll();
        player = new shaka.Player(video);
        
        const tabsBox = document.getElementById('tabs-box');
        GROUP_ORDER.forEach(g => {
            const btn = document.createElement('button');
            btn.innerText = (g === "ALL") ? "TẤT CẢ" : g;
            if(g === "ALL") btn.className = "active";
            btn.onclick = () => {
                curTab = g;
                document.querySelectorAll('.tabs-header button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderList();
            };
            tabsBox.appendChild(btn);
        });

        try {
            const res = await fetch(GITHUB_URL);
            const text = await res.text();
            let ext = [], temp = null;
            text.split('\n').forEach(l => {
                l = l.trim();
                if (l.startsWith('#EXTINF')) {
                    const n = l.split(',')[1] || "";
                    let g = n.includes("SCTV") ? "SCTV" : "ĐỊA PHƯƠNG";
                    temp = { n, u: "", l: l.match(/tvg-logo="([^"]+)"/i)?.[1] || "", g };
                } else if (l.startsWith('http') && temp) {
                    temp.u = l; ext.push(temp); temp = null;
                }
            });
            allChannels = [...FIXED_CHANNELS, ...ext];
        } catch(e) { allChannels = FIXED_CHANNELS; }
        
        renderList();
        if(allChannels.length > 0) playChannel(0);
    }

    async function playChannel(idx) {
        if (idx < 0) idx = allChannels.length - 1;
        if (idx >= allChannels.length) idx = 0;
        currentIdx = idx;
        const ch = allChannels[currentIdx];

        document.getElementById('osd-name').innerText = ch.n;
        document.getElementById('osd-group').innerText = ch.g;
        document.getElementById('osd').style.display = 'block';
        clearTimeout(window.osdHide);
        window.osdHide = setTimeout(() => document.getElementById('osd').style.display = 'none', 3000);

        let streamUrl = ch.u;
        // Xử lý link HTTP bằng Proxy
        if (streamUrl.startsWith("http://")) {
            streamUrl = PROXY + encodeURIComponent(streamUrl);
        }

        try {
            await player.unload();
            if (ch.i && ch.k) {
                let drm = {};
                drm[Array.from(atob(ch.i.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0).toString(16).padStart(2, '0')).join('')] = 
                Array.from(atob(ch.k.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0).toString(16).padStart(2, '0')).join('');
                player.configure({ drm: { clearKeys: drm } });
            } else {
                player.configure({ drm: { clearKeys: {} } });
            }
            await player.load(streamUrl);
        } catch (e) { video.src = streamUrl; }
        
        video.play().catch(() => {});
        if (document.getElementById('sidebar').classList.contains('open')) toggleMenu();
    }

    function changeChannel(step) { playChannel(currentIdx + step); }

    function renderList() {
        const list = document.getElementById('channel-list');
        list.innerHTML = "";
        allChannels.forEach((ch, index) => {
            if (curTab !== 'ALL' && ch.g !== curTab) return;
            const div = document.createElement('div');
            div.className = `item ${index === currentIdx ? 'active' : ''}`;
            div.innerHTML = `<img src="${ch.l}" onerror="this.src='https://via.placeholder.com/80x45'"><span>${ch.n}</span>`;
            div.onclick = () => playChannel(index);
            list.appendChild(div);
        });
    }

    init();
</script>
</body>
</html>
