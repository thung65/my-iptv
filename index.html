    <style>

        #sidebar { width: 320px; background: #111; border-right: 1px solid #333; display: flex; flex-direction: column; }
        .header { padding: 15px; background: #1a1a1a; border-bottom: 2px solid var(--accent); text-align: center; font-weight: bold; color: var(--accent); }
        #list { flex: 1; overflow-y: auto; }
        .item { padding: 12px; cursor: pointer; border-bottom: 1px solid #222; display: flex; align-items: center; font-size: 13px; }
        .item:hover { background: #222; }
        .item.active { background: #102a16; color: var(--accent); border-left: 4px solid var(--accent); }
        .logo { width: 45px; height: 30px; object-fit: contain; margin-right: 12px; background: #000; border-radius: 4px; }
        #main { flex: 1; position: relative; }
        video { width: 100%; height: 100%; }
    </style>
</head>

        { n: "ABC AUSTRALIA HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/aplus.smil/manifest.mpd", i: "mgmnPsHcNIWE4vEw4n2mZw", k: "BvjRpv6v+9q5Kt80fntGnA", l: "https://vnepg.site/logos/153.png" }
    ];

    let player, currentIdx = 0;

    // HÀM CHUYỂN ĐỔI CHUẨN SANG BYTE ĐỂ GIẢI MÃ TUYỆT ĐỐI
    function toUint8Array(base64) {
        const binary = atob(base64.replace(/-/g, '+').replace(/_/g, '/'));
        return new Uint8Array(binary.length).map((_, i) => binary.charCodeAt(i));
    }

    async function init() {
        shaka.polyfill.installAll();
        player = new shaka.Player(document.getElementById('video'));
        
        player.getNetworkingEngine().registerRequestFilter((type, request) => {
            request.headers['User-Agent'] = 'Dalvik/2.1.0 (Linux; U; Android 12; Pixel 6 Build/SD1A.210817.036)';
        });

        render();
        play(0);
    }

    function render() {
        const list = document.getElementById('list');
        list.innerHTML = "";
        CHANNELS.forEach((ch, idx) => {
            const div = document.createElement('div');
            div.className = 'item' + (currentIdx === idx ? ' active' : '');
            div.innerHTML = `<img class="logo" src="${ch.l}"><span>${ch.n}</span>`;
            div.onclick = () => play(idx);
            list.appendChild(div);
        });
    }

    async function play(idx) {
        currentIdx = idx; render();
        const ch = CHANNELS[idx];
        try {
            await player.unload();
            // CẤU HÌNH GIẢI MÃ MẠNH NHẤT
            const kid = toUint8Array(ch.i);
            const key = toUint8Array(ch.k);
            
            player.configure({
                drm: {
                    clearKeys: { [shaka.util.Uint8ArrayUtils.toHex(kid)]: shaka.util.Uint8ArrayUtils.toHex(key) }
                }
            });
            await player.load(ch.u);
        } catch (e) { console.error("Lỗi:", e); }
    }
    init();
</script>
</body>
</html>
