<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro IPTV Player</title>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
    <style>
        body { background: #050505; color: white; font-family: sans-serif; margin: 0; }
        #video-wrapper { position: sticky; top: 0; background: #000; width: 100%; aspect-ratio: 16/9; z-index: 10; }
        video { width: 100%; height: 100%; }
        .controls { padding: 15px; }
        .btn-add { background: #222; border: 1px dashed #555; padding: 15px; width: 100%; color: #00ff00; border-radius: 8px; cursor: pointer; }
        
        /* Danh sách kênh */
        .section-label { background: #111; padding: 5px 15px; font-size: 12px; color: #888; margin-top: 10px; }
        .channel-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #1a1a1a; cursor: pointer; }
        .channel-item:active { background: #222; }
        .channel-no { width: 30px; color: #00ff00; font-weight: bold; }
        
        /* Modal */
        #modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a1a; padding: 20px; border-radius: 12px; width: 80%; z-index: 20; border: 1px solid #333; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #222; border: 1px solid #444; color: white; box-sizing: border-box; border-radius: 5px; }
        .btn-go { background: #00ff00; color: black; border: none; padding: 10px; width: 100%; font-weight: bold; margin-top: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<div id="video-wrapper">
    <video id="videoElement" controls autoplay></video>
</div>

<div class="controls">
    <button class="btn-add" onclick="toggleModal(true)">+ THÊM DANH SÁCH PHÁT</button>
</div>

<div id="all-section">
    <div class="section-label">TẤT CẢ (ALL)</div>
    <div id="list-all"></div>
</div>

<div id="intl-section">
    <div class="section-label">QUỐC TẾ (INTERNATIONAL)</div>
    <div id="list-intl"></div>
</div>

<div id="modal">
    <h4 style="margin:0">Nhập nguồn IPTV</h4>
    <input type="text" id="m3u-url" placeholder="Link .m3u từ GitHub..." value="https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/fpt">
    <input type="text" id="m3u-name" placeholder="Tên danh sách">
    <button class="btn-go" onclick="processList()">THỰC HIỆN</button>
    <button onclick="toggleModal(false)" style="background:none; border:none; color:white; width:100%; margin-top:10px; font-size:12px;">Đóng</button>
</div>

<script>
    let player = null;

    function toggleModal(show) { document.getElementById('modal').style.display = show ? 'block' : 'none'; }

    async function processList() {
        const url = document.getElementById('m3u-url').value;
        if(!url) return;
        toggleModal(false);

        const res = await fetch(url);
        const data = await res.text();
        
        const lines = data.split('\n');
        const listAll = document.getElementById('list-all');
        const listIntl = document.getElementById('list-intl');
        listAll.innerHTML = ""; listIntl.innerHTML = "";

        let currentName = "";
        lines.forEach((line, index) => {
            if(line.includes('#EXTINF:')) {
                currentName = line.split(',').pop();
            } else if(line.startsWith('http')) {
                const isIntl = line.toLowerCase().includes('intl') || currentName.toLowerCase().includes('intl');
                createItem(currentName, line.trim(), isIntl ? listIntl : listAll);
            }
        });
    }

    function createItem(name, url, container) {
        const div = document.createElement('div');
        div.className = 'channel-item';
        div.innerHTML = `<div class="channel-no">▶</div> <div>${name}</div>`;
        div.onclick = () => playStream(url);
        container.appendChild(div);
    }

    function playStream(url) {
        const videoElement = document.getElementById('videoElement');
        
        // Hủy player cũ nếu đang chạy
        if (player) {
            player.unload();
            player.detachMediaElement();
            player.destroy();
            player = null;
        }

        // Khởi tạo mpegts.js - Chuyên trị luồng HTTP/UDP từ LAN
        if (mpegts.getFeatureList().mseLivePlayback) {
            player = mpegts.createPlayer({
                type: 'mse', // Hoặc 'mpegts'
                isLive: true,
                url: url
            });
            player.attachMediaElement(videoElement);
            player.load();
            player.play();
        }
    }
</script>
</body>
</html>
