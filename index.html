<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV VIP PRO - TÁCH BIỆT MPD & M3U8</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        :root { --gold: #ffcc00; --bg: #000; --card: #111; --gray: #444; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .navbar { background: #151515; padding: 12px; text-align: center; border-bottom: 2px solid var(--gold); color: var(--gold); font-weight: bold; }
        #video-container { width: 100%; max-width: 960px; margin: 0 auto; background: #000; }
        .video-js { width: 100%; aspect-ratio: 16/9; }
        .search-box { padding: 10px; background: #0a0a0a; display: flex; justify-content: center; }
        #search-input { width: 90%; padding: 10px 20px; background: #1a1a1a; border: 1px solid #333; border-radius: 25px; color: #fff; outline: none; }
        .category-bar { display: flex; overflow-x: auto; gap: 8px; padding: 10px; background: #0a0a0a; border-bottom: 1px solid #222; scrollbar-width: none; }
        .tab-btn { padding: 8px 15px; background: #222; border: 1px solid #333; color: #888; cursor: pointer; border-radius: 20px; font-size: 11px; white-space: nowrap; font-weight: bold; }
        .tab-btn.active { background: var(--gold); color: #000; }
        #channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; padding: 15px; overflow-y: auto; flex: 1; }
        .card { background: var(--card); border: 1px solid #222; border-radius: 8px; padding: 15px 5px; text-align: center; cursor: pointer; position: relative; }
        .card.active { border-color: var(--gold); background: #1a1700; }
        .card img { width: 100%; height: 40px; object-fit: contain; margin-bottom: 5px; }
        .card .name { font-size: 11px; font-weight: 600; color: #ccc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        /* NGÔI SAO YÊU CẦU */
        .star-btn { position: absolute; top: 5px; left: 8px; font-size: 20px; color: var(--gray); transition: 0.3s; z-index: 10; }
        .star-btn.is-fav { color: var(--gold); text-shadow: 0 0 8px rgba(255, 204, 0, 0.6); }
    </style>
</head>
<body>

<div class="navbar">TV VIP PRO - FULL QUỐC TẾ</div>
<div id="video-container"><video id="main-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" playsinline></video></div>
<div class="search-box"><input type="text" id="search-input" placeholder="Tìm kênh nhanh..." onkeyup="renderGrid()"></div>
<div class="category-bar">
    <button class="tab-btn active" onclick="filter('ALL', this)">TẤT CẢ</button>
    <button class="tab-btn" style="color:var(--gold)" onclick="filter('FAV', this)">★ YÊU THÍCH</button>
    <button class="tab-btn" onclick="filter('QUỐC TẾ', this)">QUỐC TẾ VIP</button>
    <button class="tab-btn" onclick="filter('VTV', this)">VTV</button>
</div>
<div id="channel-grid"></div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-contrib-eme@5.0.1/dist/videojs-contrib-eme.min.js"></script>
<script>
    const GITHUB_URL = "https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/ducnt123";
    let player, allChannels = [], favorites = JSON.parse(localStorage.getItem('stars_db')) || [], currentFilter = 'ALL', activeIdx = 0;

    const DRM_LIST = [
        { n: "HBO HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/hbo.smil/manifest.mpd", i: "Cd3+PWOGPK+ut50FRrCYqw", k: "PeDzjc8BSCff1b7Dh0PGog", l: "https://vnepg.site/logos/129.png", g: "QUỐC TẾ" },
        { n: "AXN HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd", i: "nSn4fv3sPJ+rNo9ySmKtDg", k: "bxwJwDXqs2Mj1g0UVNs9IA", l: "https://vnepg.site/logos/163.png", g: "QUỐC TẾ" },
        { n: "CINEMAX HD", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/max.smil/manifest.mpd", i: "rLTCNHEGMyetxzLig8CEfw", k: "6YaPX0c9D9hpnt5I1THCsA", l: "https://vnepg.site/logos/130.png", g: "QUỐC TẾ" },
        { n: "DISCOVERY HD", u: "https://s7770.cdn.mytvnet.vn/pkg20/live_dzones/dsc.smil/manifest.mpd", i: "60Fg6lU6Mh2JlVPk55b+wg", k: "vqWgcVfgxNF7Eas5lRf5Ug", l: "https://vnepg.site/logos/144.png", g: "QUỐC TẾ" }
        // ... Thêm tiếp các kênh quốc tế khác ở đây
    ];

    function b64ToHex(b) { try { let bin = atob(b.replace(/-/g, '+').replace(/_/g, '/')), res = ""; for (let i = 0; i < bin.length; i++) res += bin.charCodeAt(i).toString(16).padStart(2, '0'); return res; } catch (e) { return ""; } }

    async function init() {
        player = videojs('main-player', { autoplay: true, fluid: true, html5: { vhs: { overrideNative: true } } });
        if (player.eme) player.eme();
        allChannels = [...DRM_LIST];
        await loadGh();
        renderGrid();
        if(allChannels.length > 0) play(0);
    }

    async function loadGh() {
        try {
            const res = await fetch(GITHUB_URL);
            const text = await res.text();
            let cur = null;
            text.split('\n').forEach(line => {
                if (line.startsWith('#EXTINF')) {
                    const name = line.split(',')[1]?.trim();
                    const logo = line.match(/tvg-logo="([^"]+)"/)?.[1] || "";
                    cur = { n: name, l: logo, u: "", g: name.includes("VTV") ? "VTV" : "ĐỊA PHƯƠNG" };
                } else if (line.startsWith('http') && cur) { cur.u = line.trim(); allChannels.push(cur); cur = null; }
            });
        } catch (e) {}
    }

    function toggleStar(e, name) {
        e.stopPropagation();
        if (favorites.includes(name)) favorites = favorites.filter(f => f !== name);
        else favorites.push(name);
        localStorage.setItem('stars_db', JSON.stringify(favorites));
        renderGrid();
    }

    function renderGrid() {
        const grid = document.getElementById('channel-grid'), q = document.getElementById('search-input').value.toLowerCase();
        grid.innerHTML = "";
        allChannels.forEach((ch, idx) => {
            const isFav = favorites.includes(ch.n);
            if (ch.n.toLowerCase().includes(q) && (currentFilter === 'ALL' || (currentFilter === 'FAV' && isFav) || ch.g === currentFilter)) {
                const div = document.createElement('div');
                div.className = 'card' + (activeIdx === idx ? ' active' : '');
                div.innerHTML = `<span class="star-btn ${isFav ? 'is-fav' : ''}" onclick="toggleStar(event, '${ch.n}')">★</span><img src="${ch.l}" onerror="this.src='https://via.placeholder.com/100x40/222/555?text=TV'"><div class="name">${ch.n}</div>`;
                div.onclick = () => play(idx);
                grid.appendChild(div);
            }
        });
    }

    // TÁCH BIỆT XỬ LÝ THEO ĐỊNH DẠNG
    function play(idx) {
        activeIdx = idx; renderGrid();
        const ch = allChannels[idx];
        let sourceConfig = {};

        if (ch.u.includes('.mpd')) {
            // PHÁP CHO MPD (DASH)
            sourceConfig = { 
                src: ch.u, 
                type: 'application/dash+xml',
                keySystems: { 
                    'org.w3.clearkey': { clearkeys: { [b64ToHex(ch.i)]: b64ToHex(ch.k) } } 
                }
            };
        } else {
            // PHÁP CHO M3U8 (HLS)
            sourceConfig = { 
                src: ch.u, 
                type: 'application/x-mpegURL'
                // Tuyệt đối không để keySystems ở đây
            };
        }

        player.src(sourceConfig);
        player.load();
        player.play().catch(()=>{});
    }

    function filter(g, btn) {
        currentFilter = g;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGrid();
    }
    window.onload = init;
</script>
</body>
</html>
