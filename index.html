<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV SMART - CLEAN & ORGANIZED</title>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mux.js/6.0.1/mux.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>

    <style>
        :root { --gold: #ffcc00; --bg: #000; --card: #151515; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Player Box */
        #video-box { width: 100%; max-width: 960px; margin: 0 auto; background: #000; aspect-ratio: 16/9; position: sticky; top: 0; z-index: 99; border-bottom: 2px solid var(--gold); }
        video { width: 100%; height: 100%; }

        /* Tabs phân loại - Giúp không bị lẫn kênh */
        .tabs { display: flex; overflow-x: auto; background: #111; padding: 10px; gap: 8px; border-bottom: 1px solid #222; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tabs button { padding: 8px 16px; border: none; border-radius: 4px; background: #222; color: #888; white-space: nowrap; font-size: 11px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .tabs button.active { background: var(--gold); color: #000; }

        /* Danh sách kênh */
        #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding: 15px; overflow-y: auto; flex: 1; }
        .item { background: var(--card); border-radius: 8px; padding: 12px 5px; text-align: center; cursor: pointer; border: 1px solid #222; position: relative; transition: 0.2s; }
        .item.active { border-color: var(--gold); background: #221f00; border-bottom: 3px solid var(--gold); }
        
        .img-wrap { width: 100%; height: 45px; display: flex; align-items: center; justify-content: center; margin-bottom: 5px; overflow: hidden; }
        .item img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .item span { font-size: 10px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: bold; color: #ccc; text-transform: uppercase; }
    </style>
</head>
<body>

<div id="video-box"><video id="video" controls autoplay playsinline></video></div>

<div class="tabs" id="tab-bar">
    <button class="active" onclick="setTab('QUỐC TẾ', this)">QUỐC TẾ</button>
    <button onclick="setTab('VTV', this)">VTV</button>
    <button onclick="setTab('HTV', this)">HTV/HTVC</button>
    <button onclick="setTab('SCTV', this)">SCTV</button>
    <button onclick="setTab('VTVCAB', this)">VTVCAB</button>
    <button onclick="setTab('ĐỊA PHƯƠNG', this)">ĐỊA PHƯƠNG</button>
    <button onclick="setTab('ALL', this)">TẤT CẢ</button>
</div>

<div id="list"></div>

<script>
    const GITHUB = "https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/ducnt123";
    let video, player, allData = [], curTab = "QUỐC TẾ", curIdx = 0;

    // Danh sách Quốc Tế chuẩn (Đã xóa HD/VIP trong tên hiển thị)
    const FIXED_INT = [
        { n: "HBO", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/hbo.smil/manifest.mpd", i: "Cd3+PWOGPK+ut50FRrCYqw", k: "PeDzjc8BSCff1b7Dh0PGog", l: "https://vnepg.site/logos/129.png", g: "QUỐC TẾ" },
        { n: "AXN", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd", i: "nSn4fv3sPJ+rNo9ySmKtDg", k: "bxwJwDXqs2Mj1g0UVNs9IA", l: "https://vnepg.site/logos/163.png", g: "QUỐC TẾ" },
        { n: "CINEMAX", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/max.smil/manifest.mpd", i: "rLTCNHEGMyetxzLig8CEfw", k: "6YaPX0c9D9hpnt5I1THCsA", l: "https://vnepg.site/logos/130.png", g: "QUỐC TẾ" },
        { n: "KIX", u: "https://live.fptplay53.net/fnxhd2/kixhd_vhls.smil/chunklist_b5000000.m3u8", l: "https://vnepg.site/logos/167.png", g: "QUỐC TẾ" },
        { n: "DMAX", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/dmax.smil/manifest.mpd", i: "U7JvkErgOiC1ZHfPucXcog", k: "DGTM+5eOc5C9MzRAdUkq7A", l: "https://106b9c59d.vws.vegacdn.vn/rBN9EfEEFSyoELIQDjEu/3000x3000x1710918082/cmc_new/img.live_channel/0/0/0/0/271.jpg", g: "QUỐC TẾ" }
        // ... (Bạn có thể thêm tiếp các kênh quốc tế khác vào đây)
    ];

    function cleanName(name) {
        if (!name) return "";
        return name.replace(/HD/gi, "").replace(/VIP/gi, "").replace(/VTVCAB/gi, "").replace(/SCTV/gi, "").trim();
    }

    function toHex(b64) {
        try {
            const bin = atob(b64.replace(/-/g, '+').replace(/_/g, '/'));
            let res = "";
            for (let i = 0; i < bin.length; i++) {
                let h = bin.charCodeAt(i).toString(16);
                res += (h.length === 1 ? '0' : '') + h;
            }
            return res;
        } catch(e) { return ""; }
    }

    async function start() {
        video = document.getElementById('video');
        shaka.polyfill.installAll();
        if (shaka.Player.isBrowserSupported()) {
            player = new shaka.Player(video);
            await load();
            render();
            if(allData.length > 0) play(0);
        }
    }

    async function load() {
        let vnChannels = [];
        try {
            const r = await fetch(GITHUB);
            const txt = await r.text();
            let cur = null;
            txt.split('\n').forEach(line => {
                if (line.includes('#EXTINF')) {
                    const name = line.split(',')[1]?.trim() || "Kênh";
                    const nU = name.toUpperCase();
                    let logoMatch = line.match(/(?:tvg-logo|logo|tvg-logo-url)="([^"]+)"/i);
                    
                    // Phân loại nhóm thông minh
                    let g = "ĐỊA PHƯƠNG";
                    if (nU.includes("VTVCAB") || nU.includes("ON ")) g = "VTVCAB";
                    else if (nU.includes("SCTV")) g = "SCTV";
                    else if (nU.includes("HTV")) g = "HTV";
                    else if (nU.includes("VTV")) g = "VTV";

                    cur = { n: name, u: "", l: logoMatch ? logoMatch[1] : "", g: g };
                } else if (line.startsWith('http') && cur) {
                    cur.u = line.trim(); vnChannels.push(cur); cur = null;
                }
            });
        } catch(e) {}
        allData = [...FIXED_INT, ...vnChannels];
    }

    async function play(idx) {
        curIdx = idx; render();
        const ch = allData[idx];
        if (ch.i && ch.k) {
            player.configure({ drm: { clearKeys: { [toHex(ch.i)]: toHex(ch.k) } } });
        } else {
            player.configure({ drm: { clearKeys: {} } });
        }
        try {
            await player.load(ch.u);
            video.play();
        } catch (e) {
            if (ch.u.includes('.m3u8')) { video.src = ch.u; video.play(); }
        }
    }

    function render() {
        const box = document.getElementById('list');
        box.innerHTML = "";
        allData.forEach((ch, i) => {
            // Lọc theo Tab đang chọn
            if (curTab !== 'ALL' && ch.g !== curTab) return;
            
            const div = document.createElement('div');
            div.className = `item ${curIdx === i ? 'active' : ''}`;
            div.innerHTML = `
                <div class="img-wrap">
                    <img src="${ch.l || 'https://via.placeholder.com/100x45/222/555?text=TV'}" 
                         referrerpolicy="no-referrer" 
                         onerror="this.src='https://via.placeholder.com/100x45/222/555?text=TV'">
                </div>
                <span>${cleanName(ch.n)}</span>
            `;
            div.onclick = () => play(i);
            box.appendChild(div);
        });
    }

    function setTab(t, btn) {
        curTab = t;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
        // Cuộn danh sách lên đầu khi đổi Tab
        document.getElementById('list').scrollTop = 0;
    }
    start();
</script>
</body>
</html>
