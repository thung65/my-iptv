<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>IPTV Fixed</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body { margin:0; background:#000; color:#fff; display:flex; height:100vh; font-family:sans-serif; }
        #menu { width:250px; background:#111; overflow-y:auto; border-right:1px solid #333; }
        .ch { padding:15px; cursor:pointer; border-bottom:1px solid #222; }
        .ch.active { background:#b71c1c; font-weight:bold; }
        video { flex:1; background:#000; }
    </style>
</head>
<body>
<div id="menu"></div>
<video id="v" controls autoplay></video>
<script>
    const DATA = [
        { n: "HBO HD", i: "09ddfe3d63863cafaeb79d0546b098ab", k: "3de0f38dcf014827dfd5bec38743c6a2", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/hbo.smil/manifest.mpd" },
        { n: "AXN HD", i: "9d29f87efdec3c9fab368f724e62ad0e", k: "6f1c09c035eab36323d60d1454db3d20", u: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd" },
        { n: "CINEMAX", i: "acb4c23471063327adc732e283c0847f", k: "e9868f51473d0fd859ede48d531c2b0", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/max.smil/manifest.mpd" },
        { n: "CINEMA WORLD", i: "ee7915564d7439d09bd3556fccc87a4a", k: "b35e12a75a42e5f9184723a90ff42d9c", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/cinemaworld.smil/manifest.mpd" },
        { n: "ANIMAL PLANET", i: "ec6f072c7125377a9bc0ae61598095f4", k: "1d5388e0781415ebcec99f4f5ad75875", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/ap.smil/manifest.mpd" },
        { n: "DREAMWORKS", i: "67dae20527c3dadaae503aa91577cb", k: "59328f621d56767bc5ff9404a8f94016", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/dreamwork.smil/manifest.mpd" },
        { n: "CARTOONITO", i: "b1f0d759e914369db388b3b0dc815971", k: "5678d317e17007a88a9b9539e4526512", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/boomerang.smil/manifest.mpd" },
        { n: "BBC LIFESTYLE", i: "58b949986ed13294bc01b0f330abc527", k: "23e8c5f2fe202906ac2d6554d9527299", u: "https://s7770.cdn.mytvnet.vn/pkg20/live_dzones/bbclifestyle.smil/manifest.mpd" },
        { n: "BBC WORLD NEWS", i: "c7ba46086dda345a929e29bf155e4d37", k: "4b8f39904bf572689ea347ae86591", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/bbcworldnews.smil/manifest.mpd" }
    ];

    let p;
    async function init() {
        p = new shaka.Player(document.getElementById('v'));
        p.getNetworkingEngine().registerRequestFilter((t, r) => {
            r.headers['User-Agent'] = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/115.0 Safari/537.36';
        });
        const m = document.getElementById('menu');
        DATA.forEach((c, idx) => {
            const d = document.createElement('div');
            d.className = 'ch'; d.id = 'c'+idx; d.innerText = c.n;
            d.onclick = () => play(idx);
            m.appendChild(d);
        });
        play(0);
    }
    async function play(idx) {
        document.querySelectorAll('.ch').forEach(s => s.classList.remove('active'));
        document.getElementById('c'+idx).classList.add('active');
        p.configure({ drm: { clearKeys: { [DATA[idx].i]: DATA[idx].k } } });
        await p.load(DATA[idx].u);
    }
    shaka.polyfill.installAll();
    init();
</script>
</body>
</html>
