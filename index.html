<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ULTIMATE IPTV GATEWAY</title>
    <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.3.0/video.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 300px; background: #111; border-right: 1px solid #333; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-weight: bold; color: #0084ff; border-bottom: 1px solid #333; text-align: center; }
        #channel-list { flex: 1; overflow-y: auto; }
        .channel-item { display: flex; align-items: center; padding: 12px; cursor: pointer; border-bottom: 1px solid #222; }
        .channel-item:hover { background: #222; }
        .channel-item.active { background: #005a9e !important; }
        .channel-logo { width: 50px; height: 35px; object-fit: contain; margin-right: 12px; background: #000; border-radius: 4px; }
        #video-container { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; }
        .video-js { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="sidebar-header">IPTV STREAMING</div>
    <div id="channel-list">Loading...</div>
</div>

<div id="video-container">
    <video id="my-video" class="video-js vjs-default-skin" controls preload="auto" crossorigin="anonymous" autoplay>
        <p class="vjs-no-js">To view this video please enable JavaScript</p>
    </video>
</div>

<script>
    const M3U_URL = 'https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/ducnt123?v=' + Date.now();
    const player = videojs('my-video', {
        html5: {
            vhs: { overrideNative: true },
            nativeAudioTracks: false,
            nativeVideoTracks: false
        }
    });

    // ClearKey for HBO
    const clearkeyConfig = {
        '09ddfe3d63863cafaeb79d0546b098ab': '3de0f38dcf014827dfd5bec38743c6a2'
    };

    async function loadPlaylist() {
        try {
            const response = await fetch(M3U_URL);
            const data = await response.text();
            const lines = data.split('\n');
            const list = document.getElementById('channel-list');
            list.innerHTML = '';
            let meta = {};

            lines.forEach(line => {
                if (line.includes('#EXTINF')) {
                    const logo = line.match(/tvg-logo="([^"]+)"/i);
                    meta.logo = logo ? logo[1] : '';
                    meta.name = line.split(',')[1] || 'Unknown';
                } else if (line.startsWith('http')) {
                    const url = line.trim();
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    item.innerHTML = `<img class="channel-logo" src="${meta.logo || 'https://via.placeholder.com/50'}"> <span>${meta.name}</span>`;
                    item.onclick = () => playStream(url, item);
                    list.appendChild(item);
                    meta = {};
                }
            });
        } catch (e) { console.error("Playlist error"); }
    }

    function playStream(url, element) {
        document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
        element.classList.add('active');

        let type = 'application/x-mpegURL'; // Mặc định là m3u8 (HLS)
        if (url.includes('.mpd')) type = 'application/dash+xml';

        // Xử lý đặc biệt: Dùng Proxy để bóc tách luồng từ hoiquan.click
        const finalUrl = url.includes('hoiquan.click') ? "https://corsproxy.io/?" + encodeURIComponent(url) : url;

        player.src({
            src: finalUrl,
            type: type,
            keySystems: url.includes('.mpd') ? { 'org.w3.clearkey': clearkeyConfig } : {}
        });

        player.play().catch(error => {
            console.log("Auto-play blocked or Stream Error");
        });
    }

    loadPlaylist();
</script>
</body>
</html>
