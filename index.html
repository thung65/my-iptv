        video { width: 100%; height: 100%; }
        #menu { flex: 1; overflow-y: auto; padding: 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
        .btn { background: #151515; border: 1px solid #333; padding: 15px 5px; text-align: center; border-radius: 5px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .btn.active { background: #ff0000; color: #fff; border-color: #fff; }
        .msg { padding: 5px; font-size: 12px; color: #aaa; text-align: center; }
    </style>
</head>

        { n: "BBC EARTH", u: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/bbcearth.smil/manifest.mpd", i: "5014941a2c42379880b5edf72304c165", k: "f3fa0fe3cd39a52f4eefd36ff7161e89" }
    ];

    let player;

    async function start() {
        const video = document.getElementById('video');
        player = new shaka.Player(video);
        
        // Cấu hình tối ưu cho luồng MyTV
        player.configure({
            streaming: { bufferingGoal: 10, rebufferingGoal: 2 },
            manifest: { dash: { ignoreMinBufferTime: true } }
        });

        const menu = document.getElementById('menu');
        PLAYLIST.forEach((ch, idx) => {
            const btn = document.createElement('div');
            btn.className = 'btn';
            btn.innerText = ch.n;
            btn.onclick = () => loadCh(idx);
            menu.appendChild(btn);
        });
        loadCh(0);
    }

    async function loadCh(idx) {
        const ch = PLAYLIST[idx];
        document.querySelectorAll('.btn').forEach((b, i) => b.classList.toggle('active', i === idx));
        
        // Nạp chìa khóa giải mã
        player.configure({
            drm: { clearKeys: { [ch.i]: ch.k } }
        });

        try {
            await player.load(ch.u);
        } catch (e) {
            console.error("Lỗi kênh:", ch.n);
        }
    }
    document.addEventListener('DOMContentLoaded', start);
</script>
</body>
</html>
