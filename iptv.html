<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV AUTO-PLAY PRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        :root { --accent: #00e5ff; --bg: #000; --panel: #111; }
        body { margin: 0; background: var(--bg); color: #eee; font-family: sans-serif; overflow: hidden; }
        #video-container { position: absolute; inset: 0; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: contain; }
        .menu-btn { position: absolute; top: 20px; left: 20px; z-index: 100; background: var(--accent); color: #000; border: none; padding: 12px 30px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        #sidebar { position: absolute; left: 0; top: 0; width: 100%; max-width: 450px; height: 100%; background: rgba(10,10,10,0.96); z-index: 150; transform: translateX(-100%); transition: 0.3s; display: flex; flex-direction: column; border-right: 2px solid var(--accent); }
        #sidebar.open { transform: translateX(0); }
        .tabs { display: flex; overflow-x: auto; padding: 15px; gap: 8px; background: #222; }
        .tab { padding: 8px 15px; background: #333; border-radius: 4px; white-space: nowrap; cursor: pointer; font-size: 0.9rem; }
        .tab.active { background: var(--accent); color: #000; font-weight: bold; }
        .list { flex: 1; overflow-y: auto; padding: 15px; }
        .item { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--panel); border-radius: 8px; margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; }
        .item:focus, .item:hover { border-color: var(--accent); outline: none; background: #222; }
        .item img { width: 60px; height: 40px; object-fit: contain; background: #fff; border-radius: 4px; }
        .ch-info { flex: 1; }
        .ch-name { font-weight: bold; display: block; }
        .epg-text { font-size: 0.8rem; color: var(--accent); }
        @media (max-width: 600px) { #sidebar { max-width: 100%; } }
    </style>
</head>
<body>

<button class="menu-btn" onclick="toggleMenu()">DANH SÁCH</button>

<div id="sidebar">
    <div style="padding: 25px 20px 10px 20px"><h3 style="color:var(--accent); margin:0">TV TRỰC TUYẾN</h3></div>
    <div class="tabs" id="tab-box"></div>
    <div class="list" id="list-box"></div>
</div>

<div id="video-container">
    <video id="player" controls autoplay playsinline muted></video>
</div>

<script>
    var PROXY = 'https://api.allorigins.win/raw?url=';
    var M3U_URL = 'https://raw.githubusercontent.com/thung65/Iptv-vietnam/main/ducnt123_';
    var channels = [];
    var playerInst;

    async function init() {
        try {
            const res = await fetch(PROXY + encodeURIComponent(M3U_URL));
            const data = await res.text();
            parseM3U(data);
            
            // TỰ ĐỘNG PHÁT KÊNH ĐẦU TIÊN
            if (channels.length > 0) {
                console.log("Đang tự động phát kênh đầu tiên...");
                playChannel(channels[0], false); // false để không đóng menu vì lúc đầu menu đang đóng
            }
        } catch (e) { alert("Không thể tải danh sách"); }
    }

    function parseM3U(data) {
        var lines = data.split('\n');
        var cur = null;
        var groups = new Set(['TẤT CẢ']);

        lines.forEach(line => {
            line = line.trim();
            if (line.startsWith('#EXTINF')) {
                var name = line.split(',')[1] || "Kênh";
                var logo = line.match(/tvg-logo="([^"]+)"/)?.[1] || "";
                var group = line.match(/group-title="([^"]+)"/)?.[1] || "Khác";
                groups.add(group);
                cur = { name, logo, group, license: "" };
            } else if (line.startsWith('#KODIPROP:inputstream.adaptive.license_key=')) {
                cur.license = line.split('=')[1];
            } else if (line.startsWith('http')) {
                cur.url = line;
                channels.push(cur);
            }
        });

        renderTabs(Array.from(groups));
        renderList('TẤT CẢ');
    }

    function renderTabs(arr) {
        var box = document.getElementById('tab-box');
        // Sắp xếp: Tất cả đầu, Quốc tế cuối
        arr.sort((a, b) => (a === 'TẤT CẢ' ? -1 : (a === 'Quốc Tế' ? 1 : a.localeCompare(b))));
        arr.forEach(g => {
            var t = document.createElement('div');
            t.className = 'tab'; t.innerText = g;
            t.onclick = () => {
                document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
                t.classList.add('active');
                renderList(g);
            };
            box.appendChild(t);
        });
        box.firstChild.classList.add('active');
    }

    function renderList(g) {
        var box = document.getElementById('list-box');
        box.innerHTML = '';
        var filtered = (g === 'TẤT CẢ') ? channels : channels.filter(c => c.group === g);
        filtered.forEach(c => {
            var item = document.createElement('div');
            item.className = 'item'; item.tabIndex = 0;
            item.innerHTML = `<img src="${c.logo}"><div class="ch-info"><span class="ch-name">${c.name}</span></div>`;
            item.onclick = () => playChannel(c, true);
            box.appendChild(item);
        });
    }

    function toggleMenu() {
        var s = document.getElementById('sidebar');
        s.classList.toggle('open');
        if(s.classList.contains('open')) setTimeout(() => document.querySelector('.item')?.focus(), 200);
    }

    async function playChannel(obj, shouldCloseMenu) {
        var v = document.getElementById('player');
        if (shouldCloseMenu) toggleMenu();
        if (playerInst) await playerInst.destroy();

        if (obj.url.includes('.mpd')) {
            shaka.polyfill.installAll();
            playerInst = new shaka.Player(v);
            if (obj.license) {
                playerInst.configure({ drm: { servers: { 'org.w3.clearkey': obj.license } } });
            }
            await playerInst.load(obj.url);
        } else {
            if (Hls.isSupported()) {
                var hls = new Hls(); hls.loadSource(obj.url); hls.attachMedia(v);
            } else { v.src = obj.url; }
        }
        // Samsung TV yêu cầu "unmute" sau khi autoplay
        v.muted = false; 
    }

    init();
</script>
</body>
</html>
