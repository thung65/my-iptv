<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYBRID TV PLAYER</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        :root { --accent: #ffcc00; }
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* KHU VỰC PHÁT VIDEO */
        #video-container { width: 100%; aspect-ratio: 16/9; background: #111; border-bottom: 2px solid var(--accent); position: relative; }
        video { width: 100%; height: 100%; background: #000; }

        /* THANH ĐIỀU HƯỚNG TABS */
        .tabs { display: flex; overflow-x: auto; background: #1a1a1a; padding: 10px; gap: 8px; border-bottom: 1px solid #333; }
        .tabs button { padding: 10px 20px; border: none; background: #333; color: #ccc; font-weight: bold; cursor: pointer; border-radius: 4px; white-space: nowrap; }
        .tabs button.active { background: var(--accent); color: #000; }

        /* DANH SÁCH KÊNH */
        #list { flex: 1; overflow-y: auto; padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
        .item { background: #111; padding: 12px 5px; text-align: center; border: 1px solid #222; border-radius: 8px; cursor: pointer; }
        .item.active { border-color: var(--accent); background: #1a1a00; }
        .item img { height: 40px; max-width: 85%; object-fit: contain; margin-bottom: 6px; background: #fff; border-radius: 4px; }
        .item span { font-size: 11px; font-weight: bold; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>

<div id="video-container">
    <video id="video" controls autoplay playsinline></video>
</div>

<div class="tabs">
    <button class="active" onclick="setTab('ALL', this)">TẤT CẢ</button>
    <button onclick="setTab('VTV', this)">VTV</button>
    <button onclick="setTab('SCTV', this)">SCTV</button>
    <button onclick="setTab('QUỐC TẾ', this)">QUỐC TẾ</button>
</div>

<div id="list"></div>

<script>
    const video = document.getElementById('video');
    let player, curTab = "ALL";

    // Danh sách kênh: TẤT CẢ đầu - QUỐC TẾ cuối
    const CHANNELS = [
        { n: "VTV1 HD", u: "https://live.fptplay53.net/fnxch2/vtv1hd_abr.smil/chunklist_b4200000.m3u8", l: "https://vnepg.site/logos/1.png", g: "VTV" },
        { n: "VTV3 HD", u: "https://live.fptplay53.net/fnxch2/vtv3hd_abr.smil/chunklist_b4200000.m3u8", l: "https://vnepg.site/logos/3.png", g: "VTV" },
        { n: "SCTV1 (HTTP)", u: "http://akasaijr.myftp.org:21585/sctv1/index.m3u8", l: "https://vnepg.site/logos/51.png", g: "SCTV" },
        { n: "SCTV9 HD (DRM)", u: "https://livecdn.seenow.vn/mean/SCTV9/manifest.mpd", i: "22a9a9a63d2746df9f90c184c596105a", k: "2d9d24caeaea42f8b44e413fe04f0e5c", l: "https://vnepg.site/logos/53.png", g: "SCTV" },
        { n: "CNN INT", u: "https://cnn-cnninternational-1-de.samsung.wurl.com/manifest/playlist.m3u8", l: "https://upload.wikimedia.org/wikipedia/commons/b/b1/CNN.svg", g: "QUỐC TẾ" }
    ];

    function toHex(v) {
        try { return Array.from(atob(v.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0).toString(16).padStart(2,'0')).join(''); }
        catch(e) { return v; }
    }

    async function init() {
        shaka.polyfill.installAll();
        player = new shaka.Player(video);
        
        // Cấu hình để player chịu tải tốt hơn trên Tivi yếu
        player.configure({ streaming: { bufferingGoal: 10 } });

        render();
        play(CHANNELS[0]);
    }

    async function play(ch) {
        await player.unload();
        video.pause();
        video.removeAttribute('src');
        video.load();

        // LOGIC TRÌNH PHÁT LAI (HYBRID):
        if (ch.u.startsWith("http://")) {
            // Đối với link HTTP: Dùng trình phát gốc của Tivi để tránh bị Shaka chặn bảo mật
            console.log("Phát bằng Native Player (HTTP)");
            video.src = ch.u;
        } else {
            // Đối với link HTTPS hoặc DRM: Dùng Shaka Player chuyên sâu
            console.log("Phát bằng Shaka Player (HTTPS)");
            if (ch.i && ch.k) {
                let keys = {}; keys[toHex(ch.i)] = toHex(ch.k);
                player.configure({ drm: { clearKeys: keys } });
            } else {
                player.configure({ drm: { clearKeys: {} } });
            }
            try {
                await player.load(ch.u);
            } catch (e) {
                video.src = ch.u; // Dự phòng nếu Shaka lỗi
            }
        }
        
        video.play().catch(() => {});
        render(ch.u);
    }

    function render(activeUrl = "") {
        const box = document.getElementById('list');
        box.innerHTML = "";
        CHANNELS.forEach(ch => {
            if (curTab !== 'ALL' && ch.g !== curTab) return;
            const div = document.createElement('div');
            div.className = `item ${ch.u === activeUrl ? 'active' : ''}`;
            div.innerHTML = `<img src="${ch.l}" onerror="this.src='https://via.placeholder.com/60x35'"><span>${ch.n}</span>`;
            div.onclick = () => play(ch);
            box.appendChild(div);
        });
    }

    function setTab(t, btn) {
        curTab = t;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    init();
</script>
</body>
</html>
