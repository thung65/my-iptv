<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>SAMSUNG TV - SCTV TỔNG HỢP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        #video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-bottom: 2px solid #ffcc00; }
        video { width: 100%; height: 100%; outline: none; }
        .tabs { display: flex; overflow-x: auto; background: #111; padding: 10px; gap: 8px; border-bottom: 1px solid #333; scrollbar-width: none; }
        .tabs button { padding: 10px 18px; border: none; background: #222; color: #999; font-weight: bold; cursor: pointer; border-radius: 4px; white-space: nowrap; }
        .tabs button.active { background: #ffcc00; color: #000; }
        #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding: 12px; overflow-y: auto; flex: 1; }
        .item { background: #111; padding: 12px 5px; text-align: center; border: 1px solid #222; border-radius: 6px; cursor: pointer; }
        .item.active { border-color: #ffcc00; background: #1a1a00; }
        .item img { height: 35px; max-width: 90%; object-fit: contain; display: block; margin: 0 auto 5px; background: #fff; }
        .item span { font-size: 10px; font-weight: bold; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>

<div id="video-box"><video id="video" controls autoplay playsinline></video></div>

<div class="tabs">
    <button class="active" onclick="setTab('ALL', this)">TẤT CẢ</button>
    <button onclick="setTab('VTV', this)">VTV</button>
    <button onclick="setTab('SCTV', this)">SCTV</button>
    <button id="btn-intl" onclick="setTab('QUỐC TẾ', this)">QUỐC TẾ</button>
</div>

<div id="list"></div>

<script>
    let video = document.getElementById('video'), shakaPlayer, allData = [], curTab = "ALL";

    const CHANNELS = [
        // NHÓM SCTV (HTTP - TRÌNH PHÁT NATIVE)
        { n: "SCTV TỔNG HỢP", u: "http://akasaijr.myftp.org:21585/sctvtonghop/index.m3u8", l: "https://vnepg.site/logos/sctvtonghop.png", g: "SCTV" },
        { n: "SCTV18 (Laliga)", u: "http://akasaijr.myftp.org:21585/vtc1/index.m3u8", l: "https://vnepg.site/logos/61.png", g: "SCTV" },
        { n: "SCTV9 (TVB)", u: "http://akasaijr.myftp.org:21585/sctv9/index.m3u8", l: "https://vnepg.site/logos/53.png", g: "SCTV" },
        { n: "SCTV1 (Hài)", u: "http://akasaijr.myftp.org:21585/sctv1/index.m3u8", l: "https://vnepg.site/logos/46.png", g: "SCTV" },
        
        // NHÓM VTV (HTTPS - TRÌNH PHÁT SHAKA)
        { n: "VTV1 HD", u: "https://live.fptplay53.net/fnxch2/vtv1hd_abr.smil/chunklist_b4200000.m3u8", l: "https://vnepg.site/logos/1.png", g: "VTV" },
        { n: "VTV3 HD", u: "https://live.fptplay53.net/fnxch2/vtv3hd_abr.smil/chunklist_b4200000.m3u8", l: "https://vnepg.site/logos/3.png", g: "VTV" },
        
        // NHÓM QUỐC TẾ (CUỐI CÙNG)
        { n: "CNN", u: "https://cnn-cnninternational-1-de.samsung.wurl.com/manifest/playlist.m3u8", l: "https://vnepg.site/logos/156.png", g: "QUỐC TẾ" }
    ];

    async function init() {
        shaka.polyfill.installAll();
        shakaPlayer = new shaka.Player(video);
        allData = CHANNELS; 
        render();
        play(allData[0]);
    }

    async function play(ch) {
        await shakaPlayer.unload();
        video.pause();
        video.removeAttribute('src');
        video.load();

        if (ch.u.startsWith("http://")) {
            video.src = ch.u;
            video.play().catch(() => {});
        } else {
            try { await shakaPlayer.load(ch.u); } 
            catch(e) { video.src = ch.u; }
        }
        render(ch.u);
    }

    function render(activeUrl = "") {
        const box = document.getElementById('list');
        box.innerHTML = "";
        allData.forEach(ch => {
            if (curTab !== 'ALL' && ch.g !== curTab) return;
            const div = document.createElement('div');
            div.className = `item ${ch.u === activeUrl ? 'active' : ''}`;
            div.innerHTML = `<img src="${ch.l}" onerror="this.src='https://via.placeholder.com/50'"><span>${ch.n}</span>`;
            div.onclick = () => play(ch);
            box.appendChild(div);
        });
    }

    function setTab(t, btn) {
        curTab = t;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    init();
</script>
</body>
</html>
