<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMSUNG TV LITE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        #video-box { width: 100%; aspect-ratio: 16/9; background: #000; }
        video { width: 100%; height: 100%; }
        .tabs { display: flex; overflow-x: auto; background: #111; padding: 5px; gap: 5px; scrollbar-width: none; }
        .tabs button { padding: 8px 15px; border: none; background: #222; color: #ccc; font-size: 12px; cursor: pointer; border-radius: 2px; white-space: nowrap; }
        .tabs button.active { background: #ffcc00; color: #000; font-weight: bold; }
        #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; padding: 10px; overflow-y: auto; flex: 1; }
        .item { background: #151515; padding: 8px 3px; text-align: center; border: 1px solid #222; cursor: pointer; }
        .item.active { border-color: #ffcc00; background: #222; }
        .item img { height: 30px; max-width: 80%; object-fit: contain; margin-bottom: 4px; }
        .item span { font-size: 10px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>

<div id="video-box"><video id="video" controls autoplay playsinline></video></div>

<div class="tabs">
    <button class="active" onclick="setTab('ALL', this)">TẤT CẢ</button>
    <button onclick="setTab('VTV', this)">VTV</button>
    <button onclick="setTab('SCTV', this)">SCTV</button>
    <button onclick="setTab('VTVCAB', this)">VTVCAB</button>
    <button onclick="setTab('HTV', this)">HTV/HTVC</button>
    <button onclick="setTab('ĐỊA PHƯƠNG', this)">ĐỊA PHƯƠNG</button>
    <button onclick="setTab('QUỐC TẾ', this)">QUỐC TẾ</button>
</div>

<div id="list"></div>

<script>
    const GITHUB_URL = "https://raw.githubusercontent.com/thung65/Iptv-vietnam/main/ducnt123";
    let video = document.getElementById('video'), player, allData = [], curTab = "ALL";

    function toHex(val) {
        if (!val || val.length === 32) return val;
        try {
            return Array.from(atob(val.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0).toString(16).padStart(2,'0')).join('');
        } catch(e) { return val; }
    }

    async function start() {
        shaka.polyfill.installAll();
        player = new shaka.Player(video);
        
        // Cấu hình giảm lag: Giảm thời gian chờ buffer
        player.configure({
            streaming: {
                bufferingGoal: 5,
                rebufferingGoal: 2,
                bufferBehind: 10
            }
        });

        try {
            const r = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(GITHUB_URL));
            const t = await r.text();
            let ext = [], cur = null;
            
            t.split('\n').forEach(l => {
                l = l.trim();
                if (l.startsWith('#EXTINF')) {
                    const name = l.split(',')[1] || "";
                    let group = "ĐỊA PHƯƠNG";
                    const n = name.toUpperCase();
                    if (n.includes("VTVCAB")) group = "VTVCAB";
                    else if (n.includes("SCTV")) group = "SCTV";
                    else if (n.includes("VTV")) group = "VTV";
                    else if (n.includes("HTV")) group = "HTV/HTVC";
                    else if (n.includes("HBO") || n.includes("AXN") || n.includes("CNN")) group = "QUỐC TẾ";
                    
                    cur = { n: name, u: "", l: l.match(/tvg-logo="([^"]+)"/i)?.[1] || "", g: group, i: "", k: "" };
                } else if (l.includes('license_key=')) {
                    try {
                        const drmData = JSON.parse(l.split('license_key=')[1]);
                        cur.i = drmData.keys[0].kid; cur.k = drmData.keys[0].k;
                    } catch(e) {}
                } else if (l.startsWith('http')) {
                    if (cur) { cur.u = l; ext.push(cur); cur = null; }
                }
            });

            allData = ext;
            render();
            if(allData.length > 0) play(allData[0]);
        } catch(e) {}
    }

    async function play(ch) {
        await player.unload();
        if (ch.i && ch.k) {
            let drmConfig = {};
            drmConfig[toHex(ch.i)] = toHex(ch.k);
            player.configure({ drm: { clearKeys: drmConfig } });
        } else {
            player.configure({ drm: { clearKeys: {} } });
        }

        try {
            if (ch.u.includes('.mpd')) {
                await player.load(ch.u);
            } else {
                video.src = ch.u;
            }
            video.play();
        } catch (e) {}
        
        const items = document.querySelectorAll('.item');
        items.forEach(el => {
            el.classList.remove('active');
            if(el.dataset.url === ch.u) el.classList.add('active');
        });
    }

    function render() {
        const box = document.getElementById('list');
        box.innerHTML = "";
        allData.forEach(ch => {
            if (curTab !== 'ALL' && ch.g !== curTab) return;
            const div = document.createElement('div');
            div.className = 'item';
            div.dataset.url = ch.u;
            div.innerHTML = `<img src="${ch.l}" loading="lazy"><span>${ch.n}</span>`;
            div.onclick = () => play(ch);
            box.appendChild(div);
        });
    }

    function setTab(t, btn) {
        curTab = t;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    start();
</script>
</body>
</html>
