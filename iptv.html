<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV PRO MAX - SAMSUNG TV</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    
    <style>
        :root { --accent: #00e5ff; --bg: #000; --panel: #111; --text: #eee; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; }

        /* Video nền */
        #video-container { position: absolute; inset: 0; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* Nút TẤT CẢ */
        .all-btn {
            position: absolute; top: 30px; left: 30px; z-index: 100;
            background: var(--accent); color: #000; border: none;
            padding: 15px 40px; border-radius: 8px; font-weight: 900;
            font-size: 1.4rem; cursor: pointer; box-shadow: 0 0 20px rgba(0,229,255,0.4);
        }

        /* Sidebar điều hướng */
        #sidebar {
            position: absolute; left: 0; top: 0; width: 500px; height: 100%;
            background: rgba(10, 10, 10, 0.95); z-index: 150;
            transform: translateX(-100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; border-right: 2px solid var(--accent);
        }
        #sidebar.open { transform: translateX(0); }

        /* Tabs Nhóm kênh */
        .group-tabs {
            display: flex; overflow-x: auto; padding: 20px 10px; gap: 10px;
            background: #1a1a1a; scrollbar-width: none;
        }
        .tab {
            padding: 12px 25px; background: #333; border-radius: 5px;
            white-space: nowrap; cursor: pointer; font-weight: bold;
        }
        .tab.active { background: var(--accent); color: #000; }

        /* Danh sách kênh & EPG */
        .channel-list { flex: 1; overflow-y: auto; padding: 20px; }
        .channel-item {
            display: flex; align-items: center; gap: 15px; padding: 15px;
            background: var(--panel); border-radius: 10px; margin-bottom: 12px;
            border: 2px solid transparent; cursor: pointer;
        }
        .channel-item:focus, .channel-item:hover { 
            border-color: var(--accent); background: #222; outline: none; transform: scale(1.02);
        }
        .channel-item img { width: 80px; height: 50px; object-fit: contain; background: #fff; border-radius: 5px; }
        
        /* Phần thông tin EPG */
        .epg-info { flex: 1; }
        .ch-name { font-weight: bold; font-size: 1.1rem; display: block; margin-bottom: 4px; }
        .epg-now { font-size: 0.85rem; color: var(--accent); }
        .epg-next { font-size: 0.75rem; color: #aaa; }

        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 140; display: none; }
    </style>
</head>
<body>

    <button class="all-btn" onclick="toggleSidebar()">TẤT CẢ</button>
    <div id="overlay" onclick="toggleSidebar()"></div>

    <div id="sidebar">
        <div style="padding: 30px 20px 10px 20px"><h2 style="color:var(--accent); margin:0">DANH SÁCH TV</h2></div>
        <div class="group-tabs" id="tabs"></div>
        <div class="channel-list" id="list"></div>
    </div>

    <div id="video-container">
        <video id="player" controls autoplay></video>
    </div>

<script>
    const M3U_URL = 'https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/ducnt123_';
    const EPG_URL = 'https://vnepg.site/epg.xml.gz';
    
    let allChannels = [];
    let epgData = {};
    let currentPlayer;

    // 1. Tải và Giải nén EPG
    async function fetchEPG() {
        try {
            const res = await fetch(EPG_URL);
            const buffer = await res.arrayBuffer();
            const decompressed = pako.inflate(new Uint8Array(buffer), { to: 'string' });
            const parser = new DOMParser();
            const xml = parser.parseFromString(decompressed, "text/xml");
            
            const programs = xml.querySelectorAll('programme');
            const now = new Date();

            programs.forEach(p => {
                const startStr = p.getAttribute('start'); // Định dạng YYYYMMDDHHMMSS +HHMM
                const channelId = p.getAttribute('channel');
                
                // Chỉ lấy chương trình đang và sắp chiếu
                const startTime = parseEPGTime(startStr);
                if (!epgData[channelId]) epgData[channelId] = [];
                epgData[channelId].push({
                    start: startTime,
                    title: p.querySelector('title').textContent,
                    timeLabel: `${startTime.getHours()}:${startTime.getMinutes().toString().padStart(2, '0')}`
                });
            });
        } catch (e) { console.error("Lỗi tải EPG:", e); }
    }

    function parseEPGTime(str) {
        return new Date(str.substring(0,4), str.substring(4,6)-1, str.substring(6,8), str.substring(8,10), str.substring(10,12));
    }

    // 2. Tải M3U và hiển thị
    async function init() {
        await fetchEPG();
        const res = await fetch(M3U_URL);
        const text = await res.text();
        
        const lines = text.split('\n');
        let current = null;
        const groups = new Set(['TẤT CẢ']);

        lines.forEach(line => {
            if (line.startsWith('#EXTINF')) {
                const id = line.match(/tvg-id="([^"]+)"/)?.[1] || '';
                const logo = line.match(/tvg-logo="([^"]+)"/)?.[1] || '';
                const group = line.match(/group-title="([^"]+)"/)?.[1] || 'Khác';
                const name = line.split(',')[1]?.trim();
                groups.add(group);
                current = { id, logo, group, name };
            } else if (line.startsWith('http')) {
                current.url = line.trim();
                allChannels.push(current);
            }
        });

        renderTabs(Array.from(groups));
        renderList('TẤT CẢ');
    }

    function renderTabs(groups) {
        const container = document.getElementById('tabs');
        // Sắp xếp: Tất cả đầu, Quốc tế cuối
        groups.sort((a,b) => (a === 'TẤT CẢ' ? -1 : (a === 'Quốc Tế' ? 1 : a.localeCompare(b))));
        
        groups.forEach(g => {
            const btn = document.createElement('div');
            btn.className = 'tab';
            btn.innerText = g;
            btn.onclick = () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
                renderList(g);
            };
            container.appendChild(btn);
        });
        container.firstChild.classList.add('active');
    }

    function renderList(groupName) {
        const container = document.getElementById('list');
        container.innerHTML = '';
        const filtered = groupName === 'TẤT CẢ' ? allChannels : allChannels.filter(c => c.group === groupName);

        filtered.forEach(ch => {
            const item = document.createElement('div');
            item.className = 'channel-item';
            item.tabIndex = 0;
            
            // Tìm thông tin EPG
            const programs = epgData[ch.id] || [];
            const now = new Date();
            const currentProg = programs.find((p, i) => p.start <= now && (!programs[i+1] || programs[i+1].start > now));
            
            item.innerHTML = `
                <img src="${ch.logo}">
                <div class="epg-info">
                    <span class="ch-name">${ch.name}</span>
                    <span class="epg-now">${currentProg ? '⏺ ' + currentProg.title : 'Đang cập nhật lịch...'}</span>
                </div>
            `;
            
            item.onclick = () => play(ch.url);
            item.onkeydown = (e) => { if(e.key === 'Enter') play(ch.url); };
            container.appendChild(item);
        });
    }

    function toggleSidebar() {
        const side = document.getElementById('sidebar');
        const over = document.getElementById('overlay');
        side.classList.toggle('open');
        over.style.display = side.classList.contains('open') ? 'block' : 'none';
        if(side.classList.contains('open')) document.querySelector('.channel-item')?.focus();
    }

    async function play(url) {
        const video = document.getElementById('player');
        if (currentPlayer) await currentPlayer.destroy();
        toggleSidebar();

        if (url.includes('.mpd')) {
            shaka.polyfill.installAll();
            currentPlayer = new shaka.Player(video);
            await currentPlayer.load(url);
        } else {
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
            } else { video.src = url; }
        }
    }

    init();
</script>
</body>
</html>
