<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV MULTI-DEVICE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    
    <style>
        :root { --accent: #00e5ff; --bg: #000; --panel: #1a1a1a; }
        body { margin: 0; background: var(--bg); color: #eee; font-family: sans-serif; overflow: hidden; }

        /* Video: Chiếm toàn màn hình */
        #video-container { position: absolute; inset: 0; background: #000; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* Nút Menu chính */
        .menu-toggle {
            position: absolute; top: 15px; left: 15px; z-index: 100;
            background: var(--accent); color: #000; border: none;
            padding: 10px 25px; border-radius: 5px; font-weight: bold;
            cursor: pointer; font-size: 1rem;
        }

        /* Sidebar: Tối ưu cho cả TV (rộng) và Phone (full màn hình khi mở) */
        #sidebar {
            position: absolute; left: 0; top: 0; width: 100%; max-width: 450px; height: 100%;
            background: rgba(10, 10, 10, 0.98); z-index: 150;
            transform: translateX(-100%); transition: 0.3s;
            display: flex; flex-direction: column; border-right: 2px solid var(--accent);
        }
        #sidebar.open { transform: translateX(0); }

        /* Tabs nhóm kênh: Cuộn ngang */
        .group-tabs {
            display: flex; overflow-x: auto; padding: 15px 10px; gap: 8px;
            background: #222; white-space: nowrap; -webkit-overflow-scrolling: touch;
        }
        .tab {
            padding: 8px 15px; background: #333; border-radius: 4px;
            cursor: pointer; font-size: 0.9rem;
        }
        .tab.active { background: var(--accent); color: #000; font-weight: bold; }

        /* Danh sách kênh: Tối ưu hiển thị */
        .channel-list { flex: 1; overflow-y: auto; padding: 15px; }
        .channel-item {
            display: flex; align-items: center; gap: 12px; padding: 12px;
            background: var(--panel); border-radius: 8px; margin-bottom: 10px;
            border: 2px solid transparent; cursor: pointer; transition: 0.2s;
        }
        .channel-item:focus, .channel-item:hover { border-color: var(--accent); outline: none; background: #252525; }
        .channel-item img { width: 60px; height: 40px; object-fit: contain; background: #fff; border-radius: 3px; }
        
        .ch-info { flex: 1; overflow: hidden; }
        .ch-name { font-weight: bold; font-size: 1rem; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .epg-text { font-size: 0.8rem; color: var(--accent); display: block; }

        /* Responsive cho điện thoại */
        @media (max-width: 600px) {
            #sidebar { max-width: 100%; }
            .menu-toggle { width: 40%; text-align: center; }
        }
    </style>
</head>
<body>

    <button class="menu-toggle" onclick="toggleSidebar()">DANH SÁCH</button>

    <div id="sidebar">
        <div style="padding: 20px 15px 5px 15px">
            <h3 style="color:var(--accent); margin:0">IPTV VIETNAM</h3>
        </div>
        <div class="group-tabs" id="tabs"></div>
        <div class="channel-list" id="list"></div>
    </div>

    <div id="video-container">
        <video id="player" controls autoplay playsinline></video>
    </div>

<script>
    // Sử dụng Proxy để tránh lỗi CORS khi chạy trên GitHub Pages
    var PROXY = 'https://api.allorigins.win/raw?url=';
    var M3U_URL = 'https://raw.githubusercontent.com/thung65/Iptv-vietnam/refs/heads/main/ducnt123_';
    var EPG_URL = 'https://vnepg.site/epg.xml.gz';
    
    var allChannels = [];
    var epgData = {};
    var currentPlayer;

    // Tải EPG và giải nén
    function fetchEPG() {
        return fetch(PROXY + encodeURIComponent(EPG_URL))
            .then(function(res) { return res.arrayBuffer(); })
            .then(function(buffer) {
                var decompressed = pako.inflate(new Uint8Array(buffer), { to: 'string' });
                var parser = new DOMParser();
                var xml = parser.parseFromString(decompressed, "text/xml");
                var programs = xml.querySelectorAll('programme');
                
                programs.forEach(function(p) {
                    var channelId = p.getAttribute('channel');
                    var startStr = p.getAttribute('start');
                    if (!epgData[channelId]) epgData[channelId] = [];
                    epgData[channelId].push({
                        start: parseTime(startStr),
                        title: p.querySelector('title').textContent
                    });
                });
            }).catch(function(err) { console.log("EPG Error", err); });
    }

    function parseTime(s) {
        return new Date(s.substring(0,4), s.substring(4,6)-1, s.substring(6,8), s.substring(8,10), s.substring(10,12));
    }

    // Tải M3U
    function init() {
        fetchEPG().then(function() {
            return fetch(PROXY + encodeURIComponent(M3U_URL));
        })
        .then(function(res) { return res.text(); })
        .then(function(text) {
            var lines = text.split('\n');
            var current = null;
            var groups = new Set(['TẤT CẢ']);

            lines.forEach(function(line) {
                if (line.indexOf('#EXTINF') !== -1) {
                    var id = line.match(/tvg-id="([^"]+)"/)?.[1] || "";
                    var logo = line.match(/tvg-logo="([^"]+)"/)?.[1] || "";
                    var group = line.match(/group-title="([^"]+)"/)?.[1] || "Khác";
                    var name = line.split(',')[1] ? line.split(',')[1].trim() : "Không tên";
                    groups.add(group);
                    current = { id: id, logo: logo, group: group, name: name };
                } else if (line.indexOf('http') === 0) {
                    current.url = line.trim();
                    allChannels.push(current);
                }
            });

            renderTabs(Array.from(groups));
            renderList('TẤT CẢ');
        });
    }

    function renderTabs(groups) {
        var container = document.getElementById('tabs');
        // All đầu, Quốc tế cuối
        groups.sort(function(a, b) {
            if (a === 'TẤT CẢ') return -1;
            if (a === 'Quốc Tế') return 1;
            return a.localeCompare(b);
        });

        groups.forEach(function(g) {
            var btn = document.createElement('div');
            btn.className = 'tab';
            btn.innerText = g;
            btn.onclick = function() {
                document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
                btn.classList.add('active');
                renderList(g);
            };
            container.appendChild(btn);
        });
        if(container.firstChild) container.firstChild.classList.add('active');
    }

    function renderList(groupName) {
        var container = document.getElementById('list');
        container.innerHTML = '';
        var filtered = (groupName === 'TẤT CẢ') ? allChannels : allChannels.filter(function(c) { return c.group === groupName; });

        filtered.forEach(function(ch) {
            var item = document.createElement('div');
            item.className = 'channel-item';
            item.tabIndex = 0;
            
            var progs = epgData[ch.id] || [];
            var now = new Date();
            var current = progs.find(function(p, i) { 
                return p.start <= now && (!progs[i+1] || progs[i+1].start > now); 
            });

            item.innerHTML = '<img src="'+ch.logo+'"><div class="ch-info">' +
                '<span class="ch-name">'+ch.name+'</span>' +
                '<span class="epg-text">'+(current ? '⏺ ' + current.title : 'Chương trình lưu động')+'</span>' +
                '</div>';
            
            item.onclick = function() { play(ch.url); };
            item.onkeydown = function(e) { if(e.key === 'Enter') play(ch.url); };
            container.appendChild(item);
        });
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        if(document.getElementById('sidebar').classList.contains('open')) {
            setTimeout(function() { document.querySelector('.channel-item')?.focus(); }, 100);
        }
    }

    function play(url) {
        var video = document.getElementById('player');
        if (currentPlayer) currentPlayer.destroy();
        toggleSidebar();

        if (url.indexOf('.mpd') !== -1) {
            shaka.polyfill.installAll();
            currentPlayer = new shaka.Player(video);
            currentPlayer.load(url);
        } else {
            if (Hls.isSupported()) {
                var hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
            } else { video.src = url; }
        }
    }

    init();
</script>
</body>
</html>
