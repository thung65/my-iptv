<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>SAMSUNG 4K PRO - SEENOW FIX</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mux.js/6.0.1/mux.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    
    <style>
        * { box-sizing: border-box; -webkit-transform: translateZ(0); }
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        /* Khung Video 4K */
        #video-box { width: 100%; height: 50vh; background: #000; border-bottom: 3px solid #ffcc00; }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* Tabs theo yêu cầu: Tất cả đầu, Quốc tế cuối */
        .tabs { display: flex; overflow-x: auto; background: #111; padding: 12px; gap: 10px; flex-shrink: 0; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tabs button { 
            padding: 12px 25px; border: none; background: #252525; color: #aaa; 
            font-size: 15px; font-weight: bold; cursor: pointer; border-radius: 8px; 
        }
        .tabs button.active { background: #ffcc00; color: #000; }

        /* Danh sách 169 kênh cực mượt */
        #list { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
            gap: 15px; padding: 20px; overflow-y: auto; flex: 1; 
            content-visibility: auto; /* Chống lag cho list dài */
        }
        .item { 
            background: #1a1a1a; padding: 15px 5px; text-align: center; 
            border: 2px solid #333; border-radius: 12px; cursor: pointer; 
            transition: 0.2s; outline: none;
        }
        .item:focus, .item:hover { border-color: #ffcc00; transform: scale(1.05); background: #222; }
        .item.active { border-color: #ffcc00; background: #252500; }
        .item img { height: 45px; max-width: 85%; object-fit: contain; margin-bottom: 8px; }
        .item span { font-size: 12px; font-weight: bold; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>

<div id="video-box"><video id="video" controls autoplay playsinline></video></div>
<div class="tabs" id="tab-bar"></div>
<div id="list"></div>

<script>
    // Thứ tự nhóm: Tất cả ở đầu, Quốc tế ở cuối
    const GROUPS = ["TẤT CẢ", "VTV", "SCTV", "VTVCAB", "HTV", "ĐỊA PHƯƠNG", "QUỐC TẾ"];
    let player, video = document.getElementById('video'), curTab = "TẤT CẢ";

    // Danh sách 169 kênh của bạn dán vào đây
    const CHANNELS = [
        { n: "SCTV9 HD", u: "https://livecdn.seenow.vn/mean/SCTV9/manifest.mpd", i: "22a9a9a63d2746df9f90c184c596105a", k: "2d9d24caeaea42f8b44e413fe04f0e5c", l: "https://vnepg.site/logos/53.png", g: "SCTV" },
        { n: "VTV3 HD", u: "https://livecdn.seenow.vn/mean/VTV3HD/manifest.mpd", i: "b45089e9334a41309e30a9161a06733c", k: "976d91c28c86326e100366479f676450", l: "https://vnepg.site/logos/3.png", g: "VTV" },
        // ... Dán tiếp các kênh khác
    ];

    async function init() {
        shaka.polyfill.installAll();
        player = new shaka.Player(video);

        // LÔGIC QUAN TRỌNG: Vượt rào Seenow bằng cách giả lập Chrome máy tính
        player.getNetworkingEngine().registerRequestFilter((type, request) => {
            request.headers['User-Agent'] = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36';
        });

        // Tối ưu cho TV 2022 mạnh mẽ
        player.configure({
            streaming: { bufferingGoal: 8, rebufferingGoal: 2, bufferBehind: 1 }
        });

        renderTabs();
        renderChannels();
        if(CHANNELS.length > 0) play(CHANNELS[0]);
    }

    async function play(ch) {
        try {
            await player.unload();
            video.src = "";
            
            // Xử lý ClearKey cho Seenow
            if (ch.i && ch.k) {
                const drm = {};
                drm[toHex(ch.i)] = toHex(ch.k);
                player.configure({ drm: { clearKeys: drm } });
            }

            // Thử load bằng Shaka (Dành cho MPD/M3U8)
            await player.load(ch.u);
        } catch (e) {
            // Nếu là link HTTP/HTTPS trực tiếp, Shaka bỏ qua thì dùng video.src
            video.src = ch.u;
            video.play().catch(()=>{});
        }

        // Cập nhật trạng thái Active
        document.querySelectorAll('.item').forEach(el => {
            el.classList.toggle('active', el.getAttribute('data-name') === ch.n);
        });
    }

    function renderTabs() {
        document.getElementById('tab-bar').innerHTML = GROUPS.map(g => 
            `<button class="${g===curTab?'active':''}" onclick="setTab('${g}', this)">${g}</button>`
        ).join('');
    }

    function renderChannels() {
        const box = document.getElementById('list');
        const frag = document.createDocumentFragment();
        CHANNELS.forEach(ch => {
            if (curTab !== 'TẤT CẢ' && ch.g !== curTab) return;
            const div = document.createElement('div');
            div.className = "item";
            div.setAttribute('data-name', ch.n);
            div.setAttribute('tabindex', '0');
            div.innerHTML = `<img src="${ch.l}" loading="lazy"><span>${ch.n}</span>`;
            div.onclick = () => play(ch);
            frag.appendChild(div);
        });
        box.innerHTML = "";
        box.appendChild(frag);
    }

    function setTab(t, btn) {
        curTab = t;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderChannels();
    }

    function toHex(val) {
        if (!val || val.length === 32) return val;
        try { return Array.from(atob(val.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0).toString(16).padStart(2,'0')).join(''); } catch(e) { return val; }
    }

    init();
</script>
</body>
</html>
