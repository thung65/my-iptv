<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV PRO - SAMSUNG 55</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --accent: #00e5ff; --bg: #0a0a0a; }
        body { margin: 0; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #main-player { position: absolute; inset: 0; z-index: 1; background: #000; }
        video { width: 100%; height: 100%; object-fit: contain; }
        .menu-btn { position: absolute; top: 20px; left: 20px; z-index: 100; background: var(--accent); color: #000; border: none; padding: 15px 35px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 1.2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #sidebar { position: absolute; left: 0; top: 0; width: 450px; height: 100%; background: rgba(15,15,15,0.98); z-index: 150; transform: translateX(-100%); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; border-right: 3px solid var(--accent); }
        #sidebar.open { transform: translateX(0); }
        .group-tabs { display: flex; overflow-x: auto; padding: 15px; gap: 10px; background: #1a1a1a; scrollbar-width: none; }
        .tab { padding: 10px 20px; background: #333; border-radius: 4px; white-space: nowrap; cursor: pointer; font-weight: bold; }
        .tab.active { background: var(--accent); color: #000; }
        .channel-list { flex: 1; overflow-y: auto; padding: 15px; }
        .item { display: flex; align-items: center; gap: 15px; padding: 15px; background: #1a1a1a; margin-bottom: 10px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
        .item:focus, .item:hover { border-color: var(--accent); background: #222; outline: none; }
        .item img { width: 70px; height: 45px; object-fit: contain; background: #fff; border-radius: 4px; }
        .ch-name { font-size: 1.1rem; font-weight: 500; }
        @media (max-width: 600px) { #sidebar { width: 100%; } }
    </style>
</head>
<body>

<button class="menu-btn" onclick="toggleMenu()">DANH SÁCH</button>

<div id="sidebar">
    <div style="padding: 30px 20px 10px 20px"><h2 style="color:var(--accent); margin:0">DANH SÁCH KÊNH</h2></div>
    <div class="group-tabs" id="tab-container"></div>
    <div class="channel-list" id="channel-container"></div>
</div>

<div id="main-player">
    <video id="video" controls autoplay playsinline></video>
</div>

<script>
    const M3U_URL = 'https://raw.githubusercontent.com/thung65/Iptv-vietnam/main/ducnt123';
    const PROXY = 'https://api.allorigins.win/raw?url=';
    
    let allChannels = [];
    let shakaPlayer;

    async function init() {
        try {
            const res = await fetch(PROXY + encodeURIComponent(M3U_URL));
            const text = await res.text();
            parse(text);
        } catch (e) {
            console.error("Lỗi:", e);
        }
    }

    function parse(data) {
        const lines = data.split('\n');
        let current = null;
        const groups = new Set(['TẤT CẢ']);

        lines.forEach(line => {
            line = line.trim();
            if (line.startsWith('#EXTINF')) {
                const name = line.split(',')[1] || "Kênh";
                const logo = line.match(/tvg-logo="([^"]+)"/)?.[1] || "";
                const group = line.match(/group-title="([^"]+)"/)?.[1] || "Khác";
                groups.add(group);
                current = { name, logo, group, license: "" };
            } else if (line.includes('license_key=')) {
                // Lấy khóa ClearKey từ file của bạn
                current.license = line.split('=')[1].replace(/"/g, '');
            } else if (line.startsWith('http')) {
                current.url = line;
                allChannels.push(current);
            }
        });

        renderTabs(Array.from(groups));
        renderChannels('TẤT CẢ');
        if (allChannels.length > 0) play(allChannels[0], false);
    }

    function renderTabs(groups) {
        const container = document.getElementById('tab-container');
        // Ưu tiên TẤT CẢ lên đầu, Quốc Tế xuống cuối
        groups.sort((a, b) => (a === 'TẤT CẢ' ? -1 : (a === 'Quốc Tế' ? 1 : a.localeCompare(b))));
        
        groups.forEach(g => {
            const t = document.createElement('div');
            t.className = 'tab'; t.innerText = g;
            t.onclick = () => {
                document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
                t.classList.add('active');
                renderChannels(g);
            };
            container.appendChild(t);
        });
        container.firstChild.classList.add('active');
    }

    function renderChannels(group) {
        const container = document.getElementById('channel-container');
        container.innerHTML = '';
        const filtered = group === 'TẤT CẢ' ? allChannels : allChannels.filter(c => c.group === group);

        filtered.forEach(ch => {
            const item = document.createElement('div');
            item.className = 'item'; item.tabIndex = 0;
            item.innerHTML = `<img src="${ch.logo}"><span class="ch-name">${ch.name}</span>`;
            item.onclick = () => play(ch, true);
            item.onkeydown = (e) => { if(e.key === 'Enter') play(ch, true); };
            container.appendChild(item);
        });
    }

    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('open');
        if(document.getElementById('sidebar').classList.contains('open')) {
            setTimeout(() => document.querySelector('.item')?.focus(), 200);
        }
    }

    async function play(ch, close) {
        const v = document.getElementById('video');
        if (close) toggleMenu();
        if (shakaPlayer) await shakaPlayer.destroy();

        if (ch.url.includes('.mpd')) {
            shaka.polyfill.installAll();
            shakaPlayer = new shaka.Player(v);
            if (ch.license) {
                // Xử lý ClearKey cho HBO, AXN, CNN...
                const keyObj = JSON.parse(ch.license);
                shakaPlayer.configure({
                    drm: { clearKeys: keyObj.keys.reduce((acc, k) => { acc[k.kid] = k.k; return acc; }, {}) }
                });
            }
            await shakaPlayer.load(ch.url);
        } else {
            if (Hls.isSupported()) {
                const hls = new Hls(); hls.loadSource(ch.url); hls.attachMedia(v);
            } else { v.src = ch.url; }
        }
    }

    init();
</script>
</body>
</html>
