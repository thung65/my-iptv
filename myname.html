<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>TV SAMSUNG Q70B - DRM OK</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #video-box { width: 100%; height: 35vh; background: #000; position: relative; border-bottom: 2px solid #ffcc00; }
        video { width: 100%; height: 100%; outline: none; }
        #fs-btn { position: absolute; bottom: 10px; right: 10px; width: 35px; height: 35px; background: #ffcc00; border: none; cursor: pointer; z-index: 10; font-weight: bold; border-radius: 4px; color: #000; }
        
        /* Tab: Tất cả ở đầu - Quốc tế ở cuối */
        .tabs { display: flex; overflow-x: auto; background: #111; padding: 10px; gap: 8px; border-bottom: 1px solid #333; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tabs button { padding: 10px 18px; border: none; background: #222; color: #999; font-weight: bold; border-radius: 4px; white-space: nowrap; outline: none; cursor: pointer; }
        .tabs button.active { background: #ffcc00; color: #000; }
        
        #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding: 12px; overflow-y: auto; flex: 1; }
        .item { background: #111; padding: 12px 5px; text-align: center; border: 2px solid #222; border-radius: 6px; outline: none; cursor: pointer; }
        .item.active { border-color: #ffcc00; background: #1a1a00; }
        .item img { height: 35px; max-width: 90%; object-fit: contain; margin-bottom: 5px; }
        .item span { font-size: 10px; display: block; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

<div id="video-box">
    <video id="video" controls autoplay playsinline></video>
    <button id="fs-btn" onclick="document.getElementById('video').requestFullscreen()">[ ]</button>
</div>

<div class="tabs" id="tab-bar">
    <button class="active" onclick="setTab('ALL', this)">TẤT CẢ</button>
    <button onclick="setTab('VTV', this)">VTV</button>
    <button onclick="setTab('VTVCAB', this)">VTVCAB</button>
    <button onclick="setTab('HTV', this)">HTV</button>
    <button onclick="setTab('SCTV', this)">SCTV</button>
    <button onclick="setTab('ĐỊA PHƯƠNG', this)">ĐỊA PHƯƠNG</button>
    <button onclick="setTab('QUỐC TẾ', this)">QUỐC TẾ</button>
</div>

<div id="list"></div>

<script>
    // Dán danh sách tách lẻ của bạn vào đây
    const FIXED_CHANNELS = [
        // Ví dụ kênh dùng Hex (SCTV)
        { n: "SCTV9", u: "https://livevlisctcdnw.seenow.vn/mean/SCTV9/manifest.mpd", i: "22a9a9a63d2746df9f90c184c596105a", k: "2d9d24caeaea42f8b44e413fe04f0e5c", l: "https://vnepg.site/logos/53.png", g: "SCTV" },
        // Ví dụ kênh dùng Base64 (HBO)
        { n: "HBO", u: "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/hbo.smil/manifest.mpd", i: "Cd3+PWOGPK+ut50FRrCYqw", k: "PeDzjc8BSCff1b7Dh0PGog", l: "https://vnepg.site/logos/129.png", g: "QUỐC TẾ" },
        // Bạn dán tiếp các kênh khác của bạn vào...
    ];

    let video = document.getElementById('video'), player, curTab = "ALL";

    // Hàm chuyển đổi thông minh: Giữ nguyên Hex, chuyển đổi Base64
    function formatKey(v) {
        if (!v) return "";
        v = v.trim();
        // Nếu là Hex (32 ký tự, không có dấu + hay /) thì giữ nguyên
        if (v.length === 32 && /^[0-9a-fA-F]+$/.test(v)) return v;
        // Ngược lại thì giải mã từ Base64 sang Hex
        try {
            return Array.from(atob(v.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0).toString(16).padStart(2,'0')).join('');
        } catch(e) { return v; }
    }

    async function init() {
        shaka.polyfill.installAll();
        player = new shaka.Player(video);
        
        // BUFFER THẤP NHẤT (0.1)
        player.configure({ 
            streaming: { bufferingGoal: 0.1, rebufferingGoal: 0.1, jumpLargeGaps: true } 
        });

        render();
        if(FIXED_CHANNELS.length > 0) play(FIXED_CHANNELS[0]);
    }

    async function play(ch) {
        await player.unload();
        
        // Nạp DRM
        if (ch.i && ch.k) {
            player.configure({
                drm: { clearKeys: { [formatKey(ch.i)]: formatKey(ch.k) } }
            });
        } else {
            player.configure({ drm: { clearKeys: {} } });
        }

        try {
            await player.load(ch.u);
        } catch (e) {
            video.src = ch.u;
            video.play().catch(() => {});
        }
        render(ch.u);
    }

    function render(activeUrl = "") {
        const box = document.getElementById('list');
        box.innerHTML = "";
        FIXED_CHANNELS.forEach(ch => {
            if (curTab !== 'ALL' && ch.g !== curTab) return;
            const div = document.createElement('div');
            div.className = `item ${ch.u === activeUrl ? 'active' : ''}`;
            div.innerHTML = `<img src="${ch.l}" onerror="this.src='https://via.placeholder.com/50?text=TV'"><span>${ch.n}</span>`;
            div.onclick = () => play(ch);
            box.appendChild(div);
        });
    }

    function setTab(t, btn) {
        curTab = t;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    init();
</script>
</body>
</html>
